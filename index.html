<!-- The site root is the tool, not a document about the tool.

     GitHub Pages serves a directory's index.html at that directory's path, and
     the app lives in blue-grid/ alongside the layers, the corpus and the fonts
     it reads by relative path. Moving those to the root to save one hop would
     mean rewriting every path the app and the operator manual both use, so the
     root redirects instead. The explainer is still one click away. -->
<link rel="canonical" href="blue-grid/">
<meta http-equiv="refresh" content="0; url=blue-grid/">
<style>
  html{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:#0b0e15;color:#8b93a5;
       font:14px/1.6 ui-sans-serif,-apple-system,system-ui,sans-serif}
  a{color:#0e9cbf}
</style>
<p>Opening BlueTrace… <a href="blue-grid/">continue</a></p>
