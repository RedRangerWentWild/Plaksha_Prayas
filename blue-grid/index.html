<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanished Blue Grid</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
/* ===========================================================================
   VANISHED BLUE GRID — DESIGN SYSTEM
   ---------------------------------------------------------------------------
   The skin before this one was a dark instrument: near-black panels, one blue
   accent, everything the same weight. It read as generic because every choice
   in it was a default — system font, system blue, system grey.

   This one is built on four commitments.

   1. THE CHROME IS MONOCHROME. Graphite, paper, hairlines. Every colour on
      screen belongs to the data or to a verdict. An officer scanning this
      should be able to say what each colour means, and there are seven of
      them, not twenty.
   2. PANELS FLOAT ON PAPER. Rounded, near-white, softly shadowed, lifted off
      a full-bleed map. Nothing is welded to an edge; the map is continuous
      underneath, so the reader always knows they are looking at ground.
   3. PAST AND PRESENT ARE DIFFERENT COLOURS, NOT DIFFERENT BLUES. Water that
      survived is cyan. Water that was lost is amber, and it carries its own
      1984–99 shoreline as a drawn line. The old palette put #1f6feb next to
      #58a6ff and expected a viewer to tell two decades apart by saturation.
   4. NUMBERS ARE MONOSPACED AND TABULAR, PROSE IS NOT. A column of distances
      that does not align on the decimal cannot be scanned, and this document
      gets printed and signed.
   =========================================================================== */

/* Self-hosted. A demo that loses the network must not also lose its
   typeface — and a font swapping in two seconds after the map is the single
   most obvious tell that a page was thrown together. */
@font-face{font-family:Geist;font-style:normal;font-weight:100 900;font-display:swap;
  src:url(assets/fonts/geist-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Geist;font-style:normal;font-weight:100 900;font-display:swap;
  src:url(assets/fonts/geist-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,
    U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,
    U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:100 900;font-display:swap;
  src:url(assets/fonts/geist-mono-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:100 900;font-display:swap;
  src:url(assets/fonts/geist-mono-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,
    U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,
    U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  /* ---- paper ---------------------------------------------------------- */
  --ground:#e7e9ee;          /* behind everything; seen at the page edges */
  --card:#ffffff;
  --raised:#f2f4f7;          /* controls sitting on a card */
  --sunken:#f6f7f9;          /* wells, inputs, table stripes */
  --hover:#eceef2;

  --line:rgba(13,17,28,.08);
  --line-hot:rgba(13,17,28,.15);
  --line-bright:rgba(13,17,28,.26);

  /* ---- ink ------------------------------------------------------------ */
  --ink:#0b0e14;
  --text:#171b23;
  --dim:#5b6373;
  --faint:#8b93a3;

  /* The interactive accent is graphite, not a hue. A government screening
     tool that paints its buttons blue is telling the reader that blue means
     "clickable" at the same time the map is telling them blue means "water". */
  --act:#141922;
  --act-hi:#242b38;
  --act-ink:#ffffff;

  /* One hue for focus and for links, used nowhere else. */
  --focus:#0e9cbf;
  --focus-ring:rgba(14,156,191,.22);

  /* ---- verdicts -------------------------------------------------------- */
  --v-reject:#c8342a;    --v-reject-bg:#fdf1f0;   --v-reject-line:#f0c4c0;
  --v-refer:#6d28d9;     --v-refer-bg:#f5f1fe;    --v-refer-line:#d9caf7;
  --v-conditions:#a5600b;--v-conditions-bg:#fdf5e8;--v-conditions-line:#f0dcb6;
  --v-clear:#0a7a52;     --v-clear-bg:#edf8f3;    --v-clear-line:#bde3d3;

  /* ---- the map palette --------------------------------------------------
     Mirrored by PALETTE in the script. These are the colours the rasters are
     RE-TINTED to in the browser; gee_blue_grid.js still exports its own, and
     recolourLayer() overwrites them on load, so the two can disagree without
     the legend lying. The important pairing is the first two: water that
     survived against water that did not, in two different hue families. */
  --lyr-present:#0e9cbf;     /* water 2000–21 — alive, cool */
  --lyr-historic:#d0862b;    /* water 1984–99 — lost, warm */
  --lyr-encroached:#e0392e;  /* built on former water */
  --lyr-flowpath:#3b3f9e;    /* drainage line — dark, thin, a channel */
  --lyr-floodprone:#a78bfa;  /* low ground — pale, large, a wash */
  /* Not a layer. The mark pinned on ground the traced runoff reaches, kept
     clear of the lost-water amber by being much lighter as well as greener. */
  --mark-yellow:#ffd60a;

  --mono:'Geist Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --sans:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;

  --r-xl:18px; --r-lg:14px; --r-md:10px; --r-sm:8px; --r-xs:6px;

  /* Three shadow depths, layered rather than single-blur: a tight contact
     shadow for the edge, a wide ambient one for the lift. A single large
     blur is what makes a light UI look like a mockup. */
  --sh-1:0 1px 2px rgba(13,17,28,.05), 0 1px 1px rgba(13,17,28,.03);
  --sh-2:0 1px 2px rgba(13,17,28,.05), 0 6px 14px -6px rgba(13,17,28,.10);
  --sh-3:0 1px 2px rgba(13,17,28,.06), 0 10px 26px -8px rgba(13,17,28,.16),
         0 28px 56px -28px rgba(13,17,28,.14);

  --pad:12px;                /* the gutter every floating thing keeps */
  --topbar-h:56px;
  --dock-gap:12px;
  /* The space the dock may occupy, as insets from each edge. Updated when the
     queue collapses so the dock reclaims the room rather than staying offset
     against a rail that is no longer there. */
  --rail-l:324px;
  --rail-r:364px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ground);color:var(--text);
  font-family:var(--sans);font-size:14px;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:'cv11' 1}
#map{position:absolute;inset:0;background:var(--ground)}
::selection{background:rgba(14,156,191,.2)}

/* ---- maplibre furniture, relit ---- */
.maplibregl-ctrl-attrib{font:400 9px/1.5 var(--sans)!important;
  background:rgba(255,255,255,.78)!important;backdrop-filter:blur(8px);
  border-radius:6px 0 0 0!important;color:var(--faint)!important}
.maplibregl-ctrl-attrib a{color:var(--dim)!important}
.maplibregl-ctrl-group{background:rgba(255,255,255,.92)!important;
  backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  border:1px solid var(--line)!important;border-radius:var(--r-md)!important;
  box-shadow:var(--sh-2)!important;overflow:hidden}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button{width:32px!important;height:32px!important}
.maplibregl-ctrl-group button span{opacity:.62}
/* The zoom control stacks above the basemap switch, which sits above the dock. */
.maplibregl-ctrl-bottom-right{bottom:96px!important;right:2px!important}

/* ===========================================================================
   SURFACES
   .panel is the single surface primitive. Slightly translucent with a real
   blur behind it: enough that the map keeps moving underneath and the panel
   reads as floating, not enough to cost a single point of text contrast.
   =========================================================================== */
.panel{background:rgba(255,255,255,.93);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--sh-3);
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5)}
.panel.flat{box-shadow:var(--sh-1)}

/* Section label. One style, used in every panel, so a heading always means
   the same thing. */
.lbl{font:600 9.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint)}

/* ---- scrollbars ---- */
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-hot) transparent}
.scroll::-webkit-scrollbar{width:7px;height:7px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--line-hot);border-radius:4px;
  border:2px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--line-bright);background-clip:content-box}

/* ===========================================================================
   TOP BAR
   A floating card, not a welded bar. The map runs underneath it to the top of
   the window, which is what keeps the whole thing reading as one continuous
   piece of ground with instruments laid on it.
   =========================================================================== */
#top{position:absolute;top:var(--pad);left:var(--pad);right:var(--pad);
  height:var(--topbar-h);z-index:30;display:flex;align-items:center;gap:10px;
  padding:0 10px 0 14px;border-radius:var(--r-lg)}

.brand{display:flex;align-items:center;gap:10px;flex:none;user-select:none}
.brand .mark{width:26px;height:26px;flex:none;display:grid;place-items:center;
  border-radius:8px;background:var(--act);box-shadow:var(--sh-1)}
.brand .txt{display:flex;flex-direction:column;gap:2px;line-height:1}
.brand b{font:650 13.5px/1 var(--sans);letter-spacing:-.018em;white-space:nowrap;
  color:var(--ink)}
.brand i{font-style:normal;font:500 9px/1 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap}

.vr{width:1px;height:24px;background:var(--line);flex:none;margin:0 2px}

/* Native select, restyled. A custom dropdown would be more controllable and
   would also need keyboard handling, an outside-click listener and a focus
   trap — three things the platform already gets right. */
select{appearance:none;-webkit-appearance:none;
  background:var(--raised);color:var(--text);border:1px solid transparent;
  border-radius:var(--r-sm);padding:8px 28px 8px 11px;font:550 12.5px/1 var(--sans);
  cursor:pointer;outline:none;transition:background .15s,border-color .15s,box-shadow .15s;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238b93a3' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center}
select:hover{background-color:var(--hover)}
select:focus-visible{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring)}

/* Segmented control. The mode IS the product's posture, so it gets the centre
   of the bar and a solid graphite pill rather than three separate buttons. */
.segmented{display:flex;gap:2px;background:var(--raised);border-radius:var(--r-md);
  padding:3px;margin:0 auto;position:relative}
.segmented button{background:none;border:none;color:var(--dim);cursor:pointer;
  font:550 12.5px/1 var(--sans);padding:8px 15px;border-radius:7px;
  display:flex;align-items:center;gap:7px;white-space:nowrap;position:relative;
  transition:color .18s,background .18s}
.segmented button:hover{color:var(--ink)}
.segmented button.on{background:var(--act);color:var(--act-ink);
  box-shadow:0 1px 2px rgba(13,17,28,.2),0 2px 6px -2px rgba(13,17,28,.25)}
.segmented button .sd{width:5px;height:5px;border-radius:50%;background:currentColor;
  opacity:.3;transition:opacity .18s}
.segmented button.on .sd{opacity:1}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--card);border:1px solid var(--line-hot);color:var(--text);
  border-radius:var(--r-sm);padding:8px 12px;font:550 12px/1 var(--sans);
  cursor:pointer;white-space:nowrap;box-shadow:var(--sh-1);
  transition:background .15s,border-color .15s,box-shadow .15s,transform .12s}
.btn:hover{background:var(--sunken);border-color:var(--line-bright)}
.btn:active{transform:translateY(.5px)}
.btn:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring)}
.btn svg{flex:none;opacity:.7}
.btn.primary{background:var(--act);border-color:var(--act);color:var(--act-ink);
  box-shadow:0 1px 2px rgba(13,17,28,.24),0 4px 10px -4px rgba(13,17,28,.3)}
.btn.primary:hover{background:var(--act-hi);border-color:var(--act-hi)}
.btn.primary svg{opacity:.85}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--dim)}
.btn.ghost:hover{background:var(--raised);color:var(--ink)}
.btn:disabled{opacity:.42;cursor:default;pointer-events:none}

.iconbtn{background:none;border:none;color:var(--faint);cursor:pointer;padding:5px;
  border-radius:var(--r-xs);display:grid;place-items:center;flex:none;
  transition:color .15s,background .15s}
.iconbtn:hover{color:var(--ink);background:var(--raised)}

/* ===========================================================================
   LEFT — the queue
   A browsing aid, not the product, so it collapses. It opens by default only
   where browsing is the point (timeline and downstream) and starts collapsed
   in screening, where the map click is the input.
   =========================================================================== */
/* The reserved space at the foot is not decoration: the map key sits in the
   bottom-left corner and the zoom control in the bottom-right, and at 760 px
   of viewport height a rail sized only against the header runs straight
   through both of them. */
#left{position:absolute;left:var(--pad);top:calc(var(--pad) + var(--topbar-h) + 10px);
  width:300px;z-index:20;max-height:calc(100vh - var(--topbar-h) - 268px);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .24s}
#left.collapsed{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}

#queueToggle{position:absolute;left:var(--pad);top:calc(var(--pad) + var(--topbar-h) + 10px);
  z-index:19;opacity:0;pointer-events:none;transition:opacity .24s}
#queueToggle.show{opacity:1;pointer-events:auto}

.phead{display:flex;align-items:center;gap:8px;padding:13px 14px 12px;
  border-bottom:1px solid var(--line);flex:none}
.phead .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font:550 9.5px/1 var(--mono);letter-spacing:.04em;color:var(--dim);
  background:var(--raised);border-radius:20px;padding:4px 8px;flex:none;
  font-variant-numeric:tabular-nums}

#list{padding:6px;max-height:100%}
.item{display:flex;align-items:center;gap:10px;padding:9px;border-radius:var(--r-sm);
  cursor:pointer;border:1px solid transparent;transition:background .14s,border-color .14s}
.item:hover{background:var(--sunken)}
.item.on{background:var(--sunken);border-color:var(--line-hot);box-shadow:var(--sh-1)}
.item .rank{font:550 10px/1 var(--mono);color:var(--faint);width:16px;flex:none;
  font-variant-numeric:tabular-nums;text-align:right}
.item .dot{width:8px;height:8px;border-radius:3px;flex:none;
  box-shadow:0 0 0 2.5px rgba(255,255,255,.9)}
.item .body{flex:1;min-width:0}
.item .nm{font:550 12.5px/1.35 var(--sans);color:var(--text);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;display:block;letter-spacing:-.005em}
.item .sub{font:400 10.5px/1.45 var(--mono);color:var(--faint);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.item .sc{font:600 12px/1 var(--mono);color:var(--v-reject);flex:none;
  font-variant-numeric:tabular-nums}
.empty{padding:16px 14px;font:400 11.5px/1.7 var(--sans);color:var(--dim)}
.empty code{font:500 10.5px/1 var(--mono);background:var(--raised);padding:2px 5px;
  border-radius:4px;color:var(--text)}

/* ===========================================================================
   RIGHT — the inspector
   One column, but a strict order: what was decided, what decided it, what else
   was measured, what you can do about it.
   =========================================================================== */
#right{position:absolute;right:var(--pad);top:calc(var(--pad) + var(--topbar-h) + 10px);
  width:336px;z-index:20;max-height:calc(100vh - var(--topbar-h) - 190px);
  display:flex;flex-direction:column;gap:10px;overflow:visible}
#rightScroll{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;
  padding-right:3px;margin-right:-3px}
/* A flex item shrinks by default, and every panel here sets overflow:hidden to
   keep its corners rounded. Together those two mean that once the stack is
   taller than the rail it COMPRESSES instead of scrolling — silently, with no
   scrollbar and no clipped-text cue, because each panel crops its own content.
   Adding the downstream panel pushed the stack over that line and squeezed the
   verdict down to a three-pixel sliver of its own colour rule: the one thing on
   this rail that has to be readable, rendered as a coloured hairline. Panels
   keep their natural height; the rail scrolls. */
#rightScroll > *{flex:0 0 auto}

/* ---- screening parameters ----
   These two inputs change the verdict, so they belong against the verdict
   where the officer can see what was applied. */
#paramsBar{display:none;padding:13px 14px;gap:11px;flex-direction:column}
#paramsBar.on{display:flex}
/* Label above control, not beside it: "State revision — 30 m lake buffer"
   does not fit in a 265 px gutter, and an officer must not see the name of the
   rule that decides the verdict cut off mid-word. */
.pfield{display:flex;flex-direction:column;gap:6px}
.pfield select{width:100%;min-width:0;font-size:11.5px}
.numin{display:flex;align-items:center;background:var(--raised);
  border:1px solid transparent;border-radius:var(--r-sm);overflow:hidden;flex:1;
  transition:border-color .15s,box-shadow .15s}
.numin input{flex:1;min-width:0;background:none;border:none;color:var(--text);
  font:550 12px/1 var(--mono);padding:9px 10px;outline:none;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.numin input::-webkit-outer-spin-button,.numin input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.numin span{font:500 10.5px/1 var(--mono);color:var(--faint);padding:0 11px 0 4px;flex:none}
.numin:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring)}

/* ---- the catchment ledger ---- */
#statsCard{padding:14px}
#statsCard .phead{padding:0 0 11px;margin-bottom:2px}
.metric{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:none}
.metric .k{font:400 11.5px/1.45 var(--sans);color:var(--dim)}
.metric .v{font:550 13px/1 var(--mono);font-variant-numeric:tabular-nums;
  white-space:nowrap;flex:none;color:var(--text)}
.metric.big{padding:12px 0 13px}
.metric.big .v{font-size:27px;font-weight:650;letter-spacing:-.035em}
.v.red{color:var(--v-reject)} .v.blue{color:var(--lyr-present)}
.v.violet{color:#7c5cd6} .v.amber{color:#a5600b}
.bar{height:4px;border-radius:3px;background:var(--raised);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--lyr-historic),var(--lyr-encroached));
  transition:width 1.1s cubic-bezier(.22,1,.36,1)}

/* ---- the verdict ----
   A banner with a left rule, not a rounded pill. The rule is what makes it
   read as a stamp on a document rather than another button. */
#verdict{display:none;overflow:hidden}
#verdict.on{display:block;animation:rise .38s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.vbanner{position:relative;padding:15px 16px 15px 20px;border-bottom:1px solid var(--line)}
.vbanner::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:currentColor}
.vbanner .vrow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.vbanner .vic{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  font:700 11px/1 var(--sans);background:currentColor;flex:none}
.vbanner .vic span{color:#fff}
.vbanner .vt{font:650 13px/1.2 var(--sans);letter-spacing:-.005em}
.vbanner .vsub{font:400 12px/1.65 var(--sans);color:var(--text)}
.vbanner.reject{color:var(--v-reject);background:var(--v-reject-bg)}
.vbanner.refer{color:var(--v-refer);background:var(--v-refer-bg)}
.vbanner.conditions{color:var(--v-conditions);background:var(--v-conditions-bg)}
.vbanner.clear{color:var(--v-clear);background:var(--v-clear-bg)}

/* ---- drivers ----
   The measurements that actually produced the verdict, pulled out of the table
   and given size. In the old panel "0 m to the 1984–99 edge" — the finding —
   was rendered identically to "plot frontage assumed". */
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-bottom:1px solid var(--line)}
.drivers.one{grid-template-columns:1fr}
.driver{background:var(--card);padding:12px 14px}
.driver .dk{font:600 9px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);display:block;margin-bottom:6px}
.driver .dv{font:650 21px/1 var(--mono);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;display:block;color:var(--ink)}
.driver .dn{font:400 10.5px/1.45 var(--sans);color:var(--dim);display:block;margin-top:5px}
.driver.hot .dv{color:var(--v-reject)}
.driver.warn .dv{color:var(--v-conditions)}
.driver.ok .dv{color:var(--v-clear)}

/* ---- downstream ----
   The receiving cells are a ranked list of places, so they are set as a list
   of places: rank, coordinate, and the one number that ranked them. The
   coordinate is monospaced because an officer reads it off the screen and
   types it into something else. */
#downstream{display:none}
#downstream.on{display:block;animation:rise .38s cubic-bezier(.16,1,.3,1)}
#downstream .dsbody{padding:2px 14px 12px}
.rcv{display:flex;align-items:baseline;gap:9px;padding:7px 0;
  border-bottom:1px solid var(--line)}
.rcv:last-child{border-bottom:none}
.rcv .n{flex:0 0 13px;font:600 9.5px/1.6 var(--mono);color:var(--faint);
  font-variant-numeric:tabular-nums}
.rcv .co{flex:1;min-width:0;font:400 11px/1.5 var(--mono);color:var(--text);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rcv .ct{flex:none;font:550 11.5px/1.5 var(--mono);color:var(--lyr-flowpath);
  font-variant-numeric:tabular-nums}
.rcv .cl{display:block;font:400 9.5px/1.4 var(--sans);color:var(--faint)}
.dsnote{font:400 10.5px/1.65 var(--sans);color:var(--dim);margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.dsmiss{padding:13px 14px;font:400 11.5px/1.7 var(--sans);color:var(--dim)}
.dsmiss code{font:500 10.5px/1 var(--mono);background:var(--raised);padding:2px 5px;
  border-radius:4px;color:var(--text)}

/* ---- retention ----
   The requirement reads as a table because it is arithmetic; the options read
   as a numbered list because they are ranked. The drafted badge is not
   decoration: three of the four option chunks cite a source nobody here has
   read, and a panel that looked equally confident about all of them would be
   claiming more than the corpus does. */
#retention{display:none}
#retention.on{display:block;animation:rise .38s cubic-bezier(.16,1,.3,1)}
#retention .rbody{padding:2px 14px 12px}
#retention .phead{padding:12px 14px 10px}
.rnote{font:400 10.5px/1.65 var(--sans);color:var(--dim);margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.opt{display:flex;align-items:flex-start;gap:9px;padding:8px 0;
  border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:none}
.opt .n{flex:0 0 13px;font:600 9.5px/1.55 var(--mono);color:var(--faint);
  font-variant-numeric:tabular-nums}
.opt .ob{flex:1;min-width:0}
.opt .ob b{display:block;font:550 11.5px/1.45 var(--sans);color:var(--text)}
.opt .ob i{display:block;font-style:normal;font:400 10px/1.45 var(--sans);
  color:var(--faint);margin-top:2px}
.odraft{flex:none;font:600 8.5px/1 var(--mono);letter-spacing:.06em;
  text-transform:uppercase;color:var(--v-conditions);
  background:var(--v-conditions-bg);border:1px solid var(--v-conditions-line);
  border-radius:20px;padding:3px 6px;margin-top:1px}

/* ---- collapsible measurement table ---- */
.fold{border-bottom:1px solid var(--line)}
.fold>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;
  align-items:center;gap:8px;transition:background .14s}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:hover{background:var(--sunken)}
.fold>summary .lbl{flex:1}
.fold>summary .chev{transition:transform .22s;color:var(--faint);flex:none}
.fold[open]>summary .chev{transform:rotate(90deg)}
.foldbody{padding:2px 14px 13px}
.foldbody .metric .k{font-size:11px}
.foldbody .metric .v{font-size:11.5px}

.vactions{padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.vactions .btn{width:100%}

/* ===========================================================================
   DOCK — one slot at the bottom centre, two occupants
   The timeline owns it in timeline mode; the ask bar owns it everywhere else.
   They never coexist, so they never need to negotiate space, and the eye
   learns one place to look for "the thing I drive this with".
   Centred between the rails rather than on the viewport: centring on 50% of
   the window looks right only while both rails are the same width.
   =========================================================================== */
#dock{position:absolute;left:var(--rail-l);right:var(--rail-r);bottom:var(--dock-gap);
  margin-inline:auto;max-width:740px;z-index:25;
  display:flex;flex-direction:column;gap:9px;pointer-events:none}
#dock>*{pointer-events:auto}

/* ---- timeline ---- */
#timeline{padding:13px 18px 14px;
  transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .3s}
#timeline.hid{transform:translateY(calc(100% + 34px));opacity:0;pointer-events:none;
  position:absolute;bottom:0;left:0;right:0}
.trow{display:flex;align-items:center;gap:16px}
#play{width:40px;height:40px;flex:none;border-radius:50%;border:none;
  background:var(--act);color:var(--act-ink);font-size:12px;cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 1px 2px rgba(13,17,28,.24),0 4px 12px -4px rgba(13,17,28,.34);
  transition:transform .18s cubic-bezier(.34,1.4,.64,1),background .16s}
#play:hover{background:var(--act-hi);transform:scale(1.05)}
#play:active{transform:scale(.97)}
.tcore{flex:1;min-width:0}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  margin-bottom:9px}
/* The era label carries a colour dot that matches the water layer dominant at
   this point in the scrub, so "which water am I looking at" is answered in the
   same glance as "which year". */
.era{display:flex;align-items:center;gap:8px;flex:none}
.era .edot{width:9px;height:9px;border-radius:50%;flex:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.85);transition:background .3s}
#year{font:650 21px/1 var(--mono);letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
#caption{font:400 11.5px/1.5 var(--sans);color:var(--dim);text-align:right}

/* The track runs amber to cyan — the same two colours the water layers use —
   so the direction of the scrub is legible before it is dragged. */
input[type=range]{width:100%;height:5px;-webkit-appearance:none;appearance:none;
  border-radius:3px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--lyr-historic) 0%,#c9b3a0 42%,
    #7fb9c9 62%,var(--lyr-present) 100%);
  box-shadow:inset 0 0 0 1px rgba(13,17,28,.07)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;
  border-radius:50%;background:#fff;cursor:grab;border:none;
  box-shadow:0 0 0 1px rgba(13,17,28,.12),0 2px 5px rgba(13,17,28,.28)}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;
  background:#fff;box-shadow:0 0 0 1px rgba(13,17,28,.12),0 2px 5px rgba(13,17,28,.28)}
.ticks{display:flex;justify-content:space-between;margin-top:8px;
  font:450 9.5px/1.3 var(--mono);color:var(--faint);letter-spacing:.01em}
.ticks span:nth-child(2){opacity:.7}
.ticks span:last-child{text-align:right}

/* ---- ask ----
   Its own input, docked, always in the same place. The answer expands upward
   from here so the input never moves under the cursor as it grows.
   =========================================================================== */
#askDock{display:none;flex-direction:column;gap:9px}
#askDock.on{display:flex;animation:rise .3s cubic-bezier(.16,1,.3,1)}

#answerPanel{display:none;max-height:min(46vh,430px);overflow:hidden;flex-direction:column}
#answerPanel.on{display:flex}
.ahead{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;
  border-bottom:1px solid var(--line);flex:none}
.ahead .q{font:550 12.5px/1.45 var(--sans);flex:1;min-width:0;color:var(--ink)}
.ahead .gen{font:600 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);flex:none;padding-top:3px;display:flex;align-items:center;gap:5px}
/* While the model is still being asked, the answer on screen is the local one
   and it has to say so. Without this the deterministic paragraph rendered
   instantly, read as final, and was then silently swapped under the reader. */
.ahead .gen.pending{color:var(--focus)}
.spin{width:9px;height:9px;flex:none;border-radius:50%;
  border:1.5px solid rgba(14,156,191,.25);border-top-color:var(--focus);
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.atext.provisional{opacity:.55;transition:opacity .25s}
/* And when it is swapped, the swap is visible. */
.atext.settled{animation:settle 1.2s ease-out}
@keyframes settle{0%{background:rgba(14,156,191,.14);box-shadow:0 0 0 6px rgba(14,156,191,.14)}
  100%{background:transparent;box-shadow:0 0 0 6px transparent}}
#answer{padding:14px 15px;overflow-y:auto;min-height:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;background:rgba(255,255,255,.93);border:1px solid var(--line);
  color:var(--dim);border-radius:20px;font:550 11px/1 var(--sans);cursor:pointer;
  box-shadow:var(--sh-1);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  transition:color .15s,border-color .15s,background .15s}
.chip:hover{color:var(--ink);border-color:var(--line-hot);background:#fff}

.askbar{display:flex;gap:9px;align-items:center;padding:7px 7px 7px 15px}
.askbar .qi{flex:none;color:var(--faint);display:grid;place-items:center}
.askbar input{flex:1;min-width:0;background:none;border:none;color:var(--text);
  font:400 13px/1.3 var(--sans);outline:none;padding:10px 0}
.askbar input::placeholder{color:var(--faint)}
.askbar .btn{padding:9px 15px}
kbd{font:500 9.5px/1 var(--mono);color:var(--faint);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:4px 5px;background:var(--sunken)}

/* ---- answer internals ---- */
.awarn{margin-bottom:11px;padding:9px 11px;border-radius:var(--r-xs);
  font:400 11px/1.65 var(--sans);color:var(--v-conditions);
  background:var(--v-conditions-bg);border-left:2px solid var(--v-conditions)}
.atext{font:400 12.5px/1.8 var(--sans);color:var(--text)}
.atext .cite{font:600 8.5px/1 var(--mono);color:var(--focus);padding:0 1px;
  vertical-align:super}
.arefuse{margin-top:11px;padding:9px 11px;border-radius:var(--r-xs);
  font:400 11px/1.65 var(--sans);color:var(--v-refer);
  background:var(--v-refer-bg);border-left:2px solid var(--v-refer)}
.asec{margin:16px 0 5px;font:600 9px/1 var(--mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint)}
#answer .metric{padding:7px 0}
#answer .metric .v{font-size:11.5px}
#answer .metric i{font-style:normal;color:var(--faint);font-size:10px;font-weight:400}
.awhat{margin:0;padding-left:16px;font:400 11.5px/1.75 var(--sans);color:var(--dim)}
.awhat li{margin-bottom:5px}
.asrc{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.asrc .n{flex:0 0 14px;font:600 9px/1.7 var(--mono);color:var(--focus)}
.asrc b{display:block;font:550 11.5px/1.45 var(--sans);color:var(--text)}
.asrc i{display:block;font-style:normal;font:400 10.5px/1.6 var(--sans);
  color:var(--dim);margin-top:2px}
.asrc em{display:block;font-style:normal;font:400 9px/1.5 var(--mono);
  color:var(--faint);margin-top:3px}
.asrc a{display:inline-block;font:550 9.5px/1 var(--sans);color:var(--focus);
  margin-top:5px;text-decoration:none}
.asrc a:hover{text-decoration:underline}

/* ===========================================================================
   MAP KEY
   The complaint this redesign started from was that two decades of water were
   indistinguishable. The palette fixes that on the map; this fixes it in
   words, one line per layer, with what the colour MEANS rather than what the
   file is called.
   =========================================================================== */
#legend{position:absolute;left:var(--pad);bottom:var(--dock-gap);z-index:20;
  width:214px;overflow:hidden;transition:opacity .25s}
#legend .lhead{padding:11px 13px 9px;border-bottom:1px solid var(--line)}
#legend .lbody{padding:7px 8px 8px}
#legend .key{display:flex;align-items:flex-start;gap:9px;padding:5px 5px;
  border-radius:var(--r-xs)}
#legend .key b{display:block;font:500 11px/1.35 var(--sans);color:var(--text)}
#legend .key i{display:block;font-style:normal;font:400 9.5px/1.4 var(--mono);
  color:var(--faint);margin-top:1px;letter-spacing:.01em}
.sw{width:12px;height:12px;border-radius:4px;flex:none;margin-top:1px;
  box-shadow:0 0 0 1px rgba(13,17,28,.1) inset}
/* Lost water is drawn on the map as a wash with its old shoreline on top, so
   its swatch is drawn the same way rather than as a flat block. */
.sw.ghost{background:none!important;border:1.5px dashed var(--lyr-historic);
  box-shadow:none;position:relative}
.sw.ghost::after{content:'';position:absolute;inset:1px;border-radius:2px;
  background:var(--lyr-historic);opacity:.22}
.sw.line{height:4px;margin-top:5px;border-radius:2px}
/* The receiving-ground mark, drawn the way the map draws it: two crossed bars
   with a dark casing, so the swatch is the thing it stands for rather than a
   coloured square standing in for it. */
.sw.cross{background:none!important;box-shadow:none;position:relative}
.sw.cross::before,.sw.cross::after{content:'';position:absolute;left:50%;top:0;
  bottom:0;width:2.5px;margin-left:-1.25px;border-radius:2px;
  background:var(--mark-yellow);box-shadow:0 0 0 1px rgba(11,14,20,.5)}
.sw.cross::before{transform:rotate(45deg)}
.sw.cross::after{transform:rotate(-45deg)}

/* ---- basemap switch ---- */
#basePill{position:absolute;right:var(--pad);bottom:var(--dock-gap);z-index:22;
  display:none;padding:3px;gap:2px;border-radius:var(--r-md)}
#basePill.on{display:flex}
#basePill button{background:none;border:none;color:var(--dim);cursor:pointer;
  font:550 11px/1 var(--sans);padding:7px 12px;border-radius:7px;
  transition:color .16s,background .16s}
#basePill button:hover{color:var(--ink)}
#basePill button.on{background:var(--act);color:var(--act-ink)}

/* ===========================================================================
   TRANSIENTS
   =========================================================================== */
#toast{position:absolute;top:calc(var(--pad) + var(--topbar-h) + 10px);left:50%;
  transform:translateX(-50%);max-width:460px;z-index:40;padding:11px 38px 11px 13px;
  font:400 11.5px/1.6 var(--sans);color:var(--v-conditions);display:none;cursor:pointer;
  border-color:var(--v-conditions-line);background:var(--v-conditions-bg)}
#toast::after{content:'\00d7';position:absolute;top:9px;right:13px;font-size:16px;
  color:var(--faint)}

#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:18;
  padding:16px 20px;text-align:center;display:none;pointer-events:none;
  animation:rise .3s cubic-bezier(.16,1,.3,1)}
#hint b{display:block;font:600 13px/1.3 var(--sans);margin-bottom:5px;color:var(--ink)}
#hint span{font:400 11.5px/1.6 var(--sans);color:var(--dim)}

#map.aim .maplibregl-canvas{cursor:crosshair}

/* The marker shows the PROBE DISC at its true radius, not a fixed dot. The
   check reduces over a disc about a plot wide, and a 14 px dot said nothing
   about how much ground that was — so a reader could not tell whether the
   verdict came from their plot or from the lake fifty metres away. */
.probe{position:relative;display:grid;place-items:center}
.probe .disc{position:absolute;border-radius:50%;background:currentColor;opacity:.2}
.probe .ring{position:absolute;border-radius:50%;border:1.5px dashed currentColor;
  opacity:.75}
.probe .core{width:11px;height:11px;border-radius:50%;background:currentColor;
  box-shadow:0 0 0 2.5px #fff,0 1px 4px rgba(13,17,28,.4);z-index:2}
.probe .pulse{position:absolute;width:13px;height:13px;border-radius:50%;
  background:currentColor;animation:ping 2.1s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(3.4);opacity:0}}

/* ===========================================================================
   MODAL
   =========================================================================== */
#modal{position:absolute;inset:0;z-index:50;background:rgba(210,214,222,.6);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;place-items:center;padding:36px}
#modal.on{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:min(760px,100%);max-height:86vh;overflow-y:auto;padding:30px 32px;
  background:#fff;border-radius:var(--r-xl);
  animation:rise .3s cubic-bezier(.16,1,.3,1)}
.sheet h2{font:650 20px/1.25 var(--sans);letter-spacing:-.025em;margin-bottom:6px;
  color:var(--ink)}
.sheet .lede{font:400 12.5px/1.7 var(--sans);color:var(--dim);margin-bottom:22px}
.case{padding:14px 0;border-top:1px solid var(--line)}
.case .t{font:600 12.5px/1.3 var(--sans);margin-bottom:5px;color:var(--ink)}
.case .d{font:400 11.5px/1.7 var(--sans);color:var(--dim)}
.case .n{font-family:var(--mono);color:var(--v-conditions);font-weight:600;
  font-variant-numeric:tabular-nums}
.sheet a{color:var(--focus);text-decoration:none;font-size:10.5px}
.sheet a:hover{text-decoration:underline}
#modalClose{position:absolute;top:22px;right:26px;background:#fff;
  border:1px solid var(--line-hot);color:var(--dim);width:34px;height:34px;
  border-radius:50%;font-size:18px;cursor:pointer;line-height:1;display:grid;
  place-items:center;box-shadow:var(--sh-2);transition:color .15s,border-color .15s}
#modalClose:hover{color:var(--ink);border-color:var(--line-bright)}

/* ---------- certificate ----------
   The screen styling and the print styling finally agree, because the whole
   interface is now the colour paper is. What you sign is what you saw. */
.cert h3{font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:24px 0 9px;border-bottom:1px solid var(--line);
  padding-bottom:7px}
.chead{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.cref{text-align:right;flex:none;font:400 10px/1.55 var(--mono);color:var(--dim)}
.cref b{display:block;font-size:12px;color:var(--ink);margin-bottom:3px}
.cert-decision{margin:20px 0 11px;padding:15px 18px;border-radius:var(--r-md);
  font:700 17px/1.2 var(--sans);letter-spacing:-.01em;border:1px solid}
.cert-decision.reject{background:var(--v-reject-bg);color:var(--v-reject);
  border-color:var(--v-reject-line)}
.cert-decision.refer{background:var(--v-refer-bg);color:var(--v-refer);
  border-color:var(--v-refer-line)}
.cert-decision.conditions{background:var(--v-conditions-bg);color:var(--v-conditions);
  border-color:var(--v-conditions-line)}
.cert-decision.clear{background:var(--v-clear-bg);color:var(--v-clear);
  border-color:var(--v-clear-line)}
.creason{margin:0 0 4px 18px;font:400 12px/1.8 var(--sans);color:var(--text)}
.creason li{margin-bottom:6px}
.crow{display:flex;justify-content:space-between;gap:20px;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:11.5px}
.crow span:first-child{color:var(--dim);flex:none;max-width:52%}
.crow span:last-child{text-align:right;font-family:var(--mono);font-size:11px;
  font-variant-numeric:tabular-nums}
.cfields{display:flex;gap:14px}
.cfields label{flex:1;font:600 9.5px/1 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);display:flex;flex-direction:column;gap:5px}
.cin{background:transparent;border:none;border-bottom:1px solid var(--line-hot);
  color:var(--text);font:400 12px/1.4 var(--sans);padding:6px 2px;outline:none}
.cin:focus{border-color:var(--focus)}
.csnap{width:100%;border-radius:var(--r-sm);border:1px solid var(--line);margin-top:5px}
.ccanon{font:400 9.5px/1.7 var(--mono);color:var(--dim);word-break:break-all;
  background:var(--sunken);padding:10px 12px;border-radius:var(--r-sm);
  border:1px solid var(--line)}
.cnote{font:400 11px/1.7 var(--sans);color:var(--dim);margin-top:9px}
.cbox{height:66px;border:1px solid var(--line-hot);border-radius:var(--r-sm);margin-top:5px}
.ccheck{font:400 11.5px/1.55 var(--sans);color:var(--dim);margin-top:10px}
.csign{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;margin-top:18px;
  font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint)}
.csign hr{border:none;border-top:1px solid var(--line-hot);margin-top:24px}
.cfoot{font:400 10.5px/1.75 var(--sans);color:var(--faint);margin-top:22px;
  border-top:1px solid var(--line);padding-top:14px}

/* Print the modal rather than generating a PDF: no library to load, no popup
   for a blocker to eat, nothing that needs the network, and the document
   stays on the projector while it prints. */
@media print{
  html,body{background:#fff;color:#000;overflow:visible;height:auto}
  #map,#top,#left,#right,#legend,#dock,#toast,#hint,#boot,#modalClose,
  #queueToggle,#basePill,.noprint{display:none!important}
  #modal{position:static;display:block!important;background:none;backdrop-filter:none;
    padding:0}
  .sheet{width:100%;max-height:none;overflow:visible;border:none;box-shadow:none;
    background:#fff;backdrop-filter:none;padding:0;animation:none}
  .cert *,.sheet *{color:#000!important}
  .cert h3{color:#555!important;border-color:#bbb!important}
  .crow{border-color:#ddd!important}
  .cert-decision{border:2px solid #000!important;background:#fff!important}
  .ccanon{background:#f4f4f4!important;border-color:#bbb!important}
  .cbox,.csign hr,.cin{border-color:#888!important}
  .cfoot,.cnote{color:#444!important}
}

/* Motion here is entrance-only — nothing in this interface animates to convey
   a value. Someone who has asked the system not to move things should still
   get every panel at full opacity, which means the end state of every keyframe
   has to be the default state, not something an animation grants. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

/* ===========================================================================
   BOOT
   =========================================================================== */
#boot{position:absolute;inset:0;z-index:60;background:var(--ground);display:grid;
  place-items:center;transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}
.bootin{display:flex;flex-direction:column;align-items:center;gap:18px}
.bootmark{width:44px;height:44px;border-radius:13px;background:var(--act);
  display:grid;place-items:center;box-shadow:var(--sh-2)}
.bootbar{width:148px;height:3px;background:rgba(13,17,28,.08);border-radius:3px;
  overflow:hidden}
.bootbar i{display:block;height:100%;width:38%;border-radius:3px;background:var(--act);
  animation:sweep 1.25s cubic-bezier(.65,0,.35,1) infinite}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(370%)}}
#boot span{font:550 9.5px/1 var(--mono);letter-spacing:.2em;color:var(--faint);
  text-transform:uppercase}

/* ===========================================================================
   NARROW
   Not a phone design. This is a desk tool: rails over a map, meant for a
   monitor. What this block does is stop it BREAKING on a small screen — the
   dock's floor and the header's non-wrapping row together push the document
   wider than the viewport and produce horizontal scroll, which makes the map
   undraggable. Single column, secondary furniture dropped, and the controls
   that decide something kept.
   =========================================================================== */
@media (max-width:1180px){
  :root{--rail-l:296px;--rail-r:340px}
  #left{width:268px} #right{width:312px}
  .segmented button{padding:8px 12px;font-size:11.5px}
  .segmented button .sd{display:none}
  .brand i{display:none}
}
@media (max-width:960px){
  /* No left rail at all here, so the dock only has to clear the map key. */
  :root{--rail-l:236px;--rail-r:330px}
  #csvBtn span,#validateBtn span{display:none}
  #csvBtn,#validateBtn{padding:8px 9px}
  #left{display:none} #queueToggle{display:none}
}
@media (max-width:720px){
  :root{--pad:8px}
  #top{height:auto;min-height:52px;flex-wrap:wrap;gap:8px;padding:8px 10px}
  .brand .txt{gap:0}
  .vr{display:none}
  #city{max-width:132px;font-size:11px}
  .segmented{margin-left:auto;margin-right:0}
  .segmented button{padding:7px 10px;font-size:11px}
  #validateBtn{display:none}
  #legend{display:none} #basePill{right:8px;bottom:64px}
  #right{left:8px;right:8px;width:auto;top:auto;
    bottom:calc(var(--dock-gap) + 128px);max-height:46vh}
  #dock{left:8px;right:8px;max-width:none;bottom:8px}
  #timeline{padding:11px 13px}
  #play{width:34px;height:34px}
  #year{font-size:17px}
  #caption{display:none}
  .drivers{grid-template-columns:1fr}
  #toast{left:8px;right:8px;transform:none;max-width:none}
}
</style>
</head>
<body>

<div id="map"></div>

<header id="top" class="panel">
  <div class="brand">
    <span class="mark">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M1.7 5.1c1.26 0 1.26-1.85 2.52-1.85S5.48 5.1 6.74 5.1 8 3.25 9.26 3.25 10.52 5.1 11.78 5.1s1.26-1.85 2.52-1.85"
              stroke="#fff" stroke-width="1.25" stroke-linecap="round" opacity=".38"/>
        <path d="M1.7 9.2c1.26 0 1.26-1.85 2.52-1.85S5.48 9.2 6.74 9.2"
              stroke="#fff" stroke-width="1.25" stroke-linecap="round"/>
        <path d="M8.6 12.8h5.7" stroke="#ff6a5e" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="txt">
      <b>Vanished Blue Grid</b>
      <i>Encroachment screening</i>
    </span>
  </div>

  <span class="vr"></span>
  <select id="city" title="Study area"></select>

  <div class="segmented" id="modes">
    <button data-mode="timeline" class="on"><span class="sd"></span>Timeline</button>
    <button data-mode="approval"><span class="sd"></span>Plot check</button>
    <button data-mode="impact"><span class="sd"></span>Downstream</button>
  </div>

  <button class="btn ghost" id="validateBtn" title="How this compares with the municipal record">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1.2l4.6 2v3.9c0 2.8-1.9 4.7-4.6 5.7-2.7-1-4.6-2.9-4.6-5.7V3.2L7 1.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5 7l1.5 1.5L9.4 5.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Validation</span>
  </button>
  <button class="btn primary" id="csvBtn" title="Download the ranked list as CSV">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1.6v7.6m0 0L4.2 6.4M7 9.2l2.8-2.8M2 11.3h10" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Export CSV</span>
  </button>
</header>

<button class="btn panel" id="queueToggle" title="Show the ranked list">
  <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M2 7h10M2 10.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  <span id="queueToggleLabel">Sites</span>
</button>

<aside id="left" class="panel">
  <div class="phead">
    <span class="lbl" id="leftTitle">Priority sites</span>
    <span class="pill" id="leftCount"></span>
    <button class="iconbtn" id="queueHide" title="Hide">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M4 2.5L8.5 7 4 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="scroll" id="list"></div>
</aside>

<aside id="right">
  <div class="scroll" id="rightScroll">
    <section class="panel" id="paramsBar">
      <div class="pfield">
        <span class="lbl">Rule</span>
        <select id="ruleSel" title="Which buffer regime to apply"></select>
      </div>
      <div class="pfield">
        <span class="lbl">Plot</span>
        <span class="numin">
          <input id="plotM" type="number" min="5" max="300" step="5" value="30"
                 title="Assumed plot frontage; sets the probe radius">
          <span>m frontage</span>
        </span>
      </div>
      <!-- Blank by default, and blank is not zero. This tool does not know what
           storage the rainwater harvesting rule in force requires — no chunk in
           the corpus states a figure, deliberately, because nobody here has
           read the rule. So the officer supplies it the same way they choose a
           buffer regime: operator configuration, not a legal determination. -->
      <div class="pfield">
        <span class="lbl">Storage rule</span>
        <span class="numin">
          <input id="storageLpm2" type="number" min="0" max="200" step="1"
                 placeholder="&#8212;"
                 title="Storage the rainwater harvesting rule in force already requires, per m² of plot. Leave blank if you do not have the figure.">
          <span>L per m&#178;</span>
        </span>
      </div>
    </section>

    <section class="panel" id="verdict"></section>

    <section class="panel" id="downstream"></section>

    <section class="panel" id="retention"></section>

    <section class="panel" id="statsCard">
      <div class="phead"><span class="lbl" id="statsTitle">Catchment ledger</span></div>
      <div id="stats"></div>
      <div class="bar"><i id="lossBar" style="width:0"></i></div>
    </section>
  </div>
</aside>

<div class="panel" id="legend"></div>

<!-- The imagery IS the evidence in timeline mode, so the switch only appears
     where a light basemap is a defensible way to read the ground. -->
<div class="panel" id="basePill">
  <button data-base="map">Map</button>
  <button data-base="sat">Satellite</button>
</div>

<div class="panel" id="toast"></div>
<div class="panel" id="hint"></div>

<div id="dock">
  <section class="panel" id="answerPanel">
    <div class="ahead" id="answerHead"></div>
    <div class="scroll" id="answer"></div>
  </section>

  <div id="askDock">
    <div class="chips" id="askChips"></div>
    <div class="panel askbar">
      <span class="qi">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M6.2 6.3c.15-.9.93-1.5 1.86-1.5 1.03 0 1.85.72 1.85 1.66 0 1.5-1.8 1.4-1.8 2.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8.05" cy="11.2" r=".78" fill="currentColor"/></svg>
      </span>
      <input id="askQ" placeholder="Ask about this plot…" autocomplete="off" spellcheck="false">
      <kbd id="askHint">&#8629;</kbd>
      <button class="btn primary" id="askBtn">Ask</button>
    </div>
  </div>

  <footer class="panel" id="timeline">
    <div class="trow">
      <button id="play" title="Play the transition (space)">&#9654;</button>
      <div class="tcore">
        <div class="thead">
          <div class="era"><span class="edot" id="eraDot"></span><div id="year">2003&ndash;07</div></div>
          <div id="caption">The blue grid as the satellite record found it.</div>
        </div>
        <input type="range" id="slider" min="0" max="100" value="0">
        <div class="ticks">
          <span>Water 1984&ndash;99 &middot; Landsat 5 imagery</span>
          <span>crossfade</span>
          <span>Water 2000&ndash;21 &middot; Sentinel-2 imagery</span>
        </div>
      </div>
    </div>
  </footer>
</div>

<div id="modal"><div class="sheet" id="sheet"></div><button id="modalClose">&times;</button></div>

<div id="boot">
  <div class="bootin">
    <div class="bootmark">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M1.7 5.1c1.26 0 1.26-1.85 2.52-1.85S5.48 5.1 6.74 5.1 8 3.25 9.26 3.25 10.52 5.1 11.78 5.1s1.26-1.85 2.52-1.85"
              stroke="#fff" stroke-width="1.25" stroke-linecap="round" opacity=".38"/>
        <path d="M1.7 9.2c1.26 0 1.26-1.85 2.52-1.85S5.48 9.2 6.74 9.2"
              stroke="#fff" stroke-width="1.25" stroke-linecap="round"/>
        <path d="M8.6 12.8h5.7" stroke="#ff6a5e" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="bootbar"><i></i></div>
    <span>Reading the satellite record</span>
  </div>
</div>

<script>
'use strict';

// ===========================================================================
// CONFIG
// ===========================================================================
// bounds are [west, south, east, north] and MUST match the AOI rectangle used
// by gee_blue_grid.js for that city, or every overlay is pinned to the wrong
// ground and the tool quietly lies.
var CITIES = {
  bengaluru: {
    label: 'Bengaluru', sub: 'Bellandur & Varthur catchment',
    bounds: [77.63, 12.90, 77.75, 12.97],
    zones: 'Bommanahalli & Mahadevapura',
    hotspots: [
      {name:'HSR Layout / Parangipalya', lon:77.6403, lat:12.9114, px:244},
      {name:'Kasavanahalli',             lon:77.6759, lat:12.9324, px:138},
      {name:'Haralur',                   lon:77.6459, lat:12.9236, px:112},
      {name:'Panathur',                  lon:77.7078, lat:12.9324, px:71}
    ]
  },
  chennai: {
    label: 'Chennai', sub: 'Pallikaranai marsh',
    bounds: [80.180, 12.900, 80.280, 12.985],
    zones: 'Perungudi & Sholinganallur',
    hotspots: []
  }
};

// Raster layers fetched from data/<city>/.
var LAYERS = ['rgb2005','rgb2025','floodprone','flowpath','historic','present','encroached'];

// Painted bottom to top. 'historicEdge' is not a file: it is the 1984-99
// shoreline, traced out of historic.png in the browser. Drawing the lost water
// as a wash AND its old edge as a line is what finally separates the two eras,
// because a wash and a line cannot be confused with each other the way two
// blues could.
var MAP_LAYERS = ['rgb2005','rgb2025','floodprone','flowpath',
                  'historic','historicHatch','historicEdge','present','encroached'];

// Lookup tables, never drawn. These carry measurements rather than colour:
// buffers packs three distances in metres into R/G/B, history packs the last
// year water was recorded, and hydro packs upstream catchment. Drawing them
// would be meaningless; sampling them is the whole point.
//
// Membership of this list is what gets a layer decoded at 1:1 with smoothing
// off. A measurement layer left out of it is quietly area-averaged into byte
// codes that were never computed.
var DATA_LAYERS = ['buffers','history','hydro','routing'];
// The map palette, and the only place it is declared.
//
// gee_blue_grid.js still stamps its own colours into the PNGs, but every
// visual layer it exports is a SINGLE FLAT COLOUR with the shape carried in
// the alpha channel — so the colour in the file is decoration and the alpha is
// the data. tint() below re-paints each one on load, which means the palette
// can change here, in one file, without a two-minute Earth Engine run and ten
// fresh thumbnail URLs. The legend cannot go out of step with the map because
// both read this object.
//
// The pairing that matters is the first two. Water that survived is cyan;
// water that was lost is amber. The old palette set them as #1f6feb against
// #58a6ff and expected a viewer to tell two decades apart by saturation, on
// top of satellite imagery, at a glance, from the back of a room.
var PALETTE = {
  present:'#0e9cbf',      // water 2000-21 — alive, cool
  historic:'#d0862b',     // water 1984-99 — lost, warm
  historicHatch:'#d0862b',// the same layer, hatched, for close zooms
  historicEdge:'#a8620b', // the 1984-99 shoreline, drawn as a line
  encroached:'#e0392e',   // built on former water
  flowpath:'#2f3391',     // the drainage spine INSIDE that low ground
  floodprone:'#a78bfa'    // low ground — pale and large, a wash
};


var BLANK = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

// Buffer distances are OPERATOR CONFIGURATION, not a legal determination by
// this tool. Karnataka has more than one figure in play and an officer knows
// which binds them, so the tool applies the rule it is told to and records
// which one on the certificate.
var RULESETS = {
  state: {id:'state', label:'State revision \u00b7 30 m lake',
          lakeM:30, drainM:25,
          cite:'State revision of the NGT buffer, as applied by BBMP.'},
  ngt:   {id:'ngt', label:'NGT / Supreme Court \u00b7 75 m lake',
          lakeM:75, drainM:50,
          cite:'NGT O.A. 222/2014 (Forward Foundation v. State of Karnataka), '
             + 'upheld by the Supreme Court and applied prospectively.'}
};

// Numbers the tool computes with, and their single authoritative home.
//
// Each of these is DECLARED IN THE CORPUS, on the chunk that cites its source,
// and the value below is a bootstrap copy so the plot check still runs before
// corpus.json has loaded. check_corpus.py scrapes this block and fails if the
// two ever disagree, which is the same cross-file consistency test
// verify_encoding.py runs between two rasters.
//
// Everything here is a placeholder until the sourcing marked verify: true in
// the corpus has been done. The runoff figures in particular are stated
// defaults, not measurements of this city.
// @params
var PARAMS = {
  P_mm:          60,     // design storm depth, mm in one hour
  P_pm:          24,     // and its uncertainty, dominated by the return period
  P_annualMm:    970,    // annual rainfall, for the yearly figure
  C_pre:         0.30,   // runoff coefficient, open ground
  C_post:        0.85,   // runoff coefficient, roof and paving
  dC:            0.55,   // the change, which is what displacement turns on
  dC_pm:         0.15,
  tankerL:       6000,   // a volume nobody can picture, made picturable
  handDeepM:     1,      // inside a water path: retention and plinth
  handLowM:      2,      // flood-prone, as the layer defines it
  handMarginalM: 5,
  upaCeilKm2:    1000,   // the log-packing ceiling in hydro.png's red channel
  trunkUpaKm2:   10,
  routeStepM:    90,     // one MERIT cell — the trace steps cells, not pixels
  routeMaxSteps: 200,
  routeCorridorM: 150    // how near the line a structure has to be to count
};
// @end-params

// hydro.png is the one layer not read as a straight byte. Decoding the log
// packing here, once, next to the encoder it mirrors in gee_blue_grid.js.
var UPA_DEN = Math.log(1 + PARAMS.upaCeilKm2) / Math.LN10;
function decodeUpa(code){
  return code === null ? null : Math.pow(10, (code/255) * UPA_DEN) - 1;
}

// The error budget, stated once and used everywhere a distance is judged.
//   JRC 30 m pixel, shoreline position   +/- 15 m
//   distance-transform quantum at 10 m   +/-  7 m
//   PNG georeferencing, one pixel        +/-  6 m
//   thumbnail resample and byte decode         0  (nearest, exact)
// In quadrature, about 20 m. It is dominated by the source resolution, not by
// anything this tool does, which is why finer encoding would buy nothing.
var UNCERTAINTY_M = 20;

var state = {
  city: 'bengaluru', mode: 'timeline', t: 0, playing: false,
  rule: 'state', plotM: 30, lastCheck: null,
  // Storage the rainwater harvesting rule in force already requires, litres per
  // m² of plot, entered by the officer. null is not zero: an unentered rule and
  // a rule that requires nothing are different claims, and only one of them
  // lets a shortfall be computed.
  storageLpm2: null,
  stats: null, buildings: null, samplers: {}, have: {}, marker: null, selected: null, ready: false,
  // The retrieval layer. corpus is city-agnostic and fetched once; centroids
  // is rebuilt per city; lastAnswer is kept so a ruleset change can invalidate
  // an answer that was reasoned under the rule the officer has just left.
  corpus: null, centroids: null, lastAnswer: null, asking: false,
  queueOpen: true, probeEl: null,
  // 'sat' = Esri imagery, 'map' = pale Esri gray canvas. Set per mode, and
  // overridable from the switch in the bottom-right corner.
  base: 'sat'
};

// ===========================================================================
// MAP
// ===========================================================================
var C = CITIES[state.city];
var map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      // A pale basemap, split into ground and labels so the evidence layers can
      // be drawn between them — streets underneath for orientation, street
      // NAMES on top so a plot can still be located by address once four
      // rasters are stacked over it.
      //
      // On satellite imagery every evidence layer competes with tree canopy,
      // rooftops and shadow; on this one a cyan lake and a crimson footprint
      // are the only saturated things on screen. It is the default wherever
      // the question is 'what is here now', and never the default in timeline
      // mode, where the imagery is itself the evidence.
      //
      // Esri and not CARTO: CARTO's free basemap endpoint now stamps
      // API KEY REQUIRED across every tile, and the satellite ground is
      // already Esri, so this adds no new dependency and no key.
      grayBase: { type:'raster', tileSize:256, maxzoom:16,
        tiles:['https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}'],
        attribution:'Esri, HERE, Garmin, © OpenStreetMap contributors' },
      grayRef: { type:'raster', tileSize:256, maxzoom:16,
        tiles:['https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}'] },
      // Esri World Imagery sits underneath as a safety net: if a true-colour
      // export is missing the map still shows ground rather than a void.
      sat: { type:'raster', tileSize:256,
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        attribution:'Esri, Maxar · JRC Global Surface Water · MERIT Hydro · Google Open Buildings' }
    },
    layers: [
      {id:'grayBase', type:'raster', source:'grayBase', layout:{visibility:'none'}},
      {id:'sat',      type:'raster', source:'sat'}
    ]
  },
  bounds: [[C.bounds[0],C.bounds[1]],[C.bounds[2],C.bounds[3]]],
  fitBoundsOptions: {padding: pad()},
  // Required for getCanvas().toDataURL() on the certificate. It cannot be
  // enabled after construction, so it has to live here.
  preserveDrawingBuffer: true,
  attributionControl: {compact:true}
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'bottom-right');

function corners(b){ return [[b[0],b[3]],[b[2],b[3]],[b[2],b[1]],[b[0],b[1]]]; }

// An X, cast to the ImageData MapLibre's addImage wants. Two strokes per arm:
// a dark casing first, then the yellow over it, so the mark holds its shape on
// a white street and on a dark rooftop without changing colour between them.
var CROSS_YELLOW = '#ffd60a';
function crossIcon(ratio){
  var S = 22 * ratio, pad = 4 * ratio;
  var c = document.createElement('canvas');
  c.width = c.height = S;
  var g = c.getContext('2d');
  g.lineCap = 'round';
  [[ 'rgba(11,14,20,.92)', 5.5 * ratio ], [ CROSS_YELLOW, 2.6 * ratio ]]
    .forEach(function(pass){
      g.strokeStyle = pass[0]; g.lineWidth = pass[1];
      g.beginPath();
      g.moveTo(pad, pad);         g.lineTo(S - pad, S - pad);
      g.moveTo(S - pad, pad);     g.lineTo(pad, S - pad);
      g.stroke();
    });
  var d = g.getImageData(0, 0, S, S);
  return {width: S, height: S, data: d.data};
}

// Mean of the outer ring. Crude, and correct enough for a footprint this size
// against a 6.36 m pixel. Third caller, so it stops being written out inline.
function centroidOf(f){
  var g = f.geometry;
  var pts = g.type === 'Polygon' ? g.coordinates[0] : g.coordinates[0][0];
  var lon = 0, lat = 0;
  pts.forEach(function(p){ lon += p[0]; lat += p[1]; });
  return [lon/pts.length, lat/pts.length];
}

// Equirectangular, which at a few hundred metres and this latitude is exact
// to well inside the error budget and far cheaper than a haversine.
function metresBetween(lon1, lat1, lon2, lat2){
  var dx = (lon2-lon1) * 111320 * Math.cos(lat1*Math.PI/180);
  var dy = (lat2-lat1) * 110574;
  return Math.sqrt(dx*dx + dy*dy);
}

// The side rails are fixed width, so reserving room for them as a constant
// squeezes the map to a sliver on a narrow window. Scale the reservation with
// the viewport instead. Declared, not assigned, so hoisting covers the call in
// the map constructor above.
// A ring round the world with the study area punched out of it. Everything
// analysed is clipped to the AOI, so without this the imagery just stops at a
// hard rectangle and reads as a rendering fault. Dimming the outside instead
// makes the boundary look like what it is: the edge of the evidence.
function maskGeo(b){
  return {type:'Feature', geometry:{type:'Polygon', coordinates:[
    [[-179.9,-85],[179.9,-85],[179.9,85],[-179.9,85],[-179.9,-85]],
    [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]],[b[0],b[1]]]
  ]}};
}
function aoiGeo(b){
  return {type:'Feature', geometry:{type:'LineString', coordinates:
    [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]],[b[0],b[1]]]}};
}

function pad(){
  var w = window.innerWidth;
  var side = w > 1280 ? 340 : w > 1000 ? 210 : 40;
  return {top:80, bottom: w > 1000 ? 140 : 110, left:side, right:side};
}

map.on('load', function(){
  map.addSource('mask', {type:'geojson', data: maskGeo(C.bounds)});

  MAP_LAYERS.forEach(function(id){
    map.addSource(id, {type:'image', url:BLANK, coordinates:corners(C.bounds)});
    map.addLayer({id:id, type:'raster', source:id,
      paint:{'raster-opacity':0, 'raster-fade-duration':0}});
  });

  // Labels last, so street names survive four stacked rasters. Only ever
  // visible on the pale ground; over imagery they would be noise.
  map.addLayer({id:'grayRef', type:'raster', source:'grayRef',
    layout:{visibility:'none'}, paint:{'raster-opacity':.9}});

  map.addSource('buildings', {type:'geojson', data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'b-fill', type:'fill', source:'buildings', paint:{
    'fill-color':['case',
      ['==',['get','verdict'],'RED_FORMER_WATER_BODY'], PALETTE.encroached,
      ['==',['get','verdict'],'RED_BLOCKS_DRAINAGE'], PALETTE.flowpath,'#6b7280'],
    'fill-opacity':0}});
  map.addLayer({id:'b-line', type:'line', source:'buildings',
    paint:{'line-color':'#fff','line-width':1.1,'line-opacity':0}});

  // The traced route, above the footprints so it can be seen crossing them.
  // Drawn in the drainage hue, because that is what it is: the line the water
  // takes to reach the channels already painted that colour. A white casing
  // underneath keeps it legible over dark imagery and pale paper alike, which
  // one stroke at one width cannot do.
  map.addSource('route', {type:'geojson', data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'route-casing', type:'line', source:'route',
    filter:['==','$type','LineString'],
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#fff','line-width':5,'line-opacity':0}});
  map.addLayer({id:'route-line', type:'line', source:'route',
    filter:['==','$type','LineString'],
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':PALETTE.flowpath,'line-width':2.2,'line-opacity':0}});
  // The cells that carry the most catchment, sized by nothing — rank is
  // already conveyed by the panel, and a graduated symbol here would imply a
  // magnitude this layer does not measure at a point.
  // The ground that receives the runoff is marked with a cross, not a dot.
  // Everything else on this map is an area — a wash, a hatch, a line — so a
  // mark that is none of those reads as an annotation pinned to a place rather
  // than as another layer of data. Yellow because nothing else here is: the
  // lost-water amber is the nearest, and a cross at this lightness separates
  // from it by value as well as by shape.
  //
  // Drawn rather than loaded: a symbol layer needs no glyph server for an icon
  // (text would), and an inline data URI for four pixels of geometry is worse
  // than the twelve lines that draw it. The dark casing is what keeps it
  // legible over both the pale basemap and satellite imagery.
  map.addImage('affected-ground', crossIcon(2), {pixelRatio: 2});
  map.addLayer({id:'route-pt', type:'symbol', source:'route',
    filter:['==','$type','Point'],
    layout:{'icon-image':'affected-ground', 'icon-allow-overlap':true,
            'icon-ignore-placement':true, 'icon-size':1},
    paint:{'icon-opacity':0}});

  // The veil over everything outside the study area goes on LAST, above the
  // basemap's own street labels. Underneath them it left place names floating
  // in an otherwise blank white field, which reads as a rendering fault rather
  // than as the edge of the evidence.
  map.addLayer({id:'mask', type:'fill', source:'mask',
    paint:{'fill-color':'#04060b','fill-opacity':0.46}});

  map.addSource('aoi', {type:'geojson', data: aoiGeo(C.bounds)});
  // With the margin knocked back this is the frame of the document, so it is
  // drawn as one rather than as a faint hint.
  map.addLayer({id:'aoi-line', type:'line', source:'aoi', paint:{
    'line-color':'#6cb6ff','line-width':1.4,'line-opacity':0.5,'line-dasharray':[4,3]}});

  map.on('click','b-fill', function(e){ e.preventDefault(); selectBuilding(e.features[0]); });
  map.on('mouseenter','b-fill', function(){ if(state.mode!=='approval') map.getCanvas().style.cursor='pointer'; });
  map.on('mouseleave','b-fill', function(){ map.getCanvas().style.cursor=''; });
  map.on('click', function(e){ if(state.mode==='approval' && !e.defaultPrevented) checkPlot(e.lngLat); });

  loadCity(state.city).then(function(){
    document.getElementById('boot').classList.add('gone');
  });
});

// ===========================================================================
// DATA LOADING
// ===========================================================================
function exists(url){
  return fetch(url,{method:'HEAD'}).then(function(r){return r.ok;}).catch(function(){return false;});
}

// Reads a PNG into an offscreen canvas so any point can be tested against it
// without a server. This is what makes the plot check instant and offline:
// the same rasters that are drawn on the map are also the lookup table.
//
// Sampling happens at a quarter of the export resolution. The underlying data
// is 30m and the probe covers a whole plot, so full resolution buys nothing
// and costs four times the decode and memory. Downscaling keeps smoothing on
// deliberately: it area-averages, so a thin feature survives as partial alpha
// rather than being dropped by nearest-neighbour.
var SAMPLE_MAX_W = 1024;
var PROBE_METRES = 35;

function makeSampler(url, b, exact){
  return new Promise(function(res){
    var img = new Image();
    img.onload = function(){
      // Masks tolerate downscaling: area-averaging a binary edge is a feature.
      // Measurement layers are decoded 1:1 with smoothing off. Averaging two
      // byte codes invents a distance or a year that never existed, and even
      // nearest-neighbour dropping of every other pixel can miss the true
      // minimum of a distance field, which is the number a buffer turns on.
      var sc = exact ? 1 : Math.min(1, SAMPLE_MAX_W / img.naturalWidth);
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth*sc));
      c.height = Math.max(1, Math.round(img.naturalHeight*sc));
      var ctx = c.getContext('2d',{willReadFrequently:true});
      if(exact) ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try {
        var midLat = (b[1]+b[3])/2;
        var metresWide = (b[2]-b[0]) * 111320 * Math.cos(midLat*Math.PI/180);
        res({w:c.width, h:c.height, mpp: metresWide/c.width,
             d:ctx.getImageData(0,0,c.width,c.height).data});
      } catch(err){ res(null); }
    };
    img.onerror = function(){ res(null); };
    img.src = url;
  });
}

// Reduces a named channel over the same disc. For a distance field the
// closest approach of the feature to the plot is what a buffer rule turns on,
// so 'min' is the correct reduction; for the year layer 'max' gives the most
// recent year any part of the plot held water.
function sampleCh(s, lon, lat, b, ch, mode, radiusM, minAlpha){
  if(!s) return null;
  // Alpha is only a validity flag on a layer whose bands all share one
  // projection. Where a layer mixes scales - history carries JRC at 30 m
  // beside MERIT at 90 m - Earth Engine resamples the combined mask and
  // writes the FRACTION into alpha, so real data arrives at alpha 17 or 166.
  // Demanding exactly 255 there discards precisely the pixels that have
  // values, silently, and every reading comes back null. Zero still means
  // outside the clip, so one is the honest floor for those layers.
  var aMin = minAlpha === undefined ? 255 : minAlpha;
  var x = Math.round((lon-b[0])/(b[2]-b[0]) * s.w);
  var y = Math.round((b[3]-lat)/(b[3]-b[1]) * s.h);
  // Explicitly undefined rather than falsy. A radius of zero is a legitimate
  // request — the routing trace wants the one pixel it is standing on, not a
  // reduction over a disc a plot wide — and `radiusM || PROBE_METRES` silently
  // turns that into a 35 m maximum over about sixty pixels, which for a
  // categorical direction field returns the largest code in the neighbourhood
  // and sends the trace somewhere the water does not go.
  var rad = radiusM === undefined || radiusM === null ? PROBE_METRES : radiusM;
  var R = Math.max(0, Math.round(rad / s.mpp));
  var lo = mode === 'min', best = null;
  for(var dy=-R; dy<=R; dy++) for(var dx=-R; dx<=R; dx++){
    if(dx*dx+dy*dy > R*R) continue;
    var px = x+dx, py = y+dy;
    if(px<0||py<0||px>=s.w||py>=s.h) continue;
    var i = (py*s.w+px)*4;
    if(s.d[i+3] < aMin) continue;      // outside the study area: no evidence
    var v = s.d[i+ch];
    if(best === null) best = v;
    else if(lo ? v < best : v > best) best = v;
  }
  return best;
}

// A plot is far larger than one pixel, so the check probes a disc about a
// plot wide rather than a single point.
function sample(s, lon, lat, b){
  if(!s) return 0;
  var x = Math.round((lon-b[0])/(b[2]-b[0]) * s.w);
  var y = Math.round((b[3]-lat)/(b[3]-b[1]) * s.h);
  var R = Math.max(1, Math.round(PROBE_METRES / s.mpp)), best = 0;
  for(var dy=-R; dy<=R; dy++) for(var dx=-R; dx<=R; dx++){
    if(dx*dx+dy*dy > R*R) continue;
    var px = x+dx, py = y+dy;
    if(px<0||py<0||px>=s.w||py>=s.h) continue;
    var a = s.d[(py*s.w+px)*4+3];
    if(a>best) best = a;
  }
  return best/255;
}

// ---------------------------------------------------------------------------
// RE-TINTING, and tracing the lost shoreline
// ---------------------------------------------------------------------------
// Every visual export is a flat colour behind an alpha mask, so the browser
// can repaint it: read the pixels once, write the palette colour into RGB,
// leave A exactly as it was. Nothing about the geometry changes, and the
// measurement layers in DATA_LAYERS never come through here — re-tinting a
// byte-packed distance field would destroy the measurement.
//
// With `edge` set it also traces the mask boundary into a second image. That
// is the whole argument of this tool drawn as one line: here is where the
// water reached in 1984-99, and here is what is standing inside it now.
var EDGE_T = 96;   // alpha at or above this counts as inside the mask

// The inner boundary of the mask: inside it, with at least one of the four
// neighbours outside. One pixel wide and no wider — the raster is 6.36 m/px
// and the map is looked at anywhere from the whole 13 km catchment down to a
// single plot, so a band two pixels thick is a reasonable hairline at the far
// end and a 25 px stripe at the near one. Left at one pixel, linear
// resampling thins it to a pale contour when the image is downsampled and
// grows it to a clean line when it is not, which is the behaviour wanted at
// both ends.
//
// Four neighbours and not eight: a diagonal-only neighbour breaks the line at
// every step of a staircase edge, and a broken line at this scale reads as
// noise rather than as a shoreline.
function traceEdge(d, w, h){
  var band = new Uint8Array(w*h);
  for(var y = 0; y < h; y++){
    for(var x = 0; x < w; x++){
      var n = y*w + x;
      if(d[n*4+3] < EDGE_T) continue;
      if((x > 0     && d[(n-1)*4+3] >= EDGE_T) &&
         (x < w-1   && d[(n+1)*4+3] >= EDGE_T) &&
         (y > 0     && d[(n-w)*4+3] >= EDGE_T) &&
         (y < h-1   && d[(n+w)*4+3] >= EDGE_T)) continue;
      band[n] = 1;
    }
  }
  return band;
}

// Lost water is HATCHED rather than filled. A flat amber wash over dry-season
// Landsat is very nearly the colour of bare ground, and over vegetation it
// turns olive — either way it reads as terrain, which is the one thing it must
// not read as. Diagonal stripes read as annotation in every mapping tradition
// there is, and they let the ground show through at full chroma between them,
// so the colour stays amber instead of averaging with whatever is underneath.
// The map is read three octaves apart — the whole 13 km catchment, then one
// plot — and no single hatch works at both. Across the catchment a 4 px period
// in a 2048 px raster downsamples below the point where stripes exist at all
// and the lost water fades to a dotted whisper; over one plot a period coarse
// enough to survive that becomes a barber pole. So both are rendered and
// update() crossfades between them on zoom: a solid wash far out, stripes in
