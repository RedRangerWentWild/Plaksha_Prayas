// close, and nothing visibly switches.
var HATCH_PERIOD = 4, HATCH_ON = 2;
// Zoom range over which the solid wash hands over to the hatch.
var HATCH_Z0 = 13.4, HATCH_Z1 = 14.6;
// A solid fill covers twice the ground a 50% hatch does, so it has to be
// carried at roughly half the opacity to read as the same weight of amber.
var SOLID_SHARE = .78;

function tint(url, hex, edge, hatch){
  return new Promise(function(resolve){
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onerror = function(){ resolve(null); };
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var ctx = c.getContext('2d', {willReadFrequently:true});
      ctx.drawImage(img, 0, 0);
      var im, d;
      try { im = ctx.getImageData(0, 0, w, h); d = im.data; }
      catch(e){ resolve(null); return; }   // tainted canvas: keep the original

      var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16),
          b = parseInt(hex.slice(5,7),16);
      for(var i = 0; i < d.length; i += 4){ d[i] = r; d[i+1] = g; d[i+2] = b; }

      // The boundary has to be traced off the ORIGINAL alpha, so it is taken
      // before the hatch punches holes in it.
      var band = edge ? traceEdge(d, w, h) : null;

      ctx.putImageData(im, 0, 0);
      var out = {fill: c.toDataURL('image/png'), hatch: null, edge: null};

      if(hatch){
        for(var y0 = 0, k0 = 0; y0 < h; y0++)
          for(var x0 = 0; x0 < w; x0++, k0 += 4)
            if((x0 + y0) % HATCH_PERIOD >= HATCH_ON) d[k0+3] = 0;
        ctx.putImageData(im, 0, 0);
        out.hatch = c.toDataURL('image/png');
      }
      if(!band){ resolve(out); return; }

      var er = parseInt(edge.slice(1,3),16), eg = parseInt(edge.slice(3,5),16),
          eb = parseInt(edge.slice(5,7),16);
      var ec = document.createElement('canvas');
      ec.width = w; ec.height = h;
      var ectx = ec.getContext('2d');
      var eim = ectx.createImageData(w, h), ed = eim.data;
      for(var n = 0, m = 0; n < band.length; n++, m += 4){
        if(!band[n]) continue;
        ed[m] = er; ed[m+1] = eg; ed[m+2] = eb; ed[m+3] = 255;
      }
      ectx.putImageData(eim, 0, 0);
      out.edge = ec.toDataURL('image/png');
      resolve(out);
    };
    img.src = url;
  });
}

function loadCity(key){
  state.city = key;
  var c = CITIES[key];
  state.samplers = {}; state.have = {}; state.selected = null; state.ready = false;
  // classList, not an inline style: an inline display:none outranks the
  // #verdict.on rule, so the next verdict rendered would never become visible.
  document.getElementById('verdict').classList.remove('on');
  document.getElementById('downstream').classList.remove('on');
  document.getElementById('retention').classList.remove('on');
  if(map.getSource('route'))
    map.getSource('route').setData({type:'FeatureCollection', features:[]});
  hideAskDock();
  if(state.marker){ state.marker.remove(); state.marker=null; }

  // Painting the map must not wait on the plot-check lookup tables. Decoding
  // five full-size PNGs into canvases takes seconds, and a demo cannot open on
  // a black screen. The map goes up first; the samplers hydrate behind it and
  // are ready long before anyone reaches the plot-check tab.
  // The distance fields subsume four of the old mask samplers - a distance of
  // zero IS the mask - so only 'encroached' still needs one. Fewer canvases,
  // less memory, shorter hydrate chain.
  var SAMPLED = ['encroached'];

  if(map.getSource('mask')) map.getSource('mask').setData(maskGeo(c.bounds));
  if(map.getSource('aoi')) map.getSource('aoi').setData(aoiGeo(c.bounds));

  // The two true-colour composites are photographs and go up untouched;
  // everything else is a flat mask and gets the palette written into it.
  var RGB = ['rgb2005','rgb2025'];
  var jobs = LAYERS.map(function(id){
    var url = 'data/'+key+'/'+id+'.png', co = corners(c.bounds);
    return exists(url).then(function(ok){
      state.have[id] = ok;
      if(!ok){ map.getSource(id).updateImage({url:BLANK, coordinates:co}); return; }
      if(RGB.indexOf(id) !== -1){
        map.getSource(id).updateImage({url:url, coordinates:co}); return;
      }
      return tint(url, PALETTE[id],
                  id === 'historic' ? PALETTE.historicEdge : null,
                  id === 'historic')
        .then(function(t){
          // A null result means the canvas could not be read. The original
          // PNG still draws; it just draws in the colour Earth Engine chose.
          map.getSource(id).updateImage({url: (t && t.fill) || url, coordinates:co});
          if(id === 'historic'){
            map.getSource('historicHatch')
               .updateImage({url: (t && t.hatch) || BLANK, coordinates:co});
            map.getSource('historicEdge')
               .updateImage({url: (t && t.edge) || BLANK, coordinates:co});
          }
        });
    });
  });

  // Measurement layers are probed but never attached to the map.
  jobs = jobs.concat(DATA_LAYERS.map(function(id){
    return exists('data/'+key+'/'+id+'.png').then(function(ok){ state.have[id] = ok; });
  }));

  // Sequential, so the large decodes never contend for the main thread at once.
  Promise.all(jobs).then(function(){
    return SAMPLED.concat(DATA_LAYERS).reduce(function(chain, id){
      return chain.then(function(){
        if(!state.have[id]) return;
        var exact = DATA_LAYERS.indexOf(id) !== -1;
        return makeSampler('data/'+key+'/'+id+'.png', c.bounds, exact)
          .then(function(sm){ state.samplers[id] = sm; });
      });
    }, Promise.resolve());
  }).then(function(){ state.ready = true; });

  jobs.push(
    fetch('data/'+key+'/stats.json').then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;}).then(function(j){ state.stats = j; })
  );
  jobs.push(
    fetch('data/'+key+'/flagged_buildings.geojson').then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;}).then(function(g){
        state.buildings = g;
        // Precomputed once here rather than per click. A linear scan over a
        // few thousand of these is under a frame; recomputing the centroids
        // inside the scan would not be.
        state.centroids = g ? g.features.map(function(f){
          var c = centroidOf(f);
          return {lon:c[0], lat:c[1], p:f.properties};
        }) : null;
        map.getSource('buildings').setData(g || {type:'FeatureCollection',features:[]});
      })
  );

  // City-agnostic and fetched once. Its absence is survivable: the plot check
  // and the templated answer both still work, they simply lose their citations.
  if(!state.corpus){
    jobs.push(
      fetch('data/corpus.json').then(function(r){return r.ok?r.json():null;})
        .catch(function(){return null;}).then(function(j){
          state.corpus = j;
          if(j) reconcileParams(j);
        })
    );
  }

  return Promise.all(jobs).then(function(){
    map.fitBounds([[c.bounds[0],c.bounds[1]],[c.bounds[2],c.bounds[3]]],
      {padding: pad(), duration:900});
    renderStats(); renderList(); renderLegend(); applyMode(); update();
    var missing = LAYERS.concat(DATA_LAYERS).filter(function(l){return !state.have[l];});
    if(missing.length) toast('Missing layers: '+missing.join(', ')+' — run gee_blue_grid.js for '+c.label+', then ./fetch_layers.sh '+key);
    else if(!state.buildings) toast('No flagged_buildings.geojson yet — run the Earth Engine export task.');
    else hideToast();
  });
}

// ===========================================================================
// TIMELINE
// ===========================================================================
function ramp(t,a,b){ return Math.max(0, Math.min(1, (t-a)/(b-a))); }

function update(){
  var t = state.t;
  // Three different time framings used to coexist here: a slider counting
  // 2005 to 2025, imagery that is a 2003-07 median against a 2023-25 median,
  // and water layers from JRC's 1984-99 and 2000-21 epochs. The readout now
  // names the composite actually on screen instead of inventing a year that
  // nothing in the data corresponds to.
  var past = t < .5;
  document.getElementById('year').textContent = past ? '2003\u201307' : '2023\u201325';
  // The dot beside the year carries the colour of the water layer that
  // dominates at this point in the scrub, so 'which water am I looking at' is
  // answered in the same glance as 'which year'.
  document.getElementById('eraDot').style.background =
    past ? PALETTE.historic : PALETTE.present;
  document.getElementById('caption').textContent =
    t<.12 ? 'Amber is water the satellites recorded in 1984\u201399.' :
    t<.50 ? 'Water retreats. The edges go first.' :
    t<.78 ? 'Cyan is what survived. Construction reaches the lakebed.' :
            'The amber line is the 1984\u201399 shoreline. Red is what was built inside it.';

  if(!map.getLayer('rgb2005')) return;
  var m = state.mode, bo, light = state.base === 'map';

  // One number decides how loud the lost water is; the zoom decides which of
  // the two renderings carries it.
  var hz = ramp(map.getZoom(), HATCH_Z0, HATCH_Z1);
  function lost(v){
    set('historic',      v * (1 - hz) * SOLID_SHARE);
    set('historicHatch', v * hz);
  }

  // On the pale basemap the true-colour composites are exactly what is being
  // replaced, so they come off entirely rather than sitting on top of it.
  function rgb(id, v){ set(id, light ? 0 : v); }

  // Each mode answers a different question, so each gets its own layer mix.
  // Reusing the timeline's t outside the timeline would leave a plot check
  // being made against 2005 imagery, which is exactly the wrong ground.
  if(m === 'timeline'){
    // rgb2005 holds steady underneath while rgb2025 fades in on top, so the
    // crossfade never exposes the modern basemap mid-drag.
    rgb('rgb2005', state.have.rgb2005 ? 1 : 0);
    rgb('rgb2025', state.have.rgb2025 ? ramp(t,.05,.95) : 0);
    // The lost water fades from a filled wash to a ghost, and as it fades its
    // SHORELINE comes up to full strength. What the viewer is left holding at
    // the end of the scrub is one amber line drawn across today's ground with
    // red construction inside it — which is the entire finding, in one frame.
    lost(.98 - .26*t);
    set('historicEdge', .55 + .42*ramp(t,.10,.70));
    set('present',      .90*ramp(t,.10,.70));
    set('encroached',   .95*ramp(t,.50,1));
    set('floodprone', 0);
    set('flowpath',   0);
    bo = .72*ramp(t,.70,1);
  } else if(m === 'approval'){
    // Every constraint visible at once on today's ground: this is the view an
    // approving officer needs, not a story about the past.
    rgb('rgb2005', 0);
    rgb('rgb2025', state.have.rgb2025 ? 1 : 0);
    lost(.62); set('historicEdge', .92);
    set('present', .74); set('encroached', .95);
    set('floodprone', .17); set('flowpath', .46);
    bo = .38;
  } else {
    rgb('rgb2005', 0);
    rgb('rgb2025', state.have.rgb2025 ? 1 : 0);
    lost(.34); set('historicEdge', .60);
    set('present', .68); set('encroached', .92);
    set('floodprone', .30); set('flowpath', .68);
    bo = .55;
  }
  if(map.getLayer('b-fill')){
    map.setPaintProperty('b-fill','fill-opacity',bo);
    map.setPaintProperty('b-line','line-opacity',bo*1.2);
  }

  // The route appears only where a site has actually been checked. Timeline
  // mode is a story about the past and takes no site, so it never carries one;
  // the other two modes both do, because the click that asks the question and
  // the line that answers it belong on the same screen.
  if(map.getLayer('route-line')){
    var ro = (m !== 'timeline' && state.lastCheck
              && state.lastCheck.ctx && state.lastCheck.ctx.route
              && state.lastCheck.ctx.route.traced) ? 1 : 0;
    map.setPaintProperty('route-casing','line-opacity', ro * .85);
    map.setPaintProperty('route-line','line-opacity', ro);
    map.setPaintProperty('route-pt','icon-opacity', ro);
  }
  function set(id,v){ if(map.getLayer(id)) map.setPaintProperty(id,'raster-opacity',v); }
}

// ---------------------------------------------------------------------------
// BASEMAP
// ---------------------------------------------------------------------------
// Two grounds, and the choice is not cosmetic. Satellite imagery is the
// evidence when the question is 'what changed here' — you can see the lakebed
// and the rooftops standing on it. It is a liability when the question is
// 'what constrains this plot', because tree canopy, shadow and rooftop are all
// the same visual weight as a flagged footprint. So the mode picks a default
// and the officer can overrule it.
function setBase(b){
  state.base = b;
  ['grayBase','grayRef'].forEach(function(id){
    if(map.getLayer(id))
      map.setLayoutProperty(id,'visibility', b === 'map' ? 'visible' : 'none');
  });
  if(map.getLayer('sat'))
    map.setLayoutProperty('sat','visibility',   b === 'sat' ? 'visible' : 'none');
  // Outside the study area is dimmed, and 'dimmed' means the opposite thing on
  // the two grounds: a dark veil over imagery, a white one over paper.
  if(map.getLayer('mask')){
    map.setPaintProperty('mask','fill-color',  b === 'map' ? '#ffffff' : '#04060b');
    // Heavier on paper than on imagery. A light veil over a light basemap
    // washes the streets out but leaves the place labels at full ink, so the
    // ground outside the study area comes back as names floating in a blank
    // field. Taking it to 0.82 makes the outside read as margin.
    map.setPaintProperty('mask','fill-opacity',b === 'map' ? .82 : .46);
  }
  if(map.getLayer('aoi-line'))
    map.setPaintProperty('aoi-line','line-color', b === 'map' ? '#6b7385' : '#6cb6ff');
  // A white footprint outline is invisible on white paper.
  if(map.getLayer('b-line'))
    map.setPaintProperty('b-line','line-color',
      b === 'map' ? 'rgba(13,17,28,.5)' : '#ffffff');
  document.querySelectorAll('#basePill button').forEach(function(x){
    x.classList.toggle('on', x.dataset.base === b);
  });
  update();
}
document.querySelectorAll('#basePill button').forEach(function(x){
  x.onclick = function(){ setBase(x.dataset.base); };
});

var slider = document.getElementById('slider');
slider.addEventListener('input', function(){ stop(); state.t = slider.value/100; update(); });

var raf = null;
function stop(){ state.playing=false; if(raf) cancelAnimationFrame(raf); raf=null;
  document.getElementById('play').innerHTML='&#9654;'; }
document.getElementById('play').onclick = function(){
  if(state.playing){ stop(); return; }
  if(state.mode!=='timeline') setMode('timeline');
  state.playing = true; this.innerHTML='&#10073;&#10073;';
  if(state.t >= .999) state.t = 0;
  var t0 = performance.now(), from = state.t, dur = 9000*(1-from);
  (function step(now){
    if(!state.playing) return;
    var p = Math.min(1, (now-t0)/dur);
    state.t = from + (1-from)*p;
    slider.value = state.t*100; update();
    if(p<1) raf = requestAnimationFrame(step); else stop();
  })(t0);
};

// ===========================================================================
// MODES
// ===========================================================================
function setMode(m){
  state.mode = m;
  document.querySelectorAll('#modes button').forEach(function(b){
    b.classList.toggle('on', b.dataset.mode===m);
  });
  applyMode();
}
// The queue is a browsing aid and the map click is the input, so the rail
// opens where browsing is the point and gets out of the way where it is not.
function setQueue(open){
  state.queueOpen = open;
  document.getElementById('left').classList.toggle('collapsed', !open);
  document.getElementById('queueToggle').classList.toggle('show', !open);
  // 196 px still clears the legend, which stays in the bottom-left corner
  // whether or not the queue is open.
  document.documentElement.style.setProperty('--rail-l', open ? '' : '196px');
}

var hintTimer = null;
function applyMode(){
  var m = state.mode;
  document.getElementById('map').classList.toggle('aim', m === 'approval');
  document.getElementById('paramsBar').classList.toggle('on', m === 'approval');

  // The imagery IS the evidence in timeline mode, so the ground is not
  // allowed to drift off satellite there and the switch is not offered.
  // Everywhere else the pale basemap is the default, because a plot check is
  // a question about constraints and constraints have to out-shout canopy.
  document.getElementById('basePill').classList.toggle('on', m !== 'timeline');
  setBase(m === 'timeline' ? 'sat' : 'map');

  // One dock, two occupants, never both. The timeline owns it in timeline
  // mode; the ask bar owns it wherever a site can be interrogated.
  document.getElementById('timeline').classList.toggle('hid', m !== 'timeline');
  if(m === 'timeline'){ hideAskDock(); } else if(state.lastCheck){ showAskDock(); }

  setQueue(m !== 'approval');

  var hint = document.getElementById('hint');
  clearTimeout(hintTimer);
  if(m === 'approval' && !state.lastCheck){
    hint.innerHTML = '<b>Click any plot on the map</b>'
      + '<span>The same rasters drawn here are read back pixel by pixel '
      + '\u2014 no server, no lookup.</span>';
    hint.style.display = 'block';
    hintTimer = setTimeout(function(){ hint.style.display = 'none'; }, 4600);
  } else hint.style.display = 'none';

  if(m !== 'timeline'){ stop(); state.t = 1; slider.value = 100; }
  renderStats(); renderLegend(); update();
}
document.querySelectorAll('#modes button').forEach(function(b){
  b.onclick = function(){ setMode(b.dataset.mode); };
});

// ===========================================================================
// PLOT CHECK  — the approval-stage product, running entirely client side
// ===========================================================================
// Every value here is a straight byte read. There is no scaling arithmetic,
// which is the entire reason the exported ranges were chosen to fit a byte.
function readSite(lngLat){
  var b = CITIES[state.city].bounds, S = state.samplers;
  var r = Math.max(6, state.plotM / 2);          // half the plot frontage
  function buf(ch, mode){ return sampleCh(S.buffers, lngLat.lng, lngLat.lat, b, ch, mode, r); }
  function his(ch, mode){ return sampleCh(S.history, lngLat.lng, lngLat.lat, b, ch, mode, r, 1); }
  var yc = his(0, 'max');
  return {
    // Distances take the MINIMUM over the plot: a buffer is breached if ANY
    // part of the plot falls inside it, so the nearest approach governs.
    // Taking the maximum here would pass every corner plot.
    distPresent:   buf(0, 'min'),
    distHistoric:  buf(1, 'min'),
    distDrain:     buf(2, 'min'),
    lastWaterYear: yc ? 1983 + yc : null,
    occurrence:    his(1, 'max'),
    handM:         his(2, 'min'),
    encroached:    sample(S.encroached, lngLat.lng, lngLat.lat, b)
  };
}

// ---------------------------------------------------------------------------
// SITE CONTEXT — readSite, plus what can be derived from it
// ---------------------------------------------------------------------------
// Layered strictly on top. readSite and decide are the authority and are not
// touched here beyond reading their output: the derived quantities below are
// all reversible arithmetic on values those two already produced.
//
// decide() computes the shoreline retreat inline for its own message. That
// subtraction is repeated here rather than factored out of it. Duplicating one
// subtraction is cheaper than reaching into the branch that produces the
// finding this whole tool exists to make.
//
// The field list below is the manifest check_corpus.py scrapes: every corpus
// trigger must name a field that appears in it, so renaming one here breaks
// the corpus check instead of silently disabling its triggers.
// @site-fields
//   city inAoi lat lon plotM plotAreaM2
//   ruleId lakeM drainM
//   distPresent distHistoric distDrain lastWaterYear occurrence handM encroached
//   retreatM flowClass handClass
//   upaKm2 distTrunk elevAboveMinM
//   runoffDisplacedM3 runoffLoM3 runoffHiM3 runoffAnnualM3 tankerEquiv
//   storageLpm2 retentionRequiredM3 rwhRequiredM3 retentionShortfallM3
//   routeTraced routeLengthM routeLowGroundM routeSteps
//   receivingMaxUpaKm2 structuresOnRoute
//   verdict codes hasBuildings nNeighbours nearestFlaggedM
//   intent
// @end-site-fields

// Two significant figures. The uncertainty on every derived volume here is
// tens of per cent, and a third digit would claim precision the inputs cannot
// support while looking exactly like one that could.
function sig2(x){
  if(x === null || !isFinite(x)) return null;
  if(x === 0) return 0;
  // toPrecision, not round-to-magnitude. Rounding to a power of ten and
  // multiplying back is exact in decimal and not in binary: 140 × 0.01 is
  // 1.4000000000000001, and that artifact reached the screen as a catchment
  // area quoted to seventeen significant figures on a panel whose whole claim
  // is that it never states more precision than it has.
  return parseFloat(x.toPrecision(2));
}

function classifyFlow(distDrain, drainM){
  if(distDrain === null) return null;
  if(distDrain >= 255) return 'UNRESOLVED';
  if(distDrain === 0) return 'ON_FLOW_PATH';
  if(distDrain <= 10) return 'ADJACENT';            // one distance-transform step
  if(distDrain <= drainM + UNCERTAINTY_M) return 'NEAR';
  return 'OFF';
}

function classifyHand(handM){
  if(handM === null) return null;
  if(handM >= 255) return 'UNKNOWN';                // the byte ceiling, not a height
  if(handM === 0) return 'AT_DRAINAGE_LEVEL';
  if(handM <= PARAMS.handDeepM) return 'DEEP_IN_A_WATER_PATH';
  if(handM <= PARAMS.handLowM) return 'LOW_GROUND';
  if(handM <= PARAMS.handMarginalM) return 'MARGINAL';
  return 'ELEVATED';
}

// The three nearest flagged structures, as context and never as a property of
// the plot. Tagged so the prompt can forbid attributing them to it.
function neighboursOf(lngLat){
  if(!state.centroids) return [];
  var out = [];
  for(var i=0;i<state.centroids.length;i++){
    var c = state.centroids[i];
    var d = metresBetween(lngLat.lng, lngLat.lat, c.lon, c.lat);
    if(d <= 300) out.push({m:Math.round(d), p:c.p});
  }
  out.sort(function(a,b){ return a.m - b.m; });
  return out.slice(0,3);
}

// ---------------------------------------------------------------------------
// DOWNSTREAM ROUTING — where what this plot sheds actually goes
// ---------------------------------------------------------------------------
// The volume a plot displaces has been computable for a while. Where it goes
// has not, and without that "who pays" is a rhetorical question: the tool could
// say a plot sheds thirty cubic metres and not name one metre of ground that
// receives them.
//
// The direction codes are the ones gee_blue_grid.js section 14 remaps MERIT's
// powers of two into. Index is the code, value is the step in whole MERIT
// cells: x east, y south. Row index grows southward in the raster, which is
// why the latitude step below is negated and the longitude step is not.
var D8_STEP = {1:[1,0], 2:[1,1], 3:[0,1], 4:[-1,1],
               5:[-1,0], 6:[-1,-1], 7:[0,-1], 8:[1,-1]};
var D8_MOUTH = 9, D8_DEPRESSION = 10;

// MERIT Hydro sits on a 3 arc-second grid: exactly one 1200th of a degree, in
// both axes, everywhere. The trace walks THAT grid rather than walking 90 m at
// a time in metres.
//
// The difference is not cosmetic. A click lands anywhere inside a cell, so
// stepping a fixed 90 m from it drifts off the grid within a few steps and
// starts landing twice in the same cell or skipping one. On the real export
// that showed up as routes oscillating between two neighbours and dying as
// false loops — half of them. Snapped to the grid, one step is exactly one
// cell, with no trigonometry and no accumulated error.
//
// The grid is CENTRE-registered: cell centres sit on integer multiples of
// 1/1200 of a degree, not on the half-multiples a naive floor()+0.5 produces.
// That was measured off the export rather than assumed — snapping to centres
// puts 90% of sampled points back on their own direction code, snapping to
// half-multiples only 58%, and the missing half-cell was enough to make three
// traces in four die as false loops.
//
// PARAMS.routeStepM is the same quantity in metres, kept for the certificate
// and the corpus because 90 m is what a reader understands.
var MERIT_DEG = 1 / 1200;

// Why the trace stopped. Reported rather than hidden: a route that ran out of
// study area and a route that reached a trunk channel are different findings,
// and only one of them is complete.
var ROUTE_END = {
  trunk:      'it joins a trunk channel',
  mouth:      'the terrain model records an outlet there',
  depression: 'the terrain model records a closed depression there',
  edge:       'it leaves the mapped study area',
  loop:       'the direction field returns to a cell already visited',
  capped:     'the step limit was reached before any of those',
  nodata:     'the direction field has no value there'
};

function traceDownstream(lngLat){
  var S = state.samplers, b = CITIES[state.city].bounds;
  var out = {traced:false, path:[], steps:0, lengthM:null, lowGroundM:null,
             maxUpaKm2:null, receiving:[], endedBy:null, structures:null};
  // routing.png postdates every other export, exactly as hydro.png did. Absent,
  // the downstream facts are simply not produced and the panel says the layer
  // is missing — which is a different statement from a route of length zero.
  if(!S.routing) return out;

  // Cell indices on MERIT's own grid. Every position below is a cell CENTRE,
  // so the loop key is exact cell identity rather than a bucket that has to be
  // tuned, and a revisit is a genuine cycle in the direction field.
  var ix = Math.round(lngLat.lng / MERIT_DEG);
  var iy = Math.round(lngLat.lat / MERIT_DEG);
  var lon = ix * MERIT_DEG, lat = iy * MERIT_DEG;
  var seen = {}, path = [[lon, lat]], cells = [];
  var lengthM = 0, lowM = 0, maxUpa = null, ended = 'capped';

  for(var n = 0; n < PARAMS.routeMaxSteps; n++){
    var key = ix + ',' + iy;
    if(seen[key]){ ended = 'loop'; break; }
    seen[key] = 1;

    // The study-area test lives on the buffers layer's alpha, as everywhere
    // else in this file. routing.png is exported without alpha on purpose, so
    // it cannot answer this question about itself.
    if(sampleCh(S.buffers, lon, lat, b, 0, 'min', 0) === null){ ended = 'edge'; break; }

    var upaCode = sampleCh(S.hydro, lon, lat, b, 0, 'max', 0, 1);
    var upa = upaCode === null ? null : decodeUpa(upaCode);
    if(upa !== null && (maxUpa === null || upa > maxUpa)) maxUpa = upa;

    var hand = sampleCh(S.history, lon, lat, b, 2, 'min', 0, 1);
    var handOk = hand !== null && hand < 255;   // 255 is the byte ceiling, not a height

    // The origin is the plot being screened, not ground that receives from it.
    if(n > 0) cells.push({lon:lon, lat:lat,
                          upaKm2: upa === null ? null : sig2(upa),
                          handM: handOk ? hand : null});

    // Reaching a trunk channel is an arrival, not a failure: past that point
    // the water is in the drainage system the city already models, and this
    // tool has nothing further to add about it.
    if(upa !== null && upa > PARAMS.trunkUpaKm2 && n > 0){ ended = 'trunk'; break; }

    var code = sampleCh(S.routing, lon, lat, b, 0, 'max', 0);
    if(code === D8_MOUTH){ ended = 'mouth'; break; }
    if(code === D8_DEPRESSION){ ended = 'depression'; break; }
    var d = D8_STEP[code];
    if(!d){ ended = 'nodata'; break; }

    // y is southward in raster terms and latitude increases northward, so the
    // row step is subtracted.
    ix += d[0]; iy -= d[1];
    var nlon = ix * MERIT_DEG, nlat = iy * MERIT_DEG;

    // True ground distance between the two cell centres. Measuring it rather
    // than assuming it means a diagonal step costs its real root-two more
    // without a special case, and the latitude term is correct at every step
    // instead of being fixed at the one the trace started on.
    var segM = metresBetween(lon, lat, nlon, nlat);
    lengthM += segM;
    // Each segment is attributed to the ground it leaves, which is the cell
    // whose height was just read. Counted once, here, and nowhere else.
    if(handOk && hand <= PARAMS.handLowM) lowM += segM;

    lon = nlon; lat = nlat;
    path.push([lon, lat]);
  }

  out.traced   = path.length > 1;
  out.path     = path;
  out.steps    = path.length - 1;
  out.lengthM  = Math.round(lengthM);
  out.lowGroundM = Math.round(lowM);
  out.maxUpaKm2  = maxUpa === null ? null : sig2(maxUpa);
  out.endedBy    = ended;

  // The three cells the route passes through that carry the most catchment.
  // Not the last three: the route may end at the study-area edge, and the
  // ground that matters is wherever the water is most concentrated, which is
  // a property of the terrain rather than of where the rectangle was drawn.
  // Greater than zero, not merely non-null. A cell whose upstream area decodes
  // to nothing has no catchment above it at all — it is a local high, and
  // listing it under "receiving ground" ranked by catchment reads as a bug.
  out.receiving = cells.filter(function(c){ return c.upaKm2 !== null && c.upaKm2 > 0; })
    .sort(function(a, c){ return c.upaKm2 - a.upaKm2; })
    .slice(0, 3);

  // Flagged structures near the line. Optional, and it says so: the building
  // layer is a separate Earth Engine task and a city may not have run it.
  if(state.centroids){
    var corridor = PARAMS.routeCorridorM, hits = 0;
    for(var i = 0; i < state.centroids.length; i++){
      var c = state.centroids[i];
      for(var j = 0; j < path.length; j++){
        if(metresBetween(path[j][0], path[j][1], c.lon, c.lat) <= corridor){ hits++; break; }
      }
    }
    out.structures = hits;
  }
  return out;
}

function siteContext(lngLat, rule, building){
  var m = readSite(lngLat);
  var out = decide(m, rule);
  var inAoi = !(m.distPresent === null || m.distHistoric === null);
  var S = state.samplers, b = CITIES[state.city].bounds;
  var r = Math.max(6, state.plotM / 2);

  // hydro.png is optional: it postdates the other exports and a city may not
  // have been re-run yet. Absent, the upstream facts are simply not produced
  // and the answer says the layer is missing rather than guessing at it.
  // Channel order follows the export in gee_blue_grid.js section 13:
  //   r = log-packed upstream area, g = metres to a trunk channel,
  //   b = metres above the study-area low point.
  // g and b were transposed here, so "distance to the main drain" was reading
  // local relief - a number that is never far from zero, and therefore looked
  // like a plot always sitting on a trunk channel.
  var hyd = function(ch, mode){
    return S.hydro ? sampleCh(S.hydro, lngLat.lng, lngLat.lat, b, ch, mode, r, 1) : null;
  };
  var upaCode = hyd(0, 'max');
  var upaKm2 = upaCode === null ? null : sig2(decodeUpa(upaCode));
  var distTrunk = hyd(1, 'min');
  var elevAbove = hyd(2, 'min');

  var area = state.plotM * state.plotM;

  // Volume displaced per design storm: plot area, times storm depth in metres,
  // times the change in runoff coefficient. Three stated numbers and two
  // multiplications, so a reader can check it on paper — which is the reason
  // for using the volumetric form rather than a peak-flow estimate needing a
  // time of concentration this tool cannot defend for a single plot.
  //
  // Not computed outside the study area. A volume derived entirely from
  // assumptions looks identical to a measurement and is not one.
  var vol = null, volLo = null, volHi = null, volYear = null, tankers = null;
  if(inAoi){
    vol = area * (PARAMS.P_mm/1000) * PARAMS.dC;
    var rel = Math.sqrt(Math.pow(PARAMS.P_pm/PARAMS.P_mm, 2) +
                        Math.pow(PARAMS.dC_pm/PARAMS.dC, 2));
    volLo = sig2(vol * (1-rel)); volHi = sig2(vol * (1+rel));
    volYear = sig2(area * (PARAMS.P_annualMm/1000) * PARAMS.dC);
    tankers = Math.max(1, Math.round(vol / (PARAMS.tankerL/1000)));
    vol = sig2(vol);
  }

  // ---- what it would take to send nothing extra downhill ------------------
  // Hydrological neutrality is the displaced volume itself: hold back what
  // sealing the plot added and the catchment below is no worse off than it was
  // before the permit. That is not a new obligation invented here — it is the
  // volume already computed above, read as a requirement rather than as a
  // consequence, which is why it needs no parameter of its own.
  //
  // The second figure is the officer's, not the tool's. A shortfall measured
  // against a number this tool guessed at would look exactly like a shortfall
  // measured against the rule in force, so when the field is blank it stays
  // blank rather than defaulting to zero.
  var retain = null, rwh = null, shortfall = null;
  if(inAoi){
    retain = vol;
    if(state.storageLpm2 !== null){
      rwh = sig2(area * state.storageLpm2 / 1000);
      shortfall = sig2(Math.max(0, retain - rwh));
    }
  }

  var nb = neighboursOf(lngLat);

  // Only inside the study area. A route traced out of assumptions alone would
  // look exactly like one traced out of a direction field, which is the same
  // reason the displaced volume is not computed out there either.
  var route = inAoi ? traceDownstream(lngLat)
                    : {traced:false, path:[], steps:0, lengthM:null,
                       lowGroundM:null, maxUpaKm2:null, receiving:[],
                       endedBy:null, structures:null};

  return {
    m: m,
    verdict: out,
    neighbours: nb,
    route: route,
    // Set when the context is about one flagged footprint rather than a
    // clicked plot. Its per-footprint measurements were computed inside Earth
    // Engine against the polygon itself, so they are better evidence than the
    // disc reduction and are carried separately rather than blended into it.
    building: building || null,
    rec: {
      city: state.city, inAoi: inAoi,
      lat: lngLat.lat, lon: lngLat.lng,
      plotM: state.plotM, plotAreaM2: area,
      ruleId: rule.id, lakeM: rule.lakeM, drainM: rule.drainM,
      distPresent: m.distPresent, distHistoric: m.distHistoric,
      distDrain: m.distDrain, lastWaterYear: m.lastWaterYear,
      occurrence: m.occurrence, handM: m.handM, encroached: m.encroached,
      // Only meaningful outside the earlier shoreline. On the old bed itself
      // distHistoric is zero and the subtraction returns the distance to
      // today's water, which is not a retreat and would pull the
      // shoreline-disagreement chunk into an answer decide() never made that
      // finding for. decide() is already structured this way: it returns
      // before reaching its own retreat test whenever distHistoric is zero.
      retreatM: (m.distPresent !== null && m.distHistoric)
                  ? Math.max(0, m.distPresent - m.distHistoric) : null,
      flowClass: classifyFlow(m.distDrain, rule.drainM),
      handClass: classifyHand(m.handM),
      upaKm2: upaKm2, distTrunk: distTrunk, elevAboveMinM: elevAbove,
      runoffDisplacedM3: vol, runoffLoM3: volLo, runoffHiM3: volHi,
      runoffAnnualM3: volYear, tankerEquiv: tankers,
      storageLpm2: state.storageLpm2,
      retentionRequiredM3: retain, rwhRequiredM3: rwh,
      retentionShortfallM3: shortfall,
      routeTraced: route.traced, routeSteps: route.steps,
      routeLengthM: route.lengthM, routeLowGroundM: route.lowGroundM,
      receivingMaxUpaKm2: route.maxUpaKm2, structuresOnRoute: route.structures,
      verdict: out.d, codes: out.codes || [],
      hasBuildings: !!state.centroids,
      nNeighbours: nb.length,
      nearestFlaggedM: nb.length ? nb[0].m : null,
      intent: null                       // filled in per question by retrieve()
    }
  };
}

// The corpus is the authoritative home for every number the tool computes
// with; PARAMS is a bootstrap copy so the plot check runs before corpus.json
// lands. If the two disagree the corpus wins, because it is the copy carrying
// the citation — and it says so out loud, because a silent correction would
// mean the screening before the fetch used a different rule from the one after.
function reconcileParams(corpus){
  var drift = [];
  Object.keys(PARAMS).forEach(function(k){
    var e = corpus.params[k];
    if(!e) return;
    if(e.v !== PARAMS[k]){ drift.push(k+' '+PARAMS[k]+' \u2192 '+e.v); PARAMS[k] = e.v; }
  });
  var u = corpus.params.uncertaintyM;
  if(u && u.v !== UNCERTAINTY_M) drift.push('uncertaintyM differs: corpus says '+u.v);
  if(drift.length){
    console.warn('corpus overrode bootstrap parameters: '+drift.join(', '));
    toast('Parameters differ from the corpus — run ./check_corpus.py: '+drift.join(', '));
  }
}

// Four outcomes, and deliberately none of them is APPROVE. This tool screens;
// it does not grant permission, and saying so is both honest and the answer to
// "would you approve a build on a tank too small for you to see?"
function decide(m, rule){
  if(m.distPresent === null || m.distHistoric === null)
    return {d:'REFER', codes:['refer.outside-study-area'],
      why:['This plot lies outside the mapped study area. No satellite evidence exists for it.']};

  // Occurrence comes from a different layer than the distance fields, and a
  // pixel can carry one and not the other. Printed raw that reads as
  // "null% of observations", which is worse than saying nothing.
  var occ = m.occurrence === null ? null : m.occurrence + '%';

  if(m.distPresent === 0)
    return {d:'REJECT', codes:['reject.inside-live-water'],
      why:['The plot footprint falls inside an existing surface water body'
      + (occ ? ', recorded as water in ' + occ + ' of observations since 1984.' : '.')]};

  if(m.distHistoric === 0){
    var when = m.lastWaterYear ? 'last recorded as water in ' + m.lastWaterYear
                               : 'recorded as water before 2000';

    if(m.occurrence >= 50){
      var w = ['The plot sits on a former water body, ' + when + ', water in '
        + occ + ' of observations.'];
      if(m.encroached > .1) w.push('Construction is already present on this footprint.');
      return {d:'REJECT', codes:['reject.former-water-high-occurrence'], why:w};
    }

    // Occurrence alone cannot carry this branch, and reading it that way
    // inverts the tool against its own purpose. JRC occurrence is the share of
    // observations that were water across 1984-2021, so a tank drained and
    // built over part-way through the window scores LOW precisely BECAUSE it
    // was destroyed — the more completely it was encroached, the weaker the
    // only signal that was being allowed to reject it. A bed filled in 2017
    // came back at sixteen per cent and screened as an unresolved wet season.
    //
    // Two corroborating signals settle it, both already measured and, until
    // now, both sampled and then discarded here.
    var built = m.encroached > .1;
    var atChannel = m.handM !== null && m.handM <= PARAMS.handDeepM;

    // Construction standing on a mapped former bed is not an ambiguous record.
    // It is the encroachment this tool was built to find, and the red the map
    // is already painting under the click.
    if(built)
      return {d:'REJECT', codes:['reject.construction-on-former-bed'],
        why:['The plot sits on a former water body, ' + when + ', and construction '
          + 'already stands on that footprint.',
          occ ? 'Water occurrence reads ' + occ + ' of observations, which is low '
            + 'because the record spans the period in which the bed was lost: a '
            + 'tank drained part-way through 1984–2021 is dry for the remainder '
            + 'of it. The low share is evidence of the loss, not evidence against it.'
            : 'How often it held water is not recorded at this pixel.']};

    // A bed still sitting at the level of the channel it drained into is a
    // tank on the terrain even where the water record is thin.
    if(atChannel)
      return {d:'REFER', codes:['refer.intermittent-water'],
        why:['The plot sits on land recorded as water ' + (occ ? 'only ' + occ
            + ' of the time, ' : '') + when + ', and stands at the level of the '
          + 'channel it drains into.',
          'Low occurrence on a bed at channel level does not resolve to a wet '
          + 'season: it is equally the signature of a tank lost during the record. '
          + 'Establish the boundary against the notified tank schedule.']};

    return {d:'REFER', codes:['refer.intermittent-water'],
      why:[occ
        ? 'The plot sits on land recorded as water only ' + occ + ' of the time, '
          + when + '. At 30 m resolution intermittent water cannot be '
          + 'distinguished from a wet season.'
        : 'The plot sits on land recorded as water, ' + when + '. How often it '
          + 'held water is not recorded at this pixel, so the record cannot '
          + 'distinguish a tank from a field that floods in a wet year.']};
  }

  var R = [];
  function near(v, thr){ return Math.abs(v - thr) <= UNCERTAINTY_M; }

  if(m.distPresent < rule.lakeM - UNCERTAINTY_M)
    R.push({d:'REJECT', code:'reject.inside-buffer',
      t:'The plot lies ' + m.distPresent + ' m from the present water edge, '
      + 'inside the ' + rule.lakeM + ' m buffer.'});
  else if(near(m.distPresent, rule.lakeM))
    R.push({d:'REFER', code:'refer.buffer-within-uncertainty',
      t:'The plot lies ' + m.distPresent + ' m from the present water edge. '
      + 'At ±' + UNCERTAINTY_M + ' m that cannot be resolved against the ' + rule.lakeM
      + ' m buffer. Ground survey required.'});

  // The finding this whole tool exists to make. An applicant measures their
  // buffer from the shoreline as it stands today. Where the lake has since
  // shrunk, that boundary is one encroachment itself produced, and the two
  // measurements disagree.
  if(m.distPresent - m.distHistoric > 30 && m.distHistoric < rule.lakeM)
    R.push({d:'REFER', code:'refer.shoreline-disagreement',
      t:'Measured from today’s water edge the plot is ' + m.distPresent
      + ' m away and clears the ' + rule.lakeM + ' m buffer. Measured from the 1984–99 '
      + 'edge it is ' + m.distHistoric + ' m away, inside it. The shoreline has retreated '
      + (m.distPresent - m.distHistoric) + ' m here, so the buffer measured today is drawn '
      + 'from a boundary that encroachment created. Verify against the notified lake boundary.'});

  // Never a rejection. MERIT Hydro is 90 m and cannot site an individual
  // rajakaluve, so the honest output is a referral naming that limit.
  if(m.distDrain < rule.drainM + UNCERTAINTY_M)
    R.push({d:'REFER', code:'refer.near-drainage',
      t:'The plot lies about ' + m.distDrain + ' m from a terrain-derived '
      + 'drainage line, against a ' + rule.drainM + ' m buffer. Drain order is not resolved '
      + 'at the 90 m source resolution — check the BBMP rajakaluve alignment for this '
      + 'survey number.'});

  if(m.handM !== null && m.handM <= 1)
    R.push({d:'CONDITIONS', code:'conditions.low-ground',
      t:'The plot stands ' + m.handM + ' m above the nearest drainage '
      + 'line. On-site retention and a plinth condition should be imposed.'});

  if(!R.length) return {d:'NO_OBJECTION', codes:['no-objection.nothing-found'], why:[
    'No recorded water body, buffer breach or drainage line within ' + UNCERTAINTY_M
      + ' m of this plot.',
    'Absence of evidence at 30 m resolution is not evidence of absence: tanks under roughly '
      + 'half a hectare do not appear in this record.']};

  var rank = {REJECT:3, REFER:2, CONDITIONS:1};
  var top = R.reduce(function(a,b){ return rank[b.d] > rank[a.d] ? b : a; });
  // The codes ride alongside the prose rather than replacing it. Nothing that
  // already reads decide() has to change, and the retriever gets a machine
  // handle on which branch fired, which is what the citation spine hangs on.
  return {d:top.d, why:R.map(function(x){ return x.t; }),
          codes:R.map(function(x){ return x.code; })};
}

// The citation spine. Every branch decide() can take names the chunk that
// explains it, and that chunk is forced into the evidence pack at rank zero.
// Two consequences: the pack is never empty, and the tool's own reasoning is
// always citable rather than being the one claim in the answer with no source.
// check_corpus.py asserts this map and decide() agree in both directions.
var CODE_CHUNK = {
  'refer.outside-study-area':          'refusal.outside-study-area',
  'reject.inside-live-water':          'outcome.reject.meaning',
  'reject.former-water-high-occurrence':'outcome.reject.meaning',
  'reject.construction-on-former-bed':  'outcome.reject.meaning',
  'refer.intermittent-water':          'outcome.refer.meaning',
  'reject.inside-buffer':              'outcome.reject.meaning',
  'refer.buffer-within-uncertainty':   'error.budget.combined-20m',
  'refer.shoreline-disagreement':      'outcome.shoreline-disagreement',
  'refer.near-drainage':               'rule.rajakaluve.bbmp-alignment-governs',
  'conditions.low-ground':             'outcome.conditions.meaning',
  'no-objection.nothing-found':        'outcome.no-objection.meaning'
};

// The three questions this layer was built to answer, one click away. The
// short label is what fits on a chip; the long form is what gets asked, since
// the intent router reads the wording.
var ASK_CHIPS = [
  ['What happens if built?', 'What happens if a construction occurs at this place?'],
  ['Should it be allowed?',  'Is this construction feasible, and should it be allowed?'],
  ['Effect on flooding?',    'Will it affect the flooding level here and downstream?']
];

var OUTCOME = {
  REJECT:       {c:'reject',     ic:'✕', t:'REJECT'},
  REFER:        {c:'refer',      ic:'?',      t:'REFER TO GROUND SURVEY'},
  CONDITIONS:   {c:'conditions', ic:'!',      t:'CONDITIONS REQUIRED'},
  NO_OBJECTION: {c:'clear',      ic:'✓', t:'NO RECORDED OBJECTION'}
};

function metres(v){ return v === null ? '—' : v >= 255 ? '> 255 m' : v + ' m'; }

// ---------------------------------------------------------------------------
// DRIVERS — the measurements that actually produced the verdict
// ---------------------------------------------------------------------------
// The old panel rendered eleven rows at one size, so "0 m to the 1984-99 edge"
// — the finding the whole tool exists to make — was set in the same 14 px as
// "plot frontage assumed", which is a value the officer typed in themselves.
// decide() already tags which branch it took, so the two numbers behind the
// verdict can be lifted out of the table and given the size they earned.
function driversFor(ck){
  var m = ck.m, out = ck.out, rule = ck.rule, rec = ck.ctx.rec;
  var codes = out.codes || [];
  function has(c){ return codes.indexOf(c) !== -1; }
  var D = [];
  function add(k, v, n, tone){ D.push({k:k, v:v, n:n, tone:tone}); }

  if(has('refer.outside-study-area'))
    add('Coverage', 'None', 'outside the mapped study area');

  if(has('reject.inside-live-water'))
    add('Inside live water', '0 m', 'to the present water edge', 'hot');

  if(has('reject.former-water-high-occurrence') || has('reject.construction-on-former-bed')
     || has('refer.intermittent-water')){
    add('On the 1984–99 bed', '0 m', 'to the earlier water edge', 'hot');
    if(has('reject.construction-on-former-bed'))
      add('Already built', Math.round(rec.encroached*100) + '%', 'of the probe reads as construction', 'hot');
    else if(m.occurrence !== null)
      add('Water occurrence', m.occurrence + '%', 'of observations, 1984–2021',
          m.occurrence >= 50 ? 'hot' : null);
  }

  if(has('reject.inside-buffer') || has('refer.buffer-within-uncertainty'))
    add('To water edge', m.distPresent + ' m',
        'against a ' + rule.lakeM + ' m buffer, ±' + UNCERTAINTY_M + ' m',
        has('reject.inside-buffer') ? 'hot' : 'warn');

  // The finding worth demonstrating, so it leads whenever it fires.
  if(has('refer.shoreline-disagreement')){
    D.unshift({k:'To 1984–99 edge', v:m.distHistoric + ' m',
               n:'inside the ' + rule.lakeM + ' m buffer', tone:'hot'});
    D.unshift({k:'Shoreline retreat', v:rec.retreatM + ' m',
               n:'the two records disagree by this much here', tone:'warn'});
  }

  if(has('refer.near-drainage'))
    add('To drainage line', m.distDrain + ' m',
        'against a ' + rule.drainM + ' m buffer', 'warn');

  if(has('conditions.low-ground'))
    add('Above drainage', m.handM + ' m', 'retention and a plinth condition', 'warn');

  if(has('no-objection.nothing-found')){
    add('To water edge', metres(m.distPresent), 'nearest recorded water', 'ok');
    add('To drainage line', metres(m.distDrain), 'nearest terrain channel', 'ok');
  }

  if(!D.length){
    add('To water edge today', metres(m.distPresent));
    add('To 1984–99 edge', metres(m.distHistoric));
  }
  return D.slice(0, 2);
}

// ---------------------------------------------------------------------------
// THE PROBE MARKER
// ---------------------------------------------------------------------------
// The check reduces over a disc about a plot wide, and the old marker was a
// fixed 14 px dot at every zoom. That told the reader nothing about how much
// ground the verdict was drawn from — whether it came from their plot or from
// the lake fifty metres beyond it. This draws the disc at its true radius and
// keeps it true as the map zooms.
function probeRadiusM(){ return Math.max(6, state.plotM / 2); }

function metresPerPixel(lat){
  return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, map.getZoom());
}

function sizeProbe(){
  if(!state.marker || !state.probeEl) return;
  var ll = state.marker.getLngLat();
  var px = probeRadiusM() / metresPerPixel(ll.lat);
  var d = Math.max(10, px * 2);
  var disc = state.probeEl.querySelector('.disc');
  var ring = state.probeEl.querySelector('.ring');
  disc.style.width = disc.style.height = d + 'px';
  ring.style.width = ring.style.height = (d + 10) + 'px';
}
// The probe disc is drawn at its true ground radius and the lost-water
// rendering crossfades on zoom, so both have to be recomputed as the map moves.
map.on('zoom', function(){ sizeProbe(); update(); });

function placeProbe(lngLat, tone){
  if(state.marker) state.marker.remove();
  var el = document.createElement('div');
  el.className = 'probe';
  el.style.color = 'var(--v-' + tone + ')';
  el.innerHTML = '<span class="disc"></span><span class="ring"></span>'
               + '<span class="pulse"></span><span class="core"></span>';
  state.probeEl = el;
  state.marker = new maplibregl.Marker({element: el}).setLngLat(lngLat).addTo(map);
  sizeProbe();
}

// ---------------------------------------------------------------------------
// The retention panel — what it would take, and what could discharge it
// ---------------------------------------------------------------------------
// A tool that only blocks gets overridden. This is the half that says what the
// site could be instead, and it is deliberately not phrased as advice: it
// states a requirement in cubic metres and lists the land uses that can hold
// that volume. Which one applies is the authority's decision.
//
// The options are corpus chunks of kind 'option', selected by the same trigger
// channel the retrieval layer uses — so a chunk that fires here is a chunk the
// evidence pack will also carry, and the panel cannot show an option the
// answer has never heard of.
//
// They are ordered by the SPECIFICITY of the trigger that fired: the number of
// conditions in the matched group, descending. An option that fired on "on the
// former bed AND water most of the time" precedes one that fired on "low
// ground", which precedes the one available anywhere. That is a ranking
// derived from the site's own state rather than from a score this tool
// invented, and it needs no new frontmatter field.
function optionsFor(rec){
  if(!state.corpus || !rec.inAoi) return [];
  var out = [];
  state.corpus.chunks.forEach(function(c){
    if(c.kind !== 'option') return;
    for(var i = 0; i < c.when.length; i++){
      var g = c.when[i], all = true;
      for(var j = 0; j < g.length; j++)
        if(!testCond(rec, g[j][0], g[j][1], g[j][2])){ all = false; break; }
      if(all){ out.push({c: c, spec: g.length}); return; }
    }
  });
  // Specificity first, declared rank second. A chunk with no rank sorts last
  // rather than sorting arbitrarily, which makes a newly added option visibly
  // unplaced instead of quietly jumping the queue.
  function rank(x){ return (OPTION_META[x.c.id] || {}).rank || 99; }
  out.sort(function(a, b){ return b.spec - a.spec || rank(a) - rank(b); });
  return out;
}

// Why each option fired, in the officer's language rather than the trigger's,
// and where it sits when two fire on equally specific triggers.
//
// The tie-break has to be declared. Sorting ties on chunk id is deterministic
// but meaningless, and it put the option available on ANY site first — ahead of
// restoring a bed the plot is demonstrably sitting on. Rank orders them by how
// much of the problem the use actually addresses: putting the water back,
// then holding it, then building around it, then recharging what is left.
//
// `universal` marks an option whose trigger is "a requirement exists", so it
// fires on every plot inside the study area. It is a real supplement and never
// a finding: a panel whose entire content is an option available anywhere has
// told the officer nothing about THIS plot, and repeating it on every click is
// how a tool trains people to stop reading it.
var OPTION_META = {
  'option.wetland-restoration-tdr': {rank: 1, why: 'the plot is on the 1984\u201399 bed'},
  'option.sponge-park-retention':   {rank: 2, why: 'the ground here is low'},
  'option.build-around-channel':    {rank: 3, why: 'a drainage line runs through the plot'},
  'option.recharge-structure':      {rank: 4, why: 'available on any site', universal: true}
};

// Did anything fire that is actually about this plot? The retention panel hangs
// on this rather than on the verdict, because the alternatives exist for the
// ground the plot sits on, not for the ruling the screening reached. A plot on
// low ground is worth a sunken park whether or not the buffer test cleared it.
function siteSpecificOptions(opts){
  return opts.filter(function(o){ return !(OPTION_META[o.c.id] || {}).universal; });
}

function renderRetention(ctx){
  var el = document.getElementById('retention');
  var off = function(){ el.classList.remove('on'); el.innerHTML = ''; };
  if(!ctx || !ctx.rec.inAoi || ctx.rec.retentionRequiredM3 === null) return off();

  var r = ctx.rec, opts = optionsFor(r);
  // Nothing fired that is about this plot. Seven sites in twelve came back with
  // no recorded objection and were still being handed a "requirement" of the
  // same thirty cubic metres and one option available anywhere — a demand the
  // screening had found no basis for, phrased as though it had. The honest
  // output there is no panel.
  if(!siteSpecificOptions(opts).length) return off();
  function row(k, v, cls){
    return '<div class="metric"><span class="k">' + k + '</span>'
         + '<span class="v' + (cls ? ' ' + cls : '') + '">' + v + '</span></div>';
  }

  var rows = row('Displaced per design storm', r.runoffDisplacedM3 + ' m\u00b3')
    + row('To send nothing extra downhill, hold', r.retentionRequiredM3 + ' m\u00b3')
    + '<div class="rnote">This volume follows from the assumed plot size and the '
    + 'design storm. It is the same for any plot of this frontage anywhere in the '
    + 'study area, and is not a measurement of this location \u2014 what is '
    + 'specific to here is which uses below can hold it.</div>';

  if(r.rwhRequiredM3 === null){
    rows += row('Already required by rule', '\u2014')
          + '<div class="rnote">Enter the storage the rainwater harvesting rule '
          + 'in force requires, above, and the shortfall against it is computed. '
          + 'This tool does not hold that figure and will not guess it.</div>';
  } else {
    rows += row('Already required by rule', r.rwhRequiredM3 + ' m\u00b3')
          + row('Shortfall', r.retentionShortfallM3 + ' m\u00b3',
                r.retentionShortfallM3 > 0 ? 'amber' : null)
          + '<div class="rnote">The storage figure is the one entered above, not '
          + 'a rule this tool read. Confirm it against the notification in force.</div>';
  }

  var list = opts.length
    ? '<div class="phead" style="border-top:1px solid var(--line)">'
      + '<span class="lbl">What can discharge this</span></div>'
      + '<div class="rbody">' + opts.map(function(o, i){
          return '<div class="opt"><span class="n">' + (i+1) + '</span>'
            + '<span class="ob"><b>' + esc(o.c.title) + '</b>'
            + '<i>' + esc((OPTION_META[o.c.id] || {}).why
                 || o.c.when[0].join(' ')) + '</i></span>'
            + (o.c.verify ? '<span class="odraft" title="drafted from public '
                + 'knowledge, not yet checked against the original source">drafted</span>'
              : '') + '</div>';
        }).join('')
      + '<div class="rnote">These are the uses that can hold what this plot '
      + 'displaces. Which one applies is the authority\u2019s decision, not '
      + 'this tool\u2019s.</div></div>'
    : '';

  el.innerHTML = '<div class="phead"><span class="lbl">Retention requirement</span></div>'
    + '<div class="rbody">' + rows + '</div>' + list;
  el.classList.add('on');
}

// ---------------------------------------------------------------------------
// The downstream panel
// ---------------------------------------------------------------------------
// This is the half of "who pays" the tool could not previously answer. It says
// where the water goes and what the ground it reaches is like. It does not say
// that anything floods there, and the closing note is not decoration: the
// distinction between receiving runoff and being inundated is the one this
// whole tool turns on, and it has to survive being read off a screen by
// somebody who skipped the rest.
function renderDownstream(ctx){
  var el = document.getElementById('downstream');
  var r = ctx && ctx.route;
  if(!ctx || !ctx.rec.inAoi || !r){ el.classList.remove('on'); el.innerHTML = ''; return; }

  var head = '<div class="phead"><span class="lbl">Where this water goes</span></div>';

  if(!r.traced){
    // Absent, not zero. The same distinction hydro.png already earns: a layer
    // that was never exported has not measured a route of length nothing.
    el.innerHTML = head
      + '<div class="dsmiss">The routing layer has not been exported for '
      + esc(CITIES[state.city].label) + ', so where this water goes cannot be '
      + 'traced. Run section 14 of <code>gee_blue_grid.js</code>, then '
      + '<code>./fetch_layers.sh ' + esc(state.city) + '</code>.</div>';
    el.classList.add('on');
    return;
  }

  function row(k, v){
    return '<div class="metric"><span class="k">' + k + '</span>'
         + '<span class="v">' + v + '</span></div>';
  }
  var km = function(m){ return m >= 1000 ? (m/1000).toFixed(1) + ' km' : m + ' m'; };

  var rows = row('Traced downhill', km(r.lengthM))
    + row('Of that, on low ground', km(r.lowGroundM))
    + row('Largest catchment reached', r.maxUpaKm2 === null ? '—'
            : r.maxUpaKm2 + ' km²')
    + row('Flagged structures near the line',
          r.structures === null ? 'layer not loaded' : String(r.structures));

  var list = r.receiving.length
    ? '<div class="lbl" style="margin:14px 0 4px">Receiving ground</div>'
      + r.receiving.map(function(c, i){
          return '<div class="rcv"><span class="n">' + (i+1) + '</span>'
            + '<span class="co">' + c.lat.toFixed(4) + ', ' + c.lon.toFixed(4)
            + '<span class="cl">' + (c.handM === null ? 'height unresolved'
                 : HAND_PHRASE[classifyHand(c.handM)] || 'ground') + '</span></span>'
            + '<span class="ct">' + c.upaKm2 + ' km²</span></div>';
        }).join('')
    : '';

  el.innerHTML = head + '<div class="dsbody">' + rows + list
    + '<div class="dsnote">Structures are counted within '
    + PARAMS.routeCorridorM + ' m of the line. The trace stops because '
    + ROUTE_END[r.endedBy]
    + '. It follows terrain, not pipes, and says this ground receives what the '
    + 'plot sheds — not that it floods.</div></div>';
  el.classList.add('on');
}

// Short forms of the exposure classes, for the receiving list. The long forms
// live in composeOffline and are sentences; a table cell needs three words.
var HAND_PHRASE = {
  AT_DRAINAGE_LEVEL:    'at drainage level',
  DEEP_IN_A_WATER_PATH: 'inside a water path',
  LOW_GROUND:           'low ground',
  MARGINAL:             'marginally above',
  ELEVATED:             'elevated',
  UNKNOWN:              'height unresolved'
};

// One source carries the line and the receiving cells together, filtered apart
// by geometry type in the layer definitions. Two sources for one finding would
// be two things to keep in step.
function drawRoute(route){
  if(!map.getSource('route')) return;
  var f = [];
  if(route && route.traced && route.path.length > 1){
    f.push({type:'Feature', geometry:{type:'LineString', coordinates: route.path},
            properties:{}});
    route.receiving.forEach(function(c, i){
      f.push({type:'Feature', geometry:{type:'Point', coordinates:[c.lon, c.lat]},
              properties:{rank: i + 1}});
    });
  }
  map.getSource('route').setData({type:'FeatureCollection', features: f});
  update();
  renderLegend();
}

function checkPlot(lngLat){
  var S = state.samplers;
  if(!S.buffers || !S.history){
    toast('Measurement layers missing — re-run gee_blue_grid.js, then ./fetch_layers.sh '
      + state.city); return;
  }
  var rule = RULESETS[state.rule];
  var ctx = siteContext(lngLat, rule);
  var m = ctx.m, out = ctx.verdict;
  state.lastCheck = {m:m, out:out, ctx:ctx, lngLat:lngLat, rule:rule, at:new Date()};
  // A new site invalidates the answer about the old one.
  state.lastAnswer = null;
  hideAnswer();

  var st = OUTCOME[out.d];
  placeProbe(lngLat, st.c);

  var rows = [
    ['Coordinates', lngLat.lat.toFixed(5) + ', ' + lngLat.lng.toFixed(5)],
    ['Plot frontage assumed', state.plotM + ' m'],
    ['To water edge today', metres(m.distPresent)],
    ['To 1984–99 water edge', metres(m.distHistoric)],
    ['To drainage line', metres(m.distDrain)],
    ['Last recorded as water', m.lastWaterYear || 'never, 1984–2021'],
    ['Water occurrence', m.occurrence === null ? '—' : m.occurrence + '%'],
    ['Above nearest drainage', metres(m.handM)],
    ['Catchment through this point', ctx.rec.upaKm2 === null ? '—'
       : ctx.rec.upaKm2 + ' km²'],
    ['Runoff displaced per storm', ctx.rec.runoffDisplacedM3 === null ? '—'
       : ctx.rec.runoffDisplacedM3 + ' m³ (' + ctx.rec.runoffLoM3 + '–'
         + ctx.rec.runoffHiM3 + ')'],
    ['Rule applied', rule.label]
  ];

  showVerdict({c:st.c, ic:st.ic, t:st.t, s:out.why.join(' ')}, rows, null,
              [{label:'Issue screening certificate', fn:issueCertificate, primary:true}],
              driversFor(state.lastCheck));
  renderDownstream(ctx);
  renderRetention(ctx);
  drawRoute(ctx.route);
}

function selectBuilding(f){
  var p = f.properties;
  state.selected = p;
  state.selectedF = f;
  // Selecting a footprint moves the site context to it, so the ask box, the
  // evidence brief and any certificate issued next are all about the same
  // thing. Without this a question asked after a building click would answer
  // about whichever plot happened to be clicked before it.
  state.lastAnswer = null;
  hideAnswer();
  var drivers = null, ctx = null;
  if(state.samplers.buffers){
    var ctr = centroidOf(f);
    var ll = {lng: ctr[0], lat: ctr[1]};
    var rule = RULESETS[state.rule];
    ctx = siteContext(ll, rule, p);
    state.lastCheck = {m: ctx.m, out: ctx.verdict, ctx: ctx, lngLat: ll,
                       rule: rule, at: new Date()};
  }
  var r = p.verdict==='RED_FORMER_WATER_BODY'
      ? {c:'reject', ic:'✕', t:'BUILT ON FORMER WATER BODY',
         s:'Footprint overlaps land classified as surface water before 2000.'}
    : p.verdict==='RED_BLOCKS_DRAINAGE'
      ? {c:'conditions', ic:'!', t:'BLOCKS A NATURAL DRAINAGE PATH',
         s:'Footprint sits on a terrain channel carrying upstream runoff.'}
      : {c:'conditions', ic:'!', t:'PARTIAL OVERLAP',
         s:'Part of the footprint falls on former water or a drainage path.'};

  // A flagged footprint carries its own per-polygon measurements, computed in
  // Earth Engine against the geometry itself. Those are better evidence than
  // the disc reduction, so they are what gets promoted.
  drivers = [
    {k:'Footprint on former water', v:Math.round(p.lost_frac*100) + '%',
     n:'of the polygon area', tone: p.lost_frac > .5 ? 'hot' : 'warn'},
    {k:'Catchment blocked', v:(+p.upstream_km2).toFixed(2) + ' km²',
     n:'drains through this structure', tone: +p.upstream_km2 > 1 ? 'hot' : null}
  ];

  var rows = [
    ['Risk score', (+p.risk_score).toFixed(1)],
    ['Footprint on former water', Math.round(p.lost_frac*100)+'%'],
    ['Footprint in flow path', Math.round(p.flow_frac*100)+'%'],
    ['Upstream catchment', (+p.upstream_km2).toFixed(2)+' km²'],
    ['Height above drainage', (+p.hand_m).toFixed(1)+' m'],
    ['Building area', Math.round(p.area_in_meters)+' m²'],
    ['Footprint confidence', Math.round(p.confidence*100)+'%']
  ];
  showVerdict(r, rows, p, null, drivers);
  // A flagged footprint sheds water the same way a clicked plot does, so the
  // question "who receives it" is the same question and gets the same answer.
  renderDownstream(ctx);
  renderRetention(ctx);
  drawRoute(ctx && ctx.route);
}

// The evidence brief and the free-text answer are the same product asked a
// fixed question, so they go through one generator rather than diverging into
// two prose styles that drift apart. The building's own per-footprint
// measurements ride along as structure-scoped facts.
function writeBrief(p){
  var f = state.selectedF;
  if(!f || !state.samplers.buffers){
    toast('Measurement layers missing — re-run gee_blue_grid.js, then ./fetch_layers.sh '
      + state.city);
    return;
  }
  var c = centroidOf(f);
  var lngLat = {lng: c[0], lat: c[1]};
  var rule = RULESETS[state.rule];
  var ctx = siteContext(lngLat, rule, p);
  // The brief is about this footprint, so the certificate and any follow-up
  // question are about it too.
  state.lastCheck = {m: ctx.m, out: ctx.verdict, ctx: ctx, lngLat: lngLat,
                     rule: rule, at: new Date()};

    + 'downstream?', ctx);
}

var PROVENANCE = [
  ['Surface water',  'JRC Global Surface Water v1.4 — transition, occurrence and YearlyHistory, 1984–2021'],
  ['Terrain',        'MERIT Hydro v1.0.1 — upstream drainage area and height above nearest drainage, 90 m'],
  ['Land cover',     'Dynamic World V1 — mode of annual labels, 2023–2025, 10 m'],
  ['Footprints',     'Google Open Buildings v3 — confidence ≥ 0.70, area ≥ 40 m²'],
  ['Imagery',        'Landsat 5 C02 L2 (2003–07), Sentinel-2 SR Harmonized (2023–25)'],
  ['Distance field', 'fastDistanceTransform, EPSG:32643 at 10 m, ceiling 255 m'],
  ['Raster',         '2048 × 1195 over the study area, 6.36 m per pixel'],
  ['Upstream area',  'MERIT Hydro upa, log-packed: code = 255·log10(1+km²)/log10(1001), ceiling 1000 km²'],
  ['Runoff',         'volumetric rational form: area × design storm depth × change in runoff coefficient']
];

var ERROR_BUDGET = [
  ['JRC 30 m pixel — position of the shoreline', '± 15 m'],
  ['Distance-transform quantum at 10 m',              '± 7 m'],
  ['Raster georeferencing, one pixel',                '± 6 m'],
  ['Thumbnail resample and byte decode',              'nil, nearest-neighbour'],
  ['Combined in quadrature',                          '± ' + UNCERTAINTY_M + ' m']
];

// A plain hash, not crypto.subtle: that needs a secure context, and on a
// hall's LAN IP this page is not one, where it would throw silently. The
// canonical string is printed on the certificate so anyone can recompute the
// digest and detect an altered copy.
function fnv1a(str){
  var h = 0x811c9dc5;
  for(var i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0;
  }
  return ('00000000' + h.toString(16)).slice(-8).toUpperCase();
}

function nextSeq(){
  var n = 1;
  try {
    n = (parseInt(localStorage.getItem('vbg_seq'), 10) || 0) + 1;
    localStorage.setItem('vbg_seq', n);
  } catch(e){}
  return n;
}

function issueCertificate(){
  var ck = state.lastCheck;
  if(!ck){ toast('Check a plot first.'); return; }
  toast('Capturing site evidence…');
  map.flyTo({center:[ck.lngLat.lng, ck.lngLat.lat], zoom:17, duration:700});
  map.once('idle', function(){
    var snap = '';
    try { snap = map.getCanvas().toDataURL('image/png'); } catch(e){}
    hideToast();
    renderCertificate(ck, snap);
  });
}

function renderCertificate(ck, snap){
  var m = ck.m, out = ck.out, rule = ck.rule, c = CITIES[state.city];
  // An answer is only carried onto the certificate if it is about this site
  // and was reasoned under this ruleset. Anything else is stale by definition.
  var ans = (state.lastAnswer && state.lastAnswer.pack.site.ruleset === rule.id &&
             Math.abs(state.lastAnswer.pack.site.lat - ck.lngLat.lat) < 1e-6 &&
             Math.abs(state.lastAnswer.pack.site.lon - ck.lngLat.lng) < 1e-6)

    // What the tool said, and what it said it from. A certificate whose
    // reasoning was drawn from a different corpus version, or from a different

    (state.corpus ? state.corpus.corpus_version : 'no-corpus'),
    (ans ? ans.answer.generator : 'none'),

    ].join('|');
  var ref = 'VBG/BLR/' + iso.slice(0,10).replace(/-/g,'') + '/'
