<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanished Blue Grid</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
:root{
  --ink:#05070c; --panel:rgba(9,13,22,.82); --panel-solid:#0a0f19;
  --line:rgba(140,170,220,.16); --line-hot:rgba(140,170,220,.34);
  --text:#e9f0fa; --dim:#7d8ea8; --faint:#4d5b70;
  --water-old:#1f6feb; --water-now:#58a6ff; --red:#ff5b52; --amber:#f0b429;
  --violet:#a371f7; --green:#3fb950;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(5,7,12,.7)!important}
.maplibregl-ctrl-attrib a{color:var(--faint)!important}

/* ---------- shell ---------- */
.glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 18px 60px rgba(0,0,0,.55)}
#top{position:absolute;top:0;left:0;right:0;height:58px;z-index:20;display:flex;
  align-items:center;gap:20px;padding:0 18px;
  background:linear-gradient(180deg,rgba(5,7,12,.96),rgba(5,7,12,0));pointer-events:none}
#top>*{pointer-events:auto;flex:none}
@media (max-width:1180px){ .tabs button{padding:8px 10px;font-size:11px}
  #city{max-width:190px} .brand i{display:none} }
@media (max-width:980px){ #csvBtn{display:none} }
.brand{display:flex;align-items:baseline;gap:9px;flex:none}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand i{font-style:normal;font-size:9px;letter-spacing:.22em;color:var(--red);
  font-family:var(--mono);border:1px solid rgba(255,91,82,.4);padding:2px 6px;border-radius:4px}

select{background:var(--panel-solid);color:var(--text);border:1px solid var(--line);
  border-radius:9px;padding:7px 11px;font-size:12px;font-family:var(--sans);
  font-weight:600;cursor:pointer;outline:none}

.tabs{display:flex;gap:2px;background:rgba(9,13,22,.8);border:1px solid var(--line);
  border-radius:10px;padding:3px;margin-left:auto}
.tabs button{background:none;border:none;color:var(--dim);font:600 11.5px/1 var(--sans);
  letter-spacing:.04em;padding:8px 14px;border-radius:7px;cursor:pointer;
  transition:color .18s, background .18s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:rgba(47,129,247,.18);color:#cfe3ff;
  box-shadow:inset 0 0 0 1px rgba(47,129,247,.4)}

.ghost{background:rgba(9,13,22,.8);border:1px solid var(--line);color:var(--dim);
  border-radius:10px;padding:8px 13px;font:600 11.5px/1 var(--sans);cursor:pointer;
  transition:color .18s,border-color .18s}
.ghost:hover{color:var(--text);border-color:var(--line-hot)}

/* ---------- rails ---------- */
#left{position:absolute;left:16px;top:70px;width:302px;z-index:15;
  max-height:calc(100vh - 210px);display:flex;flex-direction:column}
#right{position:absolute;right:16px;top:70px;width:306px;z-index:15;
  max-height:calc(100vh - 210px);overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#left::-webkit-scrollbar,#right::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:5px}
#right::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--line-hot);border-radius:3px}

.card{padding:15px 16px}
.card h3{font-size:9.5px;letter-spacing:.2em;color:var(--faint);font-weight:700;
  text-transform:uppercase;margin-bottom:12px;font-family:var(--mono)}

/* ---------- stats ---------- */
.metric{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:7px 0;border-bottom:1px solid rgba(140,170,220,.07)}
.metric:last-child{border-bottom:none}
.metric .k{font-size:11.5px;color:var(--dim)}
.metric .v{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.metric.big .v{font-size:23px;font-weight:700;letter-spacing:-.02em}
.v.red{color:var(--red)} .v.blue{color:var(--water-now)} .v.violet{color:var(--violet)}

.bar{height:5px;border-radius:3px;background:rgba(47,129,247,.14);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff8f6b);
  border-radius:3px;transition:width 1.1s cubic-bezier(.22,1,.36,1)}

/* ---------- priority list ---------- */
.scroll{overflow-y:auto}
.item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
  cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
.item:hover{background:rgba(47,129,247,.09);border-color:rgba(47,129,247,.28)}
.item .rank{font-family:var(--mono);font-size:10px;color:var(--faint);width:18px;flex:none}
.item .body{flex:1;min-width:0}
.item .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.item .sc{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- verdict ---------- */
#verdict{display:none;animation:slam .42s cubic-bezier(.16,1,.3,1)}
@keyframes slam{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.vbadge{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:11px;
  font-weight:800;font-size:12.5px;letter-spacing:.02em;margin-bottom:13px}
.vbadge.red{background:rgba(255,91,82,.15);color:#ff8880;box-shadow:inset 0 0 0 1px rgba(255,91,82,.4)}
.vbadge.amber{background:rgba(240,180,41,.13);color:#f3c65c;box-shadow:inset 0 0 0 1px rgba(240,180,41,.36)}
.vbadge.green{background:rgba(63,185,80,.13);color:#63d478;box-shadow:inset 0 0 0 1px rgba(63,185,80,.36)}
.vbadge.blue{background:rgba(108,182,255,.13);color:#8ac8ff;box-shadow:inset 0 0 0 1px rgba(108,182,255,.36)}
.vbadge.violet{background:rgba(163,113,247,.15);color:#c9a6ff;box-shadow:inset 0 0 0 1px rgba(163,113,247,.42)}
.vbadge .ic{font-size:17px;line-height:1}
.act{width:100%;margin-top:11px;padding:10px;background:rgba(47,129,247,.16);
  border:1px solid rgba(47,129,247,.4);color:#cfe3ff;border-radius:10px;
  font:700 11.5px/1 var(--sans);cursor:pointer;transition:background .16s}
.act:hover{background:rgba(47,129,247,.28)}
.act:disabled{opacity:.55;cursor:default}

/* ---------- ask ---------- */
.asker{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chip{padding:6px 9px;background:rgba(140,170,220,.07);border:1px solid var(--line);
  color:var(--dim);border-radius:999px;font:600 10.5px/1 var(--sans);cursor:pointer;
  transition:color .16s,border-color .16s}
.chip:hover{color:var(--text);border-color:var(--line-hot)}
.askrow{display:flex;gap:7px;align-items:stretch}
.askrow input{flex:1;min-width:0;padding:9px 11px;background:rgba(140,170,220,.06);
  border:1px solid var(--line);border-radius:10px;color:var(--text);
  font:400 12px/1.2 var(--sans);outline:none}
.askrow input:focus{border-color:var(--line-hot)}
.askrow .act{width:auto;margin:0;padding:9px 15px;white-space:nowrap}

#answer{display:none;margin-top:13px;padding:13px;border-radius:10px;
  background:rgba(140,170,220,.05);border:1px solid var(--line)}
.ahead{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;
  padding-bottom:9px;border-bottom:1px solid var(--line)}
.ahead .q{font-size:12px;font-weight:700;line-height:1.4}
.ahead .gen{font-size:10px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
/* A withheld model answer is reported, never hidden: the officer is entitled
   to know the machine said something the tool would not stand behind. */
.awarn{margin-bottom:10px;padding:8px 10px;border-radius:8px;font-size:10.5px;
  line-height:1.55;color:#f3d79a;background:rgba(240,180,41,.09);
  border-left:2px solid var(--amber)}
.atext{font-size:12px;line-height:1.7;color:#c9d7ea}
.atext .cite{font-family:var(--mono);font-size:9px;color:var(--water-now);
  padding:0 1px;vertical-align:super}
.arefuse{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:10.5px;
  line-height:1.55;color:#c9a6ff;background:rgba(163,113,247,.1);
  border-left:2px solid var(--violet)}
.asec{margin:14px 0 4px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);font-weight:700}
#answer .metric{padding:6px 0}
#answer .metric .v{font-size:12px}
#answer .metric i{font-style:normal;color:var(--faint);font-size:10px;font-weight:400}
.awhat{margin:0;padding-left:15px;font-size:11px;line-height:1.6;color:var(--dim)}
.awhat li{margin-bottom:4px}
.asrc{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.asrc .n{flex:0 0 15px;font-family:var(--mono);font-size:9px;color:var(--water-now);
  padding-top:2px}
.asrc b{display:block;font-size:11px;font-weight:600;line-height:1.4}
.asrc i{display:block;font-style:normal;font-size:10px;color:var(--faint);
  line-height:1.5;margin-top:1px}
.asrc em{display:block;font-style:normal;font-family:var(--mono);font-size:9px;
  color:rgba(125,142,168,.6);margin-top:2px}
.asrc a{display:inline-block;font-size:9.5px;color:var(--water-now);margin-top:2px}

/* ---------- timeline ---------- */
#timeline{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:18;
  transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .35s;
  width:min(680px,calc(100vw - 680px));min-width:420px;padding:14px 20px 16px}
.trow{display:flex;align-items:center;gap:16px}
#play{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid rgba(47,129,247,.45);
  background:rgba(47,129,247,.16);color:#cfe3ff;font-size:15px;cursor:pointer;
  display:grid;place-items:center;transition:transform .16s,background .16s}
#play:hover{background:rgba(47,129,247,.3);transform:scale(1.07)}
.tcore{flex:1;min-width:0}
.thead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
#year{font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
#caption{font-size:11.5px;color:var(--dim);text-align:right;max-width:330px}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;border-radius:2px;
  background:linear-gradient(90deg,var(--water-old),var(--red));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.16);cursor:grab}
.ticks{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);
  font-size:9.5px;color:var(--faint)}

/* ---------- legend ---------- */
#timeline.hid{transform:translateX(-50%) translateY(150%);opacity:0;pointer-events:none}
#ruleBar{display:none;align-items:center;gap:8px;background:rgba(9,13,22,.8);
  border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 4px}
#ruleBar.on{display:flex}
#ruleBar label{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
#ruleBar input{width:52px;background:var(--panel-solid);color:var(--text);
  border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:11px;
  font-family:var(--mono);outline:none}

#legend{position:absolute;left:16px;bottom:18px;z-index:15;padding:12px 14px;
  transition:transform .45s cubic-bezier(.16,1,.3,1)}
#legend.low{transform:translateY(0)}
#legend .key{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px;color:#b9c8dc}
.sw{width:11px;height:11px;border-radius:3px;flex:none}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:40;background:rgba(3,5,9,.8);
  backdrop-filter:blur(8px);display:none;place-items:center;padding:40px}
#modal.on{display:grid}
.sheet{width:min(720px,100%);max-height:80vh;overflow-y:auto;padding:26px 28px}
.sheet h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.sheet .lede{font-size:12.5px;color:var(--dim);margin-bottom:20px;line-height:1.6}
.case{padding:13px 0;border-top:1px solid var(--line)}
.case .t{font-size:12.5px;font-weight:700;margin-bottom:4px}
.case .d{font-size:11.5px;color:var(--dim);line-height:1.6}
.case .n{font-family:var(--mono);color:var(--amber);font-weight:700}
.sheet a{color:var(--water-now);text-decoration:none;font-size:10.5px}
.sheet a:hover{text-decoration:underline}
#modalClose{position:absolute;top:22px;right:26px;background:none;border:none;
  color:var(--dim);font-size:26px;cursor:pointer;line-height:1}

/* ---------- misc ---------- */
#toast{position:absolute;bottom:18px;right:16px;max-width:330px;z-index:30;
  padding:10px 34px 10px 14px;font-size:11px;line-height:1.5;color:var(--amber);
  display:none;border-color:rgba(240,180,41,.4);cursor:pointer}
#toast::after{content:'\00d7';position:absolute;top:8px;right:12px;font-size:15px;color:var(--faint)}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:14;
  padding:16px 22px;text-align:center;display:none;pointer-events:none}
#hint b{display:block;font-size:14px;margin-bottom:4px}
#hint span{font-size:11.5px;color:var(--dim)}
#map.aim .maplibregl-canvas{cursor:crosshair}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--red);
  box-shadow:0 0 0 0 rgba(255,91,82,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(255,91,82,0)}100%{box-shadow:0 0 0 0 rgba(255,91,82,0)}}
  /* ---- certificate ---- */
  .cert h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
    font-family:var(--mono);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .chead{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
  .cref{text-align:right;flex:none;font-family:var(--mono);font-size:10px;color:var(--dim)}
  .cref b{display:block;font-size:12px;color:var(--text);margin-bottom:3px}
  .cert-decision{margin:18px 0 10px;padding:14px 18px;border-radius:10px;font-weight:800;
    font-size:17px;letter-spacing:.03em;border:1px solid}
  .cert-decision.red{background:rgba(248,81,73,.14);color:#ff8880;border-color:rgba(248,81,73,.5)}
  .cert-decision.violet{background:rgba(163,113,247,.14);color:#c9a6ff;border-color:rgba(163,113,247,.5)}
  .cert-decision.amber{background:rgba(210,153,34,.13);color:#f3c65c;border-color:rgba(210,153,34,.5)}
  .cert-decision.green{background:rgba(63,185,80,.13);color:#63d478;border-color:rgba(63,185,80,.5)}
  .creason{margin:0 0 4px 18px;font-size:12px;line-height:1.7;color:#c3d2e6}
  .creason li{margin-bottom:5px}
  .crow{display:flex;justify-content:space-between;gap:20px;padding:5px 0;
    border-bottom:1px solid rgba(140,170,220,.07);font-size:11.5px}
  .crow span:first-child{color:var(--dim);flex:none;max-width:52%}
  .crow span:last-child{text-align:right;font-family:var(--mono);font-size:11px}
  .cfields{display:flex;gap:12px}
  .cfields label{flex:1;font-size:10px;color:var(--faint);display:flex;flex-direction:column;gap:4px}
  .cin{background:transparent;border:none;border-bottom:1px solid var(--line-hot);
    color:var(--text);font-size:12px;padding:4px 2px;outline:none;font-family:var(--sans)}
  .csnap{width:100%;border-radius:8px;border:1px solid var(--line);margin-top:4px}
  .ccanon{font-family:var(--mono);font-size:9.5px;color:var(--dim);word-break:break-all;
    background:rgba(140,170,220,.07);padding:9px 11px;border-radius:7px;line-height:1.6}
  .cnote{font-size:11px;color:var(--dim);line-height:1.6;margin-top:8px}
  .cbox{height:66px;border:1px solid var(--line-hot);border-radius:7px;margin-top:4px}
  .ccheck{font-size:11.5px;color:var(--dim);margin-top:9px}
  .csign{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin-top:16px;
    font-size:10px;color:var(--faint)}
  .csign hr{border:none;border-top:1px solid var(--line-hot);margin-top:22px}
  .cfoot{font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:20px;
    border-top:1px solid var(--line);padding-top:12px}

  /* Print the modal rather than generating a PDF: no library to load, no popup
     for a blocker to eat, nothing that needs the network, and the document
     stays on the projector while it prints. */
  @media print{
    html,body{background:#fff;color:#000;overflow:visible;height:auto}
    #map,#top,#left,#right,#legend,#timeline,#toast,#hint,#boot,#modalClose,.noprint{display:none!important}
    #modal{position:static;display:block!important;background:none;backdrop-filter:none;padding:0}
    .sheet{width:100%;max-height:none;overflow:visible;border:none;box-shadow:none;
      background:#fff;backdrop-filter:none;padding:0}
    .cert *,.sheet *{color:#000!important}
    .cert h3{color:#555!important;border-color:#bbb!important}
    .crow{border-color:#ddd!important}
    .cert-decision{border:2px solid #000!important;background:#fff!important}
    .ccanon{background:#f4f4f4!important}
    .cbox,.csign hr,.cin{border-color:#888!important}
    .cfoot,.cnote{color:#444!important}
  }
#boot{position:absolute;inset:0;z-index:60;background:var(--ink);display:grid;place-items:center;
  transition:opacity .7s;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.2em}
#boot.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>

<div id="map"></div>

<header id="top">
  <div class="brand"><b>VANISHED BLUE GRID</b><i>FORENSIC</i></div>
  <select id="city"></select>
  <div class="tabs" id="modes">
    <button data-mode="timeline" class="on">Timeline</button>
    <button data-mode="approval">Plot check</button>
    <button data-mode="impact">Downstream</button>
  </div>
  <div id="ruleBar">
    <select id="ruleSel" title="Which buffer regime to apply"></select>
    <label>Plot <input id="plotM" type="number" min="5" max="300" step="5" value="30"> m</label>
  </div>
  <button class="ghost" id="validateBtn">Validation</button>
  <button class="ghost" id="csvBtn">Export CSV</button>
</header>

<aside id="left">
  <div class="glass card" style="display:flex;flex-direction:column;min-height:0">
    <h3 id="leftTitle">Priority sites</h3>
    <div class="scroll" id="list" style="margin:-4px -6px"></div>
  </div>
</aside>

<aside id="right">
  <div class="glass card" id="statsCard">
    <h3 id="statsTitle">Catchment ledger</h3>
    <div id="stats"></div>
    <div class="bar"><i id="lossBar" style="width:0"></i></div>
  </div>
  <div class="glass card" id="verdict"></div>
</aside>

<div class="glass" id="legend"></div>
<div class="glass" id="toast"></div>
<div class="glass" id="hint"></div>

<footer class="glass" id="timeline">
  <div class="trow">
    <button id="play">&#9654;</button>
    <div class="tcore">
      <div class="thead">
        <div id="year">2003&ndash;07</div>
        <div id="caption">The blue grid as the satellite record found it.</div>
      </div>
      <input type="range" id="slider" min="0" max="100" value="0">
      <div class="ticks"><span>2003&ndash;07 &middot; Landsat 5</span><span>crossfade</span><span>Sentinel-2 &middot; 2023&ndash;25</span></div>
    </div>
  </div>
</footer>

<div id="modal"><div class="glass sheet" id="sheet"></div><button id="modalClose">&times;</button></div>
<div id="boot">READING THE SATELLITE RECORD</div>

<script>
'use strict';

// ===========================================================================
// CONFIG
// ===========================================================================
// bounds are [west, south, east, north] and MUST match the AOI rectangle used
// by gee_blue_grid.js for that city, or every overlay is pinned to the wrong
// ground and the tool quietly lies.
var CITIES = {
  bengaluru: {
    label: 'Bengaluru', sub: 'Bellandur & Varthur catchment',
    bounds: [77.63, 12.90, 77.75, 12.97],

// Raster layers, painted bottom to top.
var LAYERS = ['rgb2005','rgb2025','floodprone','flowpath','historic','present','encroached'];

// Lookup tables, never drawn. These carry measurements rather than colour:
// buffers packs three distances in metres into R/G/B, history packs the last
// year water was recorded, and hydro packs upstream catchment. Drawing them
// would be meaningless; sampling them is the whole point.
//
// Membership of this list is what gets a layer decoded at 1:1 with smoothing
// off. A measurement layer left out of it is quietly area-averaged into byte
// codes that were never computed.
var DATA_LAYERS = ['buffers','history','hydro'];
// Exactly the palette gee_blue_grid.js renders the PNGs with. Changing a
// colour here without changing it there makes the legend lie.
var PALETTE = {
  historic:'#1f6feb', present:'#58a6ff', encroached:'#f85149',
  flowpath:'#d29922', floodprone:'#bc8cff'
};

var BLANK = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

// Buffer distances are OPERATOR CONFIGURATION, not a legal determination by
// this tool. Karnataka has more than one figure in play and an officer knows
// which binds them, so the tool applies the rule it is told to and records
// which one on the certificate.
var RULESETS = {
  state: {id:'state', label:'State revision \u2014 30 m lake buffer',
          lakeM:30, drainM:25,
          cite:'State revision of the NGT buffer, as applied by BBMP.'},
  ngt:   {id:'ngt', label:'NGT / Supreme Court \u2014 75 m lake buffer',
          lakeM:75, drainM:50,
          cite:'NGT O.A. 222/2014 (Forward Foundation v. State of Karnataka), '
             + 'upheld by the Supreme Court and applied prospectively.'}
};

// Numbers the tool computes with, and their single authoritative home.
//
// Each of these is DECLARED IN THE CORPUS, on the chunk that cites its source,
// and the value below is a bootstrap copy so the plot check still runs before
// corpus.json has loaded. check_corpus.py scrapes this block and fails if the
// two ever disagree, which is the same cross-file consistency test
// verify_encoding.py runs between two rasters.
//
// Everything here is a placeholder until the sourcing marked verify: true in
// the corpus has been done. The runoff figures in particular are stated
// defaults, not measurements of this city.
// @params
var PARAMS = {
  P_mm:          60,     // design storm depth, mm in one hour
  P_pm:          24,     // and its uncertainty, dominated by the return period
  P_annualMm:    970,    // annual rainfall, for the yearly figure
  C_pre:         0.30,   // runoff coefficient, open ground
  C_post:        0.85,   // runoff coefficient, roof and paving
  dC:            0.55,   // the change, which is what displacement turns on
  dC_pm:         0.15,
  tankerL:       6000,   // a volume nobody can picture, made picturable
  handDeepM:     1,      // inside a water path: retention and plinth
  handLowM:      2,      // flood-prone, as the layer defines it
  handMarginalM: 5,
  upaCeilKm2:    1000,   // the log-packing ceiling in hydro.png's red channel
  trunkUpaKm2:   10
};
// @end-params

// hydro.png is the one layer not read as a straight byte. Decoding the log
// packing here, once, next to the encoder it mirrors in gee_blue_grid.js.
var UPA_DEN = Math.log(1 + PARAMS.upaCeilKm2) / Math.LN10;
function decodeUpa(code){
  return code === null ? null : Math.pow(10, (code/255) * UPA_DEN) - 1;
}

// The error budget, stated once and used everywhere a distance is judged.
//   JRC 30 m pixel, shoreline position   +/- 15 m
//   distance-transform quantum at 10 m   +/-  7 m
//   PNG georeferencing, one pixel        +/-  6 m
//   thumbnail resample and byte decode         0  (nearest, exact)
// In quadrature, about 20 m. It is dominated by the source resolution, not by
// anything this tool does, which is why finer encoding would buy nothing.
var UNCERTAINTY_M = 20;

var state = {
  city: 'bengaluru', mode: 'timeline', t: 0, playing: false,
  rule: 'state', plotM: 30, lastCheck: null,
  stats: null, buildings: null, samplers: {}, have: {}, marker: null, selected: null, ready: false,
  // The retrieval layer. corpus is city-agnostic and fetched once; centroids
  // is rebuilt per city; lastAnswer is kept so a ruleset change can invalidate
  // an answer that was reasoned under the rule the officer has just left.
  corpus: null, centroids: null, lastAnswer: null, asking: false
};

    version: 8,
    sources: {
      // Esri World Imagery sits underneath as a safety net: if a true-colour

      sat: { type:'raster', tileSize:256,
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        attribution:'Esri, Maxar · JRC Global Surface Water · MERIT Hydro · Google Open Buildings' }
    },
    layers: [{id:'sat', type:'raster', source:'sat'}]
  },
  bounds: [[C.bounds[0],C.bounds[1]],[C.bounds[2],C.bounds[3]]],
  fitBoundsOptions: {padding: pad()},

  preserveDrawingBuffer: true,
  attributionControl: {compact:true}
});

function corners(b){ return [[b[0],b[3]],[b[2],b[3]],[b[2],b[1]],[b[0],b[1]]]; }

// Mean of the outer ring. Crude, and correct enough for a footprint this size
// against a 6.36 m pixel. Third caller, so it stops being written out inline.
function centroidOf(f){
  var g = f.geometry;
  var pts = g.type === 'Polygon' ? g.coordinates[0] : g.coordinates[0][0];
  var lon = 0, lat = 0;
  pts.forEach(function(p){ lon += p[0]; lat += p[1]; });
  return [lon/pts.length, lat/pts.length];
}

// Equirectangular, which at a few hundred metres and this latitude is exact
// to well inside the error budget and far cheaper than a haversine.
function metresBetween(lon1, lat1, lon2, lat2){
  var dx = (lon2-lon1) * 111320 * Math.cos(lat1*Math.PI/180);
  var dy = (lat2-lat1) * 110574;
  return Math.sqrt(dx*dx + dy*dy);
}

// The side rails are fixed width, so reserving room for them as a constant
// squeezes the map to a sliver on a narrow window. Scale the reservation with
// the viewport instead. Declared, not assigned, so hoisting covers the call in
// the map constructor above.
// A ring round the world with the study area punched out of it. Everything
// analysed is clipped to the AOI, so without this the imagery just stops at a
// hard rectangle and reads as a rendering fault. Dimming the outside instead
// makes the boundary look like what it is: the edge of the evidence.
function maskGeo(b){
  return {type:'Feature', geometry:{type:'Polygon', coordinates:[
    [[-179.9,-85],[179.9,-85],[179.9,85],[-179.9,85],[-179.9,-85]],
    [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]],[b[0],b[1]]]
  ]}};
}
function aoiGeo(b){
  return {type:'Feature', geometry:{type:'LineString', coordinates:
    [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]],[b[0],b[1]]]}};
}

function pad(){
  var w = window.innerWidth;
  var side = w > 1280 ? 340 : w > 1000 ? 210 : 40;
  return {top:80, bottom: w > 1000 ? 140 : 110, left:side, right:side};
}

// ===========================================================================
// DATA LOADING
// ===========================================================================
function exists(url){
  return fetch(url,{method:'HEAD'}).then(function(r){return r.ok;}).catch(function(){return false;});
}

// Reads a PNG into an offscreen canvas so any point can be tested against it
// without a server. This is what makes the plot check instant and offline:
// the same rasters that are drawn on the map are also the lookup table.
//
// Sampling happens at a quarter of the export resolution. The underlying data
// is 30m and the probe covers a whole plot, so full resolution buys nothing
// and costs four times the decode and memory. Downscaling keeps smoothing on
// deliberately: it area-averages, so a thin feature survives as partial alpha
// rather than being dropped by nearest-neighbour.
var SAMPLE_MAX_W = 1024;
var PROBE_METRES = 35;

function makeSampler(url, b, exact){
  return new Promise(function(res){
    var img = new Image();
    img.onload = function(){
      // Masks tolerate downscaling: area-averaging a binary edge is a feature.
      // Measurement layers are decoded 1:1 with smoothing off. Averaging two
      // byte codes invents a distance or a year that never existed, and even
      // nearest-neighbour dropping of every other pixel can miss the true
      // minimum of a distance field, which is the number a buffer turns on.
      var sc = exact ? 1 : Math.min(1, SAMPLE_MAX_W / img.naturalWidth);
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth*sc));
      c.height = Math.max(1, Math.round(img.naturalHeight*sc));
      var ctx = c.getContext('2d',{willReadFrequently:true});
      if(exact) ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try {
        var midLat = (b[1]+b[3])/2;
        var metresWide = (b[2]-b[0]) * 111320 * Math.cos(midLat*Math.PI/180);
        res({w:c.width, h:c.height, mpp: metresWide/c.width,
             d:ctx.getImageData(0,0,c.width,c.height).data});
      } catch(err){ res(null); }
    };
    img.onerror = function(){ res(null); };
    img.src = url;
  });
}

// Reduces a named channel over the same disc. For a distance field the
// closest approach of the feature to the plot is what a buffer rule turns on,
// so 'min' is the correct reduction; for the year layer 'max' gives the most
// recent year any part of the plot held water.
function sampleCh(s, lon, lat, b, ch, mode, radiusM, minAlpha){
  if(!s) return null;
  // Alpha is only a validity flag on a layer whose bands all share one
  // projection. Where a layer mixes scales - history carries JRC at 30 m
  // beside MERIT at 90 m - Earth Engine resamples the combined mask and
  // writes the FRACTION into alpha, so real data arrives at alpha 17 or 166.
  // Demanding exactly 255 there discards precisely the pixels that have
  // values, silently, and every reading comes back null. Zero still means
  // outside the clip, so one is the honest floor for those layers.
  var aMin = minAlpha === undefined ? 255 : minAlpha;
  var x = Math.round((lon-b[0])/(b[2]-b[0]) * s.w);
  var y = Math.round((b[3]-lat)/(b[3]-b[1]) * s.h);
  var R = Math.max(0, Math.round((radiusM || PROBE_METRES) / s.mpp));
  var lo = mode === 'min', best = null;
  for(var dy=-R; dy<=R; dy++) for(var dx=-R; dx<=R; dx++){
    if(dx*dx+dy*dy > R*R) continue;
    var px = x+dx, py = y+dy;
    if(px<0||py<0||px>=s.w||py>=s.h) continue;
    var i = (py*s.w+px)*4;
    if(s.d[i+3] < aMin) continue;      // outside the study area: no evidence
    var v = s.d[i+ch];
    if(best === null) best = v;
    else if(lo ? v < best : v > best) best = v;
  }
  return best;
}

// A plot is far larger than one pixel, so the check probes a disc about a
// plot wide rather than a single point.
function sample(s, lon, lat, b){
  if(!s) return 0;
  var x = Math.round((lon-b[0])/(b[2]-b[0]) * s.w);
  var y = Math.round((b[3]-lat)/(b[3]-b[1]) * s.h);
  var R = Math.max(1, Math.round(PROBE_METRES / s.mpp)), best = 0;
  for(var dy=-R; dy<=R; dy++) for(var dx=-R; dx<=R; dx++){
    if(dx*dx+dy*dy > R*R) continue;
    var px = x+dx, py = y+dy;
    if(px<0||py<0||px>=s.w||py>=s.h) continue;
    var a = s.d[(py*s.w+px)*4+3];
    if(a>best) best = a;
  }
  return best/255;
}

function loadCity(key){
  state.city = key;
  var c = CITIES[key];
  state.samplers = {}; state.have = {}; state.selected = null; state.ready = false;
  document.getElementById('verdict').style.display='none';
  if(state.marker){ state.marker.remove(); state.marker=null; }

  // Painting the map must not wait on the plot-check lookup tables. Decoding
  // five full-size PNGs into canvases takes seconds, and a demo cannot open on
  // a black screen. The map goes up first; the samplers hydrate behind it and
  // are ready long before anyone reaches the plot-check tab.
  // The distance fields subsume four of the old mask samplers - a distance of
  // zero IS the mask - so only 'encroached' still needs one. Fewer canvases,
  // less memory, shorter hydrate chain.
  var SAMPLED = ['encroached'];

  if(map.getSource('mask')) map.getSource('mask').setData(maskGeo(c.bounds));
  if(map.getSource('aoi')) map.getSource('aoi').setData(aoiGeo(c.bounds));

  var jobs = LAYERS.map(function(id){
    var url = 'data/'+key+'/'+id+'.png';
    return exists(url).then(function(ok){
      state.have[id] = ok;
      map.getSource(id).updateImage({url: ok?url:BLANK, coordinates:corners(c.bounds)});
    });
  });

  // Measurement layers are probed but never attached to the map.
  jobs = jobs.concat(DATA_LAYERS.map(function(id){
    return exists('data/'+key+'/'+id+'.png').then(function(ok){ state.have[id] = ok; });
  }));

  // Sequential, so the large decodes never contend for the main thread at once.
  Promise.all(jobs).then(function(){
    return SAMPLED.concat(DATA_LAYERS).reduce(function(chain, id){
      return chain.then(function(){
        if(!state.have[id]) return;
        var exact = DATA_LAYERS.indexOf(id) !== -1;
        return makeSampler('data/'+key+'/'+id+'.png', c.bounds, exact)
          .then(function(sm){ state.samplers[id] = sm; });
      });
    }, Promise.resolve());
  }).then(function(){ state.ready = true; });

  jobs.push(
    fetch('data/'+key+'/stats.json').then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;}).then(function(j){ state.stats = j; })
  );
  jobs.push(
    fetch('data/'+key+'/flagged_buildings.geojson').then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;}).then(function(g){
        state.buildings = g;
        // Precomputed once here rather than per click. A linear scan over a
        // few thousand of these is under a frame; recomputing the centroids
        // inside the scan would not be.
        state.centroids = g ? g.features.map(function(f){
          var c = centroidOf(f);
          return {lon:c[0], lat:c[1], p:f.properties};
        }) : null;
        map.getSource('buildings').setData(g || {type:'FeatureCollection',features:[]});
      })
  );

  // City-agnostic and fetched once. Its absence is survivable: the plot check
  // and the templated answer both still work, they simply lose their citations.
  if(!state.corpus){
    jobs.push(
      fetch('data/corpus.json').then(function(r){return r.ok?r.json():null;})
        .catch(function(){return null;}).then(function(j){
          state.corpus = j;
          if(j) reconcileParams(j);
        })
    );
  }

  return Promise.all(jobs).then(function(){
    map.fitBounds([[c.bounds[0],c.bounds[1]],[c.bounds[2],c.bounds[3]]],
      {padding: pad(), duration:900});
    renderStats(); renderList(); renderLegend(); applyMode(); update();
    var missing = LAYERS.concat(DATA_LAYERS).filter(function(l){return !state.have[l];});
    if(missing.length) toast('Missing layers: '+missing.join(', ')+' — run gee_blue_grid.js for '+c.label+', then ./fetch_layers.sh '+key);
    else if(!state.buildings) toast('No flagged_buildings.geojson yet — run the Earth Engine export task.');
    else hideToast();
  });
}

// ===========================================================================
// TIMELINE
// ===========================================================================
function ramp(t,a,b){ return Math.max(0, Math.min(1, (t-a)/(b-a))); }

function update(){
  var t = state.t;
  // Three different time framings used to coexist here: a slider counting
  // 2005 to 2025, imagery that is a 2003-07 median against a 2023-25 median,
  // and water layers from JRC's 1984-99 and 2000-21 epochs. The readout now
  // names the composite actually on screen instead of inventing a year that
  // nothing in the data corresponds to.
  document.getElementById('year').textContent = t < .5 ? '2003–07' : '2023–25';
  document.getElementById('caption').textContent =
    t<.12 ? 'Surface water recorded 1984–99, over 2003–07 imagery.' :
    t<.45 ? 'Water retreats. The edges go first.' :
    t<.78 ? 'Construction reaches the lakebed.' :
            'Water still present 2000–21, over 2023–25 imagery. Red is what was built on the difference.';

  if(!map.getLayer('rgb2005')) return;
  var m = state.mode, bo;

  // Each mode answers a different question, so each gets its own layer mix.
  // Reusing the timeline's t outside the timeline would leave a plot check
  // being made against 2005 imagery, which is exactly the wrong ground.
  if(m === 'timeline'){
    // rgb2005 holds steady underneath while rgb2025 fades in on top, so the
    // crossfade never exposes the modern basemap mid-drag.
    set('rgb2005', state.have.rgb2005 ? 1 : 0);
    set('rgb2025', state.have.rgb2025 ? ramp(t,.05,.95) : 0);
    // The old shoreline never vanishes completely. It settles to a ghost so
    // the viewer keeps seeing where the water used to reach.
    set('historic',   .88 - .62*t);
    set('present',    .88*ramp(t,.10,.70));
    set('encroached', .95*ramp(t,.50,1));
    set('floodprone', 0);
    set('flowpath',   0);
    bo = .72*ramp(t,.70,1);
  } else if(m === 'approval'){
    // Every constraint visible at once on today's ground: this is the view an
    // approving officer needs, not a story about the past.
    set('rgb2005', 0);
    set('rgb2025', state.have.rgb2025 ? 1 : 0);
    set('historic', .46); set('present', .62); set('encroached', .95);
    set('floodprone', .28); set('flowpath', .55);
    bo = .38;
  } else {
    set('rgb2005', 0);
    set('rgb2025', state.have.rgb2025 ? 1 : 0);
    set('historic', .22); set('present', .55); set('encroached', .95);
    set('floodprone', .48); set('flowpath', .80);
    bo = .55;
  }
  if(map.getLayer('b-fill')){
    map.setPaintProperty('b-fill','fill-opacity',bo);
    map.setPaintProperty('b-line','line-opacity',bo*1.2);
  }
  function set(id,v){ if(map.getLayer(id)) map.setPaintProperty(id,'raster-opacity',v); }
}

var slider = document.getElementById('slider');
slider.addEventListener('input', function(){ stop(); state.t = slider.value/100; update(); });

var raf = null;
function stop(){ state.playing=false; if(raf) cancelAnimationFrame(raf); raf=null;
  document.getElementById('play').innerHTML='&#9654;'; }
document.getElementById('play').onclick = function(){
  if(state.playing){ stop(); return; }
  if(state.mode!=='timeline') setMode('timeline');
  state.playing = true; this.innerHTML='&#10073;&#10073;';
  if(state.t >= .999) state.t = 0;
  var t0 = performance.now(), from = state.t, dur = 9000*(1-from);
  (function step(now){
    if(!state.playing) return;
    var p = Math.min(1, (now-t0)/dur);
    state.t = from + (1-from)*p;
    slider.value = state.t*100; update();
    if(p<1) raf = requestAnimationFrame(step); else stop();
  })(t0);
};

function setMode(m){
  state.mode = m;
  document.querySelectorAll('#modes button').forEach(function(b){
    b.classList.toggle('on', b.dataset.mode===m);
  });
  applyMode();
}
function applyMode(){
  var m = state.mode;
  document.getElementById('map').classList.toggle('aim', m==='approval');
  document.getElementById('ruleBar').classList.toggle('on', m==='approval');
  document.getElementById('timeline').classList.toggle('hid', m!=='timeline');

  var hint = document.getElementById('hint');
  if(m==='approval'){
    hint.innerHTML = '<b>Click any plot on the map</b><span>The same rasters drawn here are read back pixel by pixel — no server, no lookup.</span>';
    hint.style.display='block'; setTimeout(function(){hint.style.display='none';}, 4200);
  } else hint.style.display='none';

  if(m!=='timeline'){ stop(); state.t = 1; slider.value = 100; }
  renderStats(); renderLegend(); update();
}
document.querySelectorAll('#modes button').forEach(function(b){

// ===========================================================================
// PLOT CHECK  — the approval-stage product, running entirely client side
// ===========================================================================
// Every value here is a straight byte read. There is no scaling arithmetic,
// which is the entire reason the exported ranges were chosen to fit a byte.
function readSite(lngLat){
  var b = CITIES[state.city].bounds, S = state.samplers;
  var r = Math.max(6, state.plotM / 2);          // half the plot frontage
  function buf(ch, mode){ return sampleCh(S.buffers, lngLat.lng, lngLat.lat, b, ch, mode, r); }
  function his(ch, mode){ return sampleCh(S.history, lngLat.lng, lngLat.lat, b, ch, mode, r, 1); }
  var yc = his(0, 'max');
  return {
    // Distances take the MINIMUM over the plot: a buffer is breached if ANY
    // part of the plot falls inside it, so the nearest approach governs.
    // Taking the maximum here would pass every corner plot.
    distPresent:   buf(0, 'min'),
    distHistoric:  buf(1, 'min'),
    distDrain:     buf(2, 'min'),
    lastWaterYear: yc ? 1983 + yc : null,
    occurrence:    his(1, 'max'),
    handM:         his(2, 'min'),
    encroached:    sample(S.encroached, lngLat.lng, lngLat.lat, b)
  };
}

// ---------------------------------------------------------------------------
// SITE CONTEXT — readSite, plus what can be derived from it
// ---------------------------------------------------------------------------
// Layered strictly on top. readSite and decide are the authority and are not
// touched here beyond reading their output: the derived quantities below are
// all reversible arithmetic on values those two already produced.
//
// decide() computes the shoreline retreat inline for its own message. That
// subtraction is repeated here rather than factored out of it. Duplicating one
// subtraction is cheaper than reaching into the branch that produces the
// finding this whole tool exists to make.
//
// The field list below is the manifest check_corpus.py scrapes: every corpus
// trigger must name a field that appears in it, so renaming one here breaks
// the corpus check instead of silently disabling its triggers.
// @site-fields
//   city inAoi lat lon plotM plotAreaM2
//   ruleId lakeM drainM
//   distPresent distHistoric distDrain lastWaterYear occurrence handM encroached
//   retreatM flowClass handClass
//   upaKm2 distTrunk elevAboveMinM
//   runoffDisplacedM3 runoffLoM3 runoffHiM3 runoffAnnualM3 tankerEquiv
//   verdict codes hasBuildings nNeighbours nearestFlaggedM
//   intent
// @end-site-fields

// Two significant figures. The uncertainty on every derived volume here is
// tens of per cent, and a third digit would claim precision the inputs cannot
// support while looking exactly like one that could.
function sig2(x){
  if(x === null || !isFinite(x)) return null;
  if(x === 0) return 0;
  var mag = Math.pow(10, Math.floor(Math.log(Math.abs(x))/Math.LN10) - 1);
  return Math.round(x/mag) * mag;
}

function classifyFlow(distDrain, drainM){
  if(distDrain === null) return null;
  if(distDrain >= 255) return 'UNRESOLVED';
  if(distDrain === 0) return 'ON_FLOW_PATH';
  if(distDrain <= 10) return 'ADJACENT';            // one distance-transform step
  if(distDrain <= drainM + UNCERTAINTY_M) return 'NEAR';
  return 'OFF';
}

function classifyHand(handM){
  if(handM === null) return null;
  if(handM >= 255) return 'UNKNOWN';                // the byte ceiling, not a height
  if(handM === 0) return 'AT_DRAINAGE_LEVEL';
  if(handM <= PARAMS.handDeepM) return 'DEEP_IN_A_WATER_PATH';
  if(handM <= PARAMS.handLowM) return 'LOW_GROUND';
  if(handM <= PARAMS.handMarginalM) return 'MARGINAL';
  return 'ELEVATED';
}

// The three nearest flagged structures, as context and never as a property of
// the plot. Tagged so the prompt can forbid attributing them to it.
function neighboursOf(lngLat){
  if(!state.centroids) return [];
  var out = [];
  for(var i=0;i<state.centroids.length;i++){
    var c = state.centroids[i];
    var d = metresBetween(lngLat.lng, lngLat.lat, c.lon, c.lat);
    if(d <= 300) out.push({m:Math.round(d), p:c.p});
  }
  out.sort(function(a,b){ return a.m - b.m; });
  return out.slice(0,3);
}

function siteContext(lngLat, rule, building){
  var m = readSite(lngLat);
  var out = decide(m, rule);
  var inAoi = !(m.distPresent === null || m.distHistoric === null);
  var S = state.samplers, b = CITIES[state.city].bounds;
  var r = Math.max(6, state.plotM / 2);

  // hydro.png is optional: it postdates the other exports and a city may not
  // have been re-run yet. Absent, the upstream facts are simply not produced
  // and the answer says the layer is missing rather than guessing at it.
  // Channel order follows the export in gee_blue_grid.js section 13:
  //   r = log-packed upstream area, g = metres to a trunk channel,
  //   b = metres above the study-area low point.
  // g and b were transposed here, so "distance to the main drain" was reading
  // local relief - a number that is never far from zero, and therefore looked
  // like a plot always sitting on a trunk channel.
  var hyd = function(ch, mode){
    return S.hydro ? sampleCh(S.hydro, lngLat.lng, lngLat.lat, b, ch, mode, r, 1) : null;
  };
  var upaCode = hyd(0, 'max');
  var upaKm2 = upaCode === null ? null : sig2(decodeUpa(upaCode));
  var distTrunk = hyd(1, 'min');
  var elevAbove = hyd(2, 'min');

  var area = state.plotM * state.plotM;

  // Volume displaced per design storm: plot area, times storm depth in metres,
  // times the change in runoff coefficient. Three stated numbers and two
  // multiplications, so a reader can check it on paper — which is the reason
  // for using the volumetric form rather than a peak-flow estimate needing a
  // time of concentration this tool cannot defend for a single plot.
  //
  // Not computed outside the study area. A volume derived entirely from
  // assumptions looks identical to a measurement and is not one.
  var vol = null, volLo = null, volHi = null, volYear = null, tankers = null;
  if(inAoi){
    vol = area * (PARAMS.P_mm/1000) * PARAMS.dC;
    var rel = Math.sqrt(Math.pow(PARAMS.P_pm/PARAMS.P_mm, 2) +
                        Math.pow(PARAMS.dC_pm/PARAMS.dC, 2));
    volLo = sig2(vol * (1-rel)); volHi = sig2(vol * (1+rel));
    volYear = sig2(area * (PARAMS.P_annualMm/1000) * PARAMS.dC);
    tankers = Math.max(1, Math.round(vol / (PARAMS.tankerL/1000)));
    vol = sig2(vol);
  }

  var nb = neighboursOf(lngLat);

  return {
    m: m,
    verdict: out,
    neighbours: nb,
    // Set when the context is about one flagged footprint rather than a
    // clicked plot. Its per-footprint measurements were computed inside Earth
    // Engine against the polygon itself, so they are better evidence than the
    // disc reduction and are carried separately rather than blended into it.
    building: building || null,
    rec: {
      city: state.city, inAoi: inAoi,
      lat: lngLat.lat, lon: lngLat.lng,
      plotM: state.plotM, plotAreaM2: area,
      ruleId: rule.id, lakeM: rule.lakeM, drainM: rule.drainM,
      distPresent: m.distPresent, distHistoric: m.distHistoric,
      distDrain: m.distDrain, lastWaterYear: m.lastWaterYear,
      occurrence: m.occurrence, handM: m.handM, encroached: m.encroached,
      // Only meaningful outside the earlier shoreline. On the old bed itself
      // distHistoric is zero and the subtraction returns the distance to
      // today's water, which is not a retreat and would pull the
      // shoreline-disagreement chunk into an answer decide() never made that
      // finding for. decide() is already structured this way: it returns
      // before reaching its own retreat test whenever distHistoric is zero.
      retreatM: (m.distPresent !== null && m.distHistoric)
                  ? Math.max(0, m.distPresent - m.distHistoric) : null,
      flowClass: classifyFlow(m.distDrain, rule.drainM),
      handClass: classifyHand(m.handM),
      upaKm2: upaKm2, distTrunk: distTrunk, elevAboveMinM: elevAbove,
      runoffDisplacedM3: vol, runoffLoM3: volLo, runoffHiM3: volHi,
      runoffAnnualM3: volYear, tankerEquiv: tankers,
      verdict: out.d, codes: out.codes || [],
      hasBuildings: !!state.centroids,
      nNeighbours: nb.length,
      nearestFlaggedM: nb.length ? nb[0].m : null,
      intent: null                       // filled in per question by retrieve()
    }
  };
}

// The corpus is the authoritative home for every number the tool computes
// with; PARAMS is a bootstrap copy so the plot check runs before corpus.json
// lands. If the two disagree the corpus wins, because it is the copy carrying
// the citation — and it says so out loud, because a silent correction would
// mean the screening before the fetch used a different rule from the one after.
function reconcileParams(corpus){
  var drift = [];
  Object.keys(PARAMS).forEach(function(k){
    var e = corpus.params[k];
    if(!e) return;
    if(e.v !== PARAMS[k]){ drift.push(k+' '+PARAMS[k]+' \u2192 '+e.v); PARAMS[k] = e.v; }
  });
  var u = corpus.params.uncertaintyM;
  if(u && u.v !== UNCERTAINTY_M) drift.push('uncertaintyM differs: corpus says '+u.v);
  if(drift.length){
    console.warn('corpus overrode bootstrap parameters: '+drift.join(', '));
    toast('Parameters differ from the corpus — run ./check_corpus.py: '+drift.join(', '));
  }
}

// Four outcomes, and deliberately none of them is APPROVE. This tool screens;
// it does not grant permission, and saying so is both honest and the answer to
// "would you approve a build on a tank too small for you to see?"
function decide(m, rule){
  if(m.distPresent === null || m.distHistoric === null)
    return {d:'REFER', codes:['refer.outside-study-area'],
      why:['This plot lies outside the mapped study area. No satellite evidence exists for it.']};

  // Occurrence comes from a different layer than the distance fields, and a
  // pixel can carry one and not the other. Printed raw that reads as
  // "null% of observations", which is worse than saying nothing.
  var occ = m.occurrence === null ? null : m.occurrence + '%';

  if(m.distPresent === 0)
    return {d:'REJECT', codes:['reject.inside-live-water'],
      why:['The plot footprint falls inside an existing surface water body'
      + (occ ? ', recorded as water in ' + occ + ' of observations since 1984.' : '.')]};

  if(m.distHistoric === 0){
    var when = m.lastWaterYear ? 'last recorded as water in ' + m.lastWaterYear
                               : 'recorded as water before 2000';
    if(m.occurrence >= 50){
      var w = ['The plot sits on a former water body, ' + when + ', water in '
        + occ + ' of observations.'];
      if(m.encroached > .1) w.push('Construction is already present on this footprint.');
      return {d:'REJECT', codes:['reject.former-water-high-occurrence'], why:w};
    }
    return {d:'REFER', codes:['refer.intermittent-water'],
      why:[occ
        ? 'The plot sits on land recorded as water only ' + occ + ' of the time, '
          + when + '. At 30 m resolution intermittent water cannot be '
          + 'distinguished from a wet season.'
        : 'The plot sits on land recorded as water, ' + when + '. How often it '
          + 'held water is not recorded at this pixel, so the record cannot '
          + 'distinguish a tank from a field that floods in a wet year.']};
  }

  var R = [];
  function near(v, thr){ return Math.abs(v - thr) <= UNCERTAINTY_M; }

  if(m.distPresent < rule.lakeM - UNCERTAINTY_M)
    R.push({d:'REJECT', code:'reject.inside-buffer',
      t:'The plot lies ' + m.distPresent + ' m from the present water edge, '
      + 'inside the ' + rule.lakeM + ' m buffer.'});
  else if(near(m.distPresent, rule.lakeM))
    R.push({d:'REFER', code:'refer.buffer-within-uncertainty',
      t:'The plot lies ' + m.distPresent + ' m from the present water edge. '
      + 'At ±' + UNCERTAINTY_M + ' m that cannot be resolved against the ' + rule.lakeM
      + ' m buffer. Ground survey required.'});

  // The finding this whole tool exists to make. An applicant measures their
  // buffer from the shoreline as it stands today. Where the lake has since
  // shrunk, that boundary is one encroachment itself produced, and the two
  // measurements disagree.
  if(m.distPresent - m.distHistoric > 30 && m.distHistoric < rule.lakeM)
    R.push({d:'REFER', code:'refer.shoreline-disagreement',
      t:'Measured from today’s water edge the plot is ' + m.distPresent
      + ' m away and clears the ' + rule.lakeM + ' m buffer. Measured from the 1984–99 '
      + 'edge it is ' + m.distHistoric + ' m away, inside it. The shoreline has retreated '
      + (m.distPresent - m.distHistoric) + ' m here, so the buffer measured today is drawn '
      + 'from a boundary that encroachment created. Verify against the notified lake boundary.'});

  // Never a rejection. MERIT Hydro is 90 m and cannot site an individual
  // rajakaluve, so the honest output is a referral naming that limit.
  if(m.distDrain < rule.drainM + UNCERTAINTY_M)
    R.push({d:'REFER', code:'refer.near-drainage',
      t:'The plot lies about ' + m.distDrain + ' m from a terrain-derived '
      + 'drainage line, against a ' + rule.drainM + ' m buffer. Drain order is not resolved '
      + 'at the 90 m source resolution — check the BBMP rajakaluve alignment for this '
      + 'survey number.'});

  if(m.handM !== null && m.handM <= 1)
    R.push({d:'CONDITIONS', code:'conditions.low-ground',
      t:'The plot stands ' + m.handM + ' m above the nearest drainage '
      + 'line. On-site retention and a plinth condition should be imposed.'});

  if(!R.length) return {d:'NO_OBJECTION', codes:['no-objection.nothing-found'], why:[
    'No recorded water body, buffer breach or drainage line within ' + UNCERTAINTY_M
      + ' m of this plot.',
    'Absence of evidence at 30 m resolution is not evidence of absence: tanks under roughly '
      + 'half a hectare do not appear in this record.']};

  var rank = {REJECT:3, REFER:2, CONDITIONS:1};
  var top = R.reduce(function(a,b){ return rank[b.d] > rank[a.d] ? b : a; });
  // The codes ride alongside the prose rather than replacing it. Nothing that
  // already reads decide() has to change, and the retriever gets a machine
  // handle on which branch fired, which is what the citation spine hangs on.
  return {d:top.d, why:R.map(function(x){ return x.t; }),
          codes:R.map(function(x){ return x.code; })};
}

// The citation spine. Every branch decide() can take names the chunk that
// explains it, and that chunk is forced into the evidence pack at rank zero.
// Two consequences: the pack is never empty, and the tool's own reasoning is
// always citable rather than being the one claim in the answer with no source.
// check_corpus.py asserts this map and decide() agree in both directions.
var CODE_CHUNK = {
  'refer.outside-study-area':          'refusal.outside-study-area',
  'reject.inside-live-water':          'outcome.reject.meaning',
  'reject.former-water-high-occurrence':'outcome.reject.meaning',
  'refer.intermittent-water':          'outcome.refer.meaning',
  'reject.inside-buffer':              'outcome.reject.meaning',
  'refer.buffer-within-uncertainty':   'error.budget.combined-20m',
  'refer.shoreline-disagreement':      'outcome.shoreline-disagreement',
  'refer.near-drainage':               'rule.rajakaluve.bbmp-alignment-governs',
  'conditions.low-ground':             'outcome.conditions.meaning',
  'no-objection.nothing-found':        'outcome.no-objection.meaning'
};

// The three questions this layer was built to answer, one click away. The
// short label is what fits on a chip; the long form is what gets asked, since
// the intent router reads the wording.
var ASK_CHIPS = [
  ['What happens if built?', 'What happens if a construction occurs at this place?'],
  ['Should it be allowed?',  'Is this construction feasible, and should it be allowed?'],
  ['Effect on flooding?',    'Will it affect the flooding level here and downstream?']
];

var OUTCOME = {
  REJECT:       {c:'red',    ic:'✕', t:'REJECT'},
  REFER:        {c:'violet', ic:'?',      t:'REFER TO GROUND SURVEY'},
  CONDITIONS:   {c:'amber',  ic:'⚠', t:'CONDITIONS REQUIRED'},
  NO_OBJECTION: {c:'green',  ic:'✓', t:'NO RECORDED OBJECTION'}
};

function metres(v){ return v === null ? '—' : v >= 255 ? '> 255 m' : v + ' m'; }

function checkPlot(lngLat){
  var S = state.samplers;
  if(!S.buffers || !S.history){
    toast('Measurement layers missing — re-run gee_blue_grid.js, then ./fetch_layers.sh '
      + state.city); return;
  }
  var rule = RULESETS[state.rule];
  var ctx = siteContext(lngLat, rule);
  var m = ctx.m, out = ctx.verdict;
  state.lastCheck = {m:m, out:out, ctx:ctx, lngLat:lngLat, rule:rule, at:new Date()};
  // A new site invalidates the answer about the old one.
  state.lastAnswer = null;
  var prev = document.getElementById('answer');
  if(prev) prev.style.display = 'none';

  var st = OUTCOME[out.d];
  if(state.marker) state.marker.remove();
  var el = document.createElement('div'); el.className = 'pulse';
  el.style.background = st.c==='green' ? 'var(--green)' : st.c==='amber' ? 'var(--amber)'
                      : st.c==='violet' ? 'var(--violet)' : 'var(--red)';
  state.marker = new maplibregl.Marker({element:el}).setLngLat(lngLat).addTo(map);

  var rows = [
    ['Coordinates', lngLat.lat.toFixed(5) + ', ' + lngLat.lng.toFixed(5)],
    ['Plot frontage assumed', state.plotM + ' m'],
    ['To water edge today', metres(m.distPresent)],
    ['To 1984–99 water edge', metres(m.distHistoric)],
    ['To drainage line', metres(m.distDrain)],
    ['Last recorded as water', m.lastWaterYear || 'never, 1984–2021'],
    ['Water occurrence', m.occurrence === null ? '—' : m.occurrence + '%'],
    ['Above nearest drainage', metres(m.handM)],
    ['Catchment through this point', ctx.rec.upaKm2 === null ? '—'
       : ctx.rec.upaKm2 + ' km²'],
    ['Runoff displaced per storm', ctx.rec.runoffDisplacedM3 === null ? '—'
       : ctx.rec.runoffDisplacedM3 + ' m³ (' + ctx.rec.runoffLoM3 + '–'
         + ctx.rec.runoffHiM3 + ')'],
    ['Rule applied', rule.label]
  ];

  showVerdict({c:st.c, ic:st.ic, t:st.t, s:out.why.join(' ')}, rows, null,
              [{label:'Issue screening certificate', fn:issueCertificate}]);
}

function selectBuilding(f){
  var p = f.properties;
  state.selected = p;
  state.selectedF = f;
  // Selecting a footprint moves the site context to it, so the ask box, the
  // evidence brief and any certificate issued next are all about the same
  // thing. Without this a question asked after a building click would answer
  // about whichever plot happened to be clicked before it.
  state.lastAnswer = null;
  if(state.samplers.buffers){
    var ctr = centroidOf(f);
    var ll = {lng: ctr[0], lat: ctr[1]};
    var rule = RULESETS[state.rule];
    var ctx = siteContext(ll, rule, p);
    state.lastCheck = {m: ctx.m, out: ctx.verdict, ctx: ctx, lngLat: ll,
                       rule: rule, at: new Date()};
  }
  var red = p.verdict && p.verdict.indexOf('RED')===0;
  var r = p.verdict==='RED_FORMER_WATER_BODY'
      ? {c:'red', ic:'✕', t:'BUILT ON FORMER WATER BODY', s:'Footprint overlaps land classified as surface water before 2000.'}
    : p.verdict==='RED_BLOCKS_DRAINAGE'
      ? {c:'amber', ic:'⚠', t:'BLOCKS A NATURAL DRAINAGE PATH', s:'Footprint sits on a terrain channel carrying upstream runoff.'}
      : {c:'amber', ic:'⚠', t:'PARTIAL OVERLAP', s:'Part of the footprint falls on former water or a drainage path.'};
  var rows = [
    ['Risk score', (+p.risk_score).toFixed(1)],
    ['Footprint on former water', Math.round(p.lost_frac*100)+'%'],
    ['Footprint in flow path', Math.round(p.flow_frac*100)+'%'],
    ['Upstream catchment', (+p.upstream_km2).toFixed(2)+' km²'],
    ['Height above drainage', (+p.hand_m).toFixed(1)+' m'],
    ['Building area', Math.round(p.area_in_meters)+' m²'],
    ['Footprint confidence', Math.round(p.confidence*100)+'%']
  ];
  showVerdict(r, rows, p);
}

function showVerdict(r, rows, p, actions){
  var el = document.getElementById('verdict');
  el.innerHTML =
    '<div class="vbadge '+r.c+'"><span class="ic">'+r.ic+'</span><span>'+r.t+'</span></div>' +
    '<div style="font-size:11.5px;color:var(--dim);line-height:1.6;margin-bottom:12px">'+r.s+'</div>' +
    rows.map(function(x){
      return '<div class="metric"><span class="k">'+x[0]+'</span><span class="v">'+x[1]+'</span></div>';
    }).join('') +
    (actions||[]).map(function(a,i){
      return '<button class="act" data-act="'+i+'">'+a.label+'</button>';
    }).join('') +
    (p ? '<button class="act" id="briefBtn">Generate evidence brief</button>' : '') +
    (state.lastCheck ?
      '<div class="asker">' +
        '<div class="chips">' + ASK_CHIPS.map(function(q,i){
          return '<button class="chip" data-q="'+i+'">'+q[0]+'</button>'; }).join('') +
        '</div>' +
        '<div class="askrow"><input id="askQ" placeholder="Ask about this plot…" ' +
          'autocomplete="off"><button class="act" id="askBtn">Ask</button></div>' +
      '</div>' : '') +
    '<div id="answer"></div>';
  // A verdict is the answer to the question just asked, so it goes to the top
  // of the rail and the rail scrolls to it. On a short window it would
  // otherwise render below the fold, which loses the whole point.
  var rail = document.getElementById('right');
  rail.insertBefore(el, rail.firstChild);
  el.style.display='block';
  el.style.animation='none'; void el.offsetWidth; el.style.animation='';
  rail.scrollTop = 0;
  if(p) document.getElementById('briefBtn').onclick = function(){ writeBrief(p); };
  var askQ = document.getElementById('askQ');
  if(askQ){
    document.getElementById('askBtn').onclick = function(){ ask(askQ.value); };
    askQ.onkeydown = function(e){ if(e.key === 'Enter') ask(askQ.value); };
    el.querySelectorAll('.chip').forEach(function(b){
      b.onclick = function(){ askQ.value = ASK_CHIPS[+b.dataset.q][1]; ask(askQ.value); };
    });
  }
  (actions||[]).forEach(function(a,i){
    el.querySelector('[data-act="'+i+'"]').onclick = a.fn;
  });
}

// The evidence brief and the free-text answer are the same product asked a
// fixed question, so they go through one generator rather than diverging into
// two prose styles that drift apart. The building's own per-footprint
// measurements ride along as structure-scoped facts.
function writeBrief(p){
  var f = state.selectedF;
  if(!f || !state.samplers.buffers){
    toast('Measurement layers missing — re-run gee_blue_grid.js, then ./fetch_layers.sh '
      + state.city);
    return;
  }
  var c = centroidOf(f);
  var lngLat = {lng: c[0], lat: c[1]};
  var rule = RULESETS[state.rule];
  var ctx = siteContext(lngLat, rule, p);
  // The brief is about this footprint, so the certificate and any follow-up
  // question are about it too.
  state.lastCheck = {m: ctx.m, out: ctx.verdict, ctx: ctx, lngLat: lngLat,
                     rule: rule, at: new Date()};
  ask('What happens because this structure stands here, and who is affected '
    + 'downstream?', ctx);
}

// ===========================================================================
// SCREENING CERTIFICATE  — the artifact that leaves the screen
// ===========================================================================
var PROVENANCE = [
  ['Surface water',  'JRC Global Surface Water v1.4 — transition, occurrence and YearlyHistory, 1984–2021'],
  ['Terrain',        'MERIT Hydro v1.0.1 — upstream drainage area and height above nearest drainage, 90 m'],
  ['Land cover',     'Dynamic World V1 — mode of annual labels, 2023–2025, 10 m'],
  ['Footprints',     'Google Open Buildings v3 — confidence ≥ 0.70, area ≥ 40 m²'],
  ['Imagery',        'Landsat 5 C02 L2 (2003–07), Sentinel-2 SR Harmonized (2023–25)'],
  ['Distance field', 'fastDistanceTransform, EPSG:32643 at 10 m, ceiling 255 m'],
  ['Raster',         '2048 × 1195 over the study area, 6.36 m per pixel'],
  ['Upstream area',  'MERIT Hydro upa, log-packed: code = 255·log10(1+km²)/log10(1001), ceiling 1000 km²'],
  ['Runoff',         'volumetric rational form: area × design storm depth × change in runoff coefficient']
];

var ERROR_BUDGET = [
  ['JRC 30 m pixel — position of the shoreline', '± 15 m'],
  ['Distance-transform quantum at 10 m',              '± 7 m'],
  ['Raster georeferencing, one pixel',                '± 6 m'],
  ['Thumbnail resample and byte decode',              'nil, nearest-neighbour'],
  ['Combined in quadrature',                          '± ' + UNCERTAINTY_M + ' m']
];

// A plain hash, not crypto.subtle: that needs a secure context, and on a
// hall's LAN IP this page is not one, where it would throw silently. The
// canonical string is printed on the certificate so anyone can recompute the
// digest and detect an altered copy.
function fnv1a(str){
  var h = 0x811c9dc5;
  for(var i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0;
  }
  return ('00000000' + h.toString(16)).slice(-8).toUpperCase();
}

function nextSeq(){
  var n = 1;
  try {
    n = (parseInt(localStorage.getItem('vbg_seq'), 10) || 0) + 1;
    localStorage.setItem('vbg_seq', n);
  } catch(e){}
  return n;
}

function issueCertificate(){
  var ck = state.lastCheck;
  if(!ck){ toast('Check a plot first.'); return; }
  toast('Capturing site evidence…');
  map.flyTo({center:[ck.lngLat.lng, ck.lngLat.lat], zoom:17, duration:700});
  map.once('idle', function(){
    var snap = '';
    try { snap = map.getCanvas().toDataURL('image/png'); } catch(e){}
    hideToast();
    renderCertificate(ck, snap);
  });
}

function renderCertificate(ck, snap){
  var m = ck.m, out = ck.out, rule = ck.rule, c = CITIES[state.city];
  // An answer is only carried onto the certificate if it is about this site
  // and was reasoned under this ruleset. Anything else is stale by definition.
  var ans = (state.lastAnswer && state.lastAnswer.pack.site.ruleset === rule.id &&
             Math.abs(state.lastAnswer.pack.site.lat - ck.lngLat.lat) < 1e-6 &&
             Math.abs(state.lastAnswer.pack.site.lon - ck.lngLat.lng) < 1e-6)
            ? state.lastAnswer : null;
  var iso = ck.at.toISOString();
  var lat = ck.lngLat.lat, lon = ck.lngLat.lng;

  var canon = [state.city, lat.toFixed(6), lon.toFixed(6), state.plotM, rule.id,
    rule.lakeM, rule.drainM, m.distPresent, m.distHistoric, m.distDrain,
    m.lastWaterYear, m.occurrence, m.handM, out.d, iso,
    // What the tool said, and what it said it from. A certificate whose
    // reasoning was drawn from a different corpus version, or from a different
    // set of sources, is a different document and its digest must differ.
    (state.corpus ? state.corpus.corpus_version : 'no-corpus'),
    (ans ? ans.answer.generator : 'none'),
    (ans ? ans.pack.chunks.map(function(x){ return x.id; }).join(',') : '')
    ].join('|');
  var ref = 'VBG/BLR/' + iso.slice(0,10).replace(/-/g,'') + '/'
          + String(nextSeq()).padStart(4,'0') + '-' + fnv1a(canon);

  function rows(pairs){
    return pairs.map(function(r){
      return '<div class="crow"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>';
    }).join('');
  }

  document.getElementById('sheet').innerHTML =
    '<div class="cert">' +
      '<div class="chead">' +
        '<div><h2>Preliminary satellite screening</h2>' +
        '<div class="lede">' + c.label + ' — ' + c.sub + '. A screening result '
          + 'derived from public satellite data. It is not a survey and does not '
          + 'substitute for the notified boundary.</div></div>' +
        '<div class="cref"><b>' + ref + '</b><span>issued ' + iso.replace('T',' ').slice(0,19) + ' UTC</span></div>' +
      '</div>' +

      '<div class="cert-decision ' + OUTCOME[out.d].c + '">' + OUTCOME[out.d].t + '</div>' +
      '<ol class="creason">' + out.why.map(function(w){ return '<li>'+w+'</li>'; }).join('') + '</ol>' +

      '<h3>Application</h3>' +
      '<div class="cfields">' +
        '<label>Application no.<input class="cin"></label>' +
        '<label>Survey / khata no.<input class="cin"></label>' +
        '<label>Applicant<input class="cin"></label>' +
      '</div>' +

      '<h3>Measurements</h3>' +
      rows([
        ['Coordinates', lat.toFixed(6) + ', ' + lon.toFixed(6)],
        ['Plot frontage assumed', state.plotM + ' m (probe radius ' + Math.max(6, state.plotM/2) + ' m)'],
        ['Distance to water edge today', metres(m.distPresent) + ' ± ' + UNCERTAINTY_M + ' m'],
        ['Distance to 1984–99 water edge', metres(m.distHistoric) + ' ± ' + UNCERTAINTY_M + ' m'],
        ['Distance to drainage line', metres(m.distDrain) + ' ± ' + UNCERTAINTY_M + ' m'],
        ['Last recorded as water', m.lastWaterYear || 'never, 1984–2021'],
        ['Water occurrence, 1984–2021', (m.occurrence === null ? '—' : m.occurrence + '%')],
        ['Height above nearest drainage', metres(m.handM)],
        ['Catchment draining through this point', ck.ctx && ck.ctx.rec.upaKm2 !== null
           ? ck.ctx.rec.upaKm2 + ' km² (log-packed byte, decoded 10^(R/255·log10 1001) − 1)'
           : 'not available — hydro layer not exported'],
        ['Runoff displaced per design storm', ck.ctx && ck.ctx.rec.runoffDisplacedM3 !== null
           ? ck.ctx.rec.runoffDisplacedM3 + ' m³, plausibly ' + ck.ctx.rec.runoffLoM3
             + '–' + ck.ctx.rec.runoffHiM3 + ' m³'
           : '—'],
        ['Runoff arithmetic', 'plot area × ' + PARAMS.P_mm + ' mm design storm × '
           + PARAMS.dC + ' change in runoff coefficient']
      ]) +

      '<h3>Rule applied</h3>' +
      rows([
        ['Ruleset', rule.label],
        ['Lake buffer', rule.lakeM + ' m'],
        ['Drain buffer', rule.drainM + ' m'],
        ['Citation', rule.cite]
      ]) +
      '<p class="cnote">Buffer distances are operator configuration, not a legal '
        + 'determination by this tool. Confirm against the notification in force.</p>' +

      (snap ? '<h3>Site evidence</h3><img class="csnap" src="' + snap + '" alt="site">' : '') +

      (ans ? '<h3>Answers given</h3>' +
        '<p class="cnote"><b>' + ans.pack.question + '</b></p>' +
        '<p class="cnote">' + substitute(ans.answer.narrative,
            factMap(ans.pack)).text.replace(/\[[a-z0-9.\-]+\]/g, '') + '</p>' +
        rows([
          ['Composed by', ans.answer.generator === 'model'
             ? 'language model, grounded on the sources below and validated '
               + 'against them' : 'the tool itself, from the evidence pack'],
          ['Corpus version', ans.pack.corpus_version || '—'],
          ['Sources cited', ans.pack.chunks.map(function(x){ return x.id; }).join(', ')]
        ]) +
        '<p class="cnote">An answer is an explanation of the screening result '
          + 'above, not an additional finding. Every figure in it is one of the '
          + 'measurements already tabled.</p>' : '') +

      '<h3>Error budget</h3>' + rows(ERROR_BUDGET) +

      '<h3>Provenance</h3>' + rows(PROVENANCE) +
      rows([['Study area', c.bounds.join(', ')]]) +

      '<h3>Integrity</h3>' +
      '<p class="cnote">The reference digest is FNV-1a over the canonical string below. '
        + 'Recompute it from the same inputs to detect alteration.</p>' +
      '<div class="ccanon">' + canon + '</div>' +

      '<h3>Ground verification</h3>' +
      '<div class="cbox"></div>' +
      '<p class="ccheck">☐ Verified against the notified lake boundary and the '
        + 'BBMP rajakaluve alignment.</p>' +
      '<div class="csign">' +
        '<div>Name and designation<hr></div><div>Employee ID<hr></div>' +
        '<div>Date<hr></div><div>Signature<hr></div>' +
      '</div>' +

      '<p class="cfoot">Derived from public satellite data at 30 m and 90 m source '
        + 'resolution. Tanks below roughly half a hectare do not appear in this record, '
        + 'so absence of a finding is not evidence of absence. This document neither '
        + 'grants nor refuses permission.</p>' +

      '<button class="act noprint" id="printCert">Print / save as PDF</button>' +
    '</div>';

  document.getElementById('modal').classList.add('on');
  document.getElementById('printCert').onclick = function(){ window.print(); };
  // A typed value lives only in the DOM property, which print ignores.
  // Mirroring it to the attribute is what makes it appear on paper.
  Array.prototype.forEach.call(document.querySelectorAll('.cin'), function(el){
    el.oninput = function(){ el.setAttribute('value', el.value); };
  });
}

// ===========================================================================
// MINI-RAG  — retrieval over the corpus, grounded on the live site record
// ===========================================================================
// The organising idea, in one line: the corpus is the parameter store and the
// evidence pack is the only place numbers exist.
//
// Design rainfall, runoff coefficients, buffer distances, the error budget and
// the exposure bands are all declared on corpus chunks and read from there. A
// figure therefore cannot reach an answer without a chunk id attached to it,
// because there is nowhere else in the system for it to have come from. The
// model is then forbidden from typing a digit at all: it emits {{fact.id}}
// placeholders and this file substitutes them. Together those two make
// invented arithmetic structurally impossible rather than merely discouraged.

// Byte-identical to tok() in build_corpus.py. If these two ever drift, the
// client scores a query against postings built for a different vocabulary and
// nothing anywhere reports an error.
var STOP = {};
('a an the and or of to in on at is are was were be been it its this that these '
+'those for from with as by if then than so such not no').split(' ')
  .forEach(function(w){ STOP[w] = 1; });

function tok(s){
  return String(s).toLowerCase().split(/[^a-z0-9]+/).filter(function(t){
    return t && !STOP[t] && (t.length > 1 || /^[0-9]$/.test(t));
  });
}

// A keyword router, not a model. Five intents, each preferring certain kinds
// of chunk. Ordered: the flood test runs first because a flooding question
// asked in feasibility language is still a flooding question, and it is the
// one that has to pull its refusals in.
// Word boundaries are not decoration here. Without them "possible" matches
// inside "responsible" and "prove" matches inside "approved", so a question
// about who owns the land routes as feasibility and a question about whether
// the authority will approve routes as evidence. Both were doing exactly that.
var INTENT_RULES = [
  ['flood',       /\b(flood\w*|inundat\w*|waterlog\w*|submerg\w*|drown\w*|overflow\w*)\b|\bwater level\b|\bhow deep\b|\bdepth\b/],
  ['consequence', /\bwhat happens\b|\beffects?\b|\bimpacts?\b|\bconsequences?\b|\bdownstream\b|\bwho pays\b|\bharm\b|\bresult of\b/],
  ['evidence',    /\bhow do you know\b|\bhow accurate\b|\baccuracy\b|\bsources?\b|\breliable\b|\bproven?\b|\bevidence\b|\bconfiden\w*\b|\btrust\b|\bwhere.*data\b/],
  ['procedure',   /\bwhat do i do\b|\bnext steps?\b|\bwho decides\b|\bappeals?\b|\bprocess\b|\bprocedure\b|\bcertificate\b|\bapply\b|\bsurveys?\b/],
  ['feasibility', /\ballow\w*\b|\bpermit\w*\b|\blegal\b|\blawful\b|\bsanction\w*\b|\bapprov\w*\b|\bfeasible\b|\bcan i\b|\bshould i\b|\bbuild here\b|\bpossible\b/]
];

// Refusals are routed from the question independently of the intent, because
// a question can ask several things at once and only some of them are
// answerable. "How much will the flood damage cost" is a flooding question AND
// a costing question; routing it to one intent and refusing only that one
// leaves the other silently unanswered, which is how a tool ends up appearing
// to have declined to answer something it never noticed was asked.
var REFUSAL_RULES = [
  [/\bhow deep\b|\bdepths?\b|\bwater level\b|\blevel of\b|\bhow high\b|\bhow much water\b/,
   'refusal.no-flood-depth-model', 'flood depth or level'],
  [/\b(flood\w*|inundat\w*|waterlog\w*)\b/,
   'refusal.not-a-flood-predictor', 'a prediction that this place will flood'],
  [/\bcosts?\b|\bdamages?\b|\bcompensation\b|\brupees?\b|\bprice\b|\bworth\b|\bhow much money\b|\bloss(es)?\b/,
   'refusal.cannot-price-damage', 'what the damage would cost'],
  [/\bowns?\b|\bowners?\b|\bowned\b|\bwhose\b|\boccupants?\b|\bbuilders?\b|\bresponsible\b|\bliable\b|\bwho built\b/,
   'refusal.cannot-identify-owner', 'who owns this land or is responsible for it'],
  [/\b(il)?legal\b|\b(un)?lawful\b|\bcourt\b|\bprosecut\w*\b|\bmy rights\b|\blegal advice\b/,
   'refusal.not-a-legal-determination', 'whether this is lawful'],
  [/\bapprov\w*\b|\bwill it pass\b|\bchances?\b|\blikely\b|\bodds\b|\bget permission\b/,
   'refusal.no-approval-prediction', 'whether the authority will approve it']
];

function routeRefusals(q){
  var lq = String(q || '').toLowerCase(), out = [], seen = {};
  REFUSAL_RULES.forEach(function(r){
    if(r[1] in seen || !r[0].test(lq)) return;
    seen[r[1]] = 1;
    out.push({chunk: r[1], asked: r[2]});
  });
  return out;
}

// One sentence each, so a refusal appears in the prose and not only in a list
// underneath it. Naming what is missing is the useful part.
var REFUSAL_LINE = {
  'refusal.no-flood-depth-model':
    'How deep water stands anywhere downhill is not answerable from this data: '
    + 'it needs the drain network, a fine elevation model, a local rainfall curve '
    + 'and a hydraulic solver, none of which this tool holds.',
  'refusal.not-a-flood-predictor':
    'This is an evidence tool rather than a flood predictor, so it can say what '
    + 'a development displaces and how the ground lies, and not whether a place '
    + 'will flood.',
  'refusal.cannot-price-damage':
    'No monetary figure can be produced here. Costing damage needs asset values, '
    + 'occupancy and a depth-damage relationship, none of which this tool holds; '
    + 'the volume and the exposure class are the inputs to hand to someone who does.',
  'refusal.cannot-identify-owner':
    'Nothing here identifies an owner or an occupant. The building layer is '
    + 'machine-derived geometry carrying no name, khata or survey number, so '
    + 'responsibility comes from records held elsewhere and from a site visit.',
  'refusal.not-a-legal-determination':
    'Whether this is lawful turns on the notified boundary, the sanction record '
    + 'and its date, none of which this tool reads. It reports measurements '
    + 'against a buffer figure it was told to apply.',
  'refusal.no-approval-prediction':
    'Whether the authority approves is not predicted here. That would mean '
    + 'modelling the officer rather than the ground.'
};
function routeIntent(q){
  var lq = String(q || '').toLowerCase();
  for(var i=0;i<INTENT_RULES.length;i++)
    if(INTENT_RULES[i][1].test(lq)) return INTENT_RULES[i][0];
  return 'feasibility';
}
var INTENT_KINDS = {
  flood:       {refusal:1, hydro:1, outcome:1, limit:1},
  feasibility: {rule:1, outcome:1, error:1},
  consequence: {hydro:1, precedent:1, outcome:1},
  procedure:   {rule:1, outcome:1, scope:1},
  evidence:    {method:1, limit:1, error:1}
};

function expand(terms, syn){
  var out = terms.slice();
  terms.forEach(function(t){ if(syn[t]) out = out.concat(syn[t]); });
  return out;
}

// Standard BM25 against the postings the build step precomputed.
function bm25(corpus, terms){
  var ix = corpus.index, n = corpus.chunks.length, sc = new Array(n);
  for(var i=0;i<n;i++) sc[i] = 0;
  var seen = {};
  terms.forEach(function(t){
    if(seen[t] || !ix.postings[t]) return;
    seen[t] = 1;
    var df = ix.df[t];
    var idf = Math.log(1 + (ix.N - df + 0.5) / (df + 0.5));
    ix.postings[t].forEach(function(pair){
      var d = pair[0], f = pair[1];
      var norm = f + ix.k1 * (1 - ix.b + ix.b * ix.doclen[d] / ix.avgdl);
      sc[d] += idf * (f * (ix.k1 + 1)) / norm;
    });
  });
  return sc;
}

// The trigger channel. A declarative list, never eval. A clause naming a null
