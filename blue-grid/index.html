<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanished Blue Grid</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
/* ===========================================================================
   DESIGN SYSTEM
   ---------------------------------------------------------------------------
   The old skin was five translucent cards floating on satellite imagery with
   22 px of backdrop blur behind every one of them. Over a busy raster that
   reads as mush: the text sat at roughly 3:1 against whatever pixels happened
   to be underneath, and every panel carried the same weight, so the screening
   verdict looked exactly like the plot-frontage field.

   This is an instrument, not a glass dashboard. Three rules follow from that:

   1. SURFACES ARE OPAQUE. Blur is kept only where a panel genuinely overlaps
      the map, and even there the surface is 94% opaque. Contrast is a
      legibility requirement for a document that gets printed and signed, not
      a style choice.
   2. ONE THING IS LOUD PER PANEL. The verdict, then the two or three
      measurements that produced it. Everything else is a hairline row that
      the eye can skip. A panel where everything is 12 px has no hierarchy.
   3. NUMBERS ARE TABULAR AND MONOSPACED, PROSE IS NOT. A column of distances
      must align on the decimal or it cannot be scanned.
   =========================================================================== */
:root{
  /* Neutral near-black, not blue-tinted. The map supplies all the colour this
     interface needs; the chrome around it should recede. */
  --ink:#07080b;
  --surface:#0e1116;         /* panels */
  --raised:#161a22;          /* controls sitting on panels */
  --sunken:#0a0c11;          /* wells, inputs */

  --line:rgba(255,255,255,.075);
  --line-hot:rgba(255,255,255,.16);
  --line-bright:rgba(255,255,255,.28);

  --text:#eef1f6;
  --dim:#939cae;
  --faint:#5d6676;

  /* One interactive accent. Everything clickable is this colour; nothing that
     is not clickable is. */
  --accent:#4d9fff;
  --accent-dim:rgba(77,159,255,.14);
  --accent-line:rgba(77,159,255,.40);

  /* Verdict semantics. Deliberately distinct from the map palette below —
     a REJECT badge and the red encroachment raster must not read as the same
     object. The badge also carries a left rule and a tint, so the two are
     separated by structure and not by hue alone. */
  --v-reject:#ff5f57;
  --v-refer:#b06bff;
  --v-conditions:#ffb224;
  --v-clear:#35d07f;

  /* Map layer palette — mirrors PALETTE in the script, which mirrors the
     colours gee_blue_grid.js renders the PNGs with. */
  --lyr-historic:#1f6feb;
  --lyr-present:#58a6ff;
  --lyr-encroached:#f85149;
  --lyr-flowpath:#d29922;
  --lyr-floodprone:#bc8cff;

  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;

  --r-lg:14px; --r-md:10px; --r-sm:7px;
  --shadow:0 20px 60px -12px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);

  --topbar-h:54px;
  --dock-gap:16px;
  /* The space the dock may occupy, as insets from each edge. Updated when the
     queue collapses so the dock reclaims the room rather than staying offset
     against a rail that is no longer there. */
  --rail-l:326px;
  --rail-r:368px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(7,8,11,.82)!important}
.maplibregl-ctrl-attrib a{color:var(--faint)!important}
.maplibregl-ctrl-group{background:var(--surface)!important;border:1px solid var(--line)!important;
  box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button span{filter:invert(1) opacity(.7)}
/* The zoom control sits above the dock rather than beside it. */
.maplibregl-ctrl-bottom-right{bottom:112px!important}

::selection{background:rgba(77,159,255,.3)}

/* ---------- surfaces ----------
   .panel is the single surface primitive. The inset highlight along the top
   edge is what makes it read as a machined object rather than a rectangle:
   one hairline of light where a real bevel would catch it. */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.045)}
.panel.over-map{background:rgba(14,17,22,.94);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}

/* Section label. One style, used in every panel, so a heading always means
   the same thing. */
.lbl{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint)}

/* ---------- scrollbars ---------- */
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-hot) transparent}
.scroll::-webkit-scrollbar{width:6px;height:6px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--line-hot);border-radius:3px}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--line-bright)}

/* ===========================================================================
   TOP BAR
   Identity, place, mode, and the two global actions. Buffer configuration used
   to live here too, which was wrong: it is an input to one specific screening
   decision, so it now sits in the inspector beside the decision it changes.
   =========================================================================== */
#top{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);z-index:30;
  display:flex;align-items:center;gap:14px;padding:0 14px;
  background:rgba(7,8,11,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line)}

.brand{display:flex;align-items:center;gap:9px;flex:none;user-select:none}
.brand .mark{width:22px;height:22px;flex:none;position:relative}
.brand b{font:700 13px/1 var(--sans);letter-spacing:-.01em;white-space:nowrap}
.brand em{font-style:normal;font:600 8.5px/1 var(--mono);letter-spacing:.18em;
  color:var(--v-reject);border:1px solid rgba(255,95,87,.35);
  padding:3px 5px;border-radius:4px;background:rgba(255,95,87,.08)}

.vr{width:1px;height:22px;background:var(--line);flex:none}

/* Native select, restyled. A custom dropdown would be more controllable and
   would also need keyboard handling, an outside-click listener and a focus
   trap — three things the platform already gets right. */
select{appearance:none;-webkit-appearance:none;
  background:var(--raised);color:var(--text);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:7px 26px 7px 10px;font:600 12px/1 var(--sans);
  cursor:pointer;outline:none;transition:border-color .15s, background .15s;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23939cae' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center}
select:hover{border-color:var(--line-hot)}
select:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}

/* Segmented control. The mode IS the product's posture, so it gets the centre
   of the bar and a moving highlight rather than three separate buttons. */
.segmented{display:flex;gap:2px;background:var(--sunken);border:1px solid var(--line);
  border-radius:var(--r-md);padding:3px;margin:0 auto}
.segmented button{background:none;border:none;color:var(--dim);cursor:pointer;
  font:600 12px/1 var(--sans);padding:8px 16px;border-radius:var(--r-sm);
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  transition:color .16s, background .16s}
.segmented button:hover{color:var(--text)}
.segmented button.on{background:var(--raised);color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06)}
.segmented button .sd{width:6px;height:6px;border-radius:50%;background:currentColor;
  opacity:.35;transition:opacity .16s}
.segmented button.on .sd{opacity:1;background:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--raised);
  border:1px solid var(--line);color:var(--dim);border-radius:var(--r-sm);
  padding:8px 12px;font:600 11.5px/1 var(--sans);cursor:pointer;white-space:nowrap;
  transition:color .15s, border-color .15s, background .15s}
.btn:hover{color:var(--text);border-color:var(--line-hot);background:#1b2029}
.btn:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.btn svg{flex:none;opacity:.8}
.btn.primary{background:var(--accent-dim);border-color:var(--accent-line);color:#bcdcff}
.btn.primary:hover{background:rgba(77,159,255,.22);color:#dbecff}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* ===========================================================================
   LEFT — the queue
   A browsing aid, not the product, so it collapses. It opens by default only
   where browsing is the point (timeline and downstream) and starts collapsed
   in screening, where the map click is the input.
   =========================================================================== */
#left{position:absolute;left:14px;top:calc(var(--topbar-h) + 12px);width:296px;z-index:20;
  max-height:calc(100vh - var(--topbar-h) - 150px);display:flex;flex-direction:column;
  transition:transform .32s cubic-bezier(.32,.72,0,1), opacity .24s}
#left.collapsed{transform:translateX(calc(-100% - 20px));opacity:0;pointer-events:none}

#queueToggle{position:absolute;left:14px;top:calc(var(--topbar-h) + 12px);z-index:19;
  opacity:0;pointer-events:none;transition:opacity .24s}
#queueToggle.show{opacity:1;pointer-events:auto}

.phead{display:flex;align-items:center;gap:8px;padding:13px 14px 11px;
  border-bottom:1px solid var(--line);flex:none}
.phead .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font:600 9.5px/1 var(--mono);letter-spacing:.06em;color:var(--dim);
  background:var(--raised);border:1px solid var(--line);border-radius:20px;padding:4px 8px;
  flex:none;font-variant-numeric:tabular-nums}
.iconbtn{background:none;border:none;color:var(--faint);cursor:pointer;padding:3px;
  border-radius:5px;display:grid;place-items:center;flex:none;transition:color .15s,background .15s}
.iconbtn:hover{color:var(--text);background:var(--raised)}

#list{padding:6px;max-height:100%}
.item{display:flex;align-items:center;gap:10px;padding:9px 9px;border-radius:var(--r-sm);
  cursor:pointer;border:1px solid transparent;transition:background .14s,border-color .14s}
.item:hover{background:var(--raised);border-color:var(--line)}
.item.on{background:var(--accent-dim);border-color:var(--accent-line)}
.item .rank{font:600 10px/1 var(--mono);color:var(--faint);width:16px;flex:none;
  font-variant-numeric:tabular-nums;text-align:right}
.item .dot{width:7px;height:7px;border-radius:2px;flex:none}
.item .body{flex:1;min-width:0}
.item .nm{font:600 12.5px/1.3 var(--sans);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block}
.item .sub{font:400 10.5px/1.4 var(--mono);color:var(--faint);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.item .sc{font:700 12px/1 var(--mono);color:var(--v-reject);flex:none;
  font-variant-numeric:tabular-nums}
.empty{padding:16px 14px;font:400 11.5px/1.65 var(--sans);color:var(--faint)}

/* ===========================================================================
   RIGHT — the inspector
   One column, but a strict order: what was decided, what decided it, what else
   was measured, what you can do about it. The old panel interleaved all four.
   =========================================================================== */
#right{position:absolute;right:14px;top:calc(var(--topbar-h) + 12px);width:340px;z-index:20;
  max-height:calc(100vh - var(--topbar-h) - 150px);display:flex;flex-direction:column;gap:11px;
  overflow:visible}
#rightScroll{display:flex;flex-direction:column;gap:11px;overflow-y:auto;min-height:0;
  padding-right:2px}

/* ---- screening parameters ----
   Moved out of the header. These two inputs change the verdict, so they belong
   against the verdict where the officer can see what was applied. */
#paramsBar{display:none;padding:12px 14px;gap:10px;flex-direction:column}
#paramsBar.on{display:flex}
/* Label above control, not beside it. Beside it, a 52 px gutter left the
   select 265 px, and "State revision — 30 m lake buffer" does not fit in 265 px
   — the officer saw a rule name cut off mid-word on the control that decides
   the verdict. */
.pfield{display:flex;flex-direction:column;gap:6px}
.pfield select{width:100%;min-width:0;font-size:11.5px}
.numin{display:flex;align-items:center;gap:0;background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;flex:1}
.numin input{flex:1;min-width:0;background:none;border:none;color:var(--text);
  font:600 12px/1 var(--mono);padding:8px 9px;outline:none;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield}
.numin input::-webkit-outer-spin-button,.numin input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.numin span{font:600 10.5px/1 var(--mono);color:var(--faint);padding:0 10px 0 4px;flex:none}
.numin:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}

/* ---- the catchment ledger ---- */
#statsCard{padding:14px}
#statsCard .phead{padding:0 0 11px;margin-bottom:3px}
.metric{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:none}
.metric .k{font:400 11.5px/1.45 var(--sans);color:var(--dim)}
.metric .v{font:600 13.5px/1 var(--mono);font-variant-numeric:tabular-nums;
  white-space:nowrap;flex:none}
.metric.big{padding:11px 0}
.metric.big .v{font-size:26px;font-weight:700;letter-spacing:-.025em}
.v.red{color:var(--v-reject)} .v.blue{color:var(--lyr-present)} .v.violet{color:var(--lyr-floodprone)}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--v-reject),#ff9d6b);
  transition:width 1.1s cubic-bezier(.22,1,.36,1)}

/* ---- the verdict ----
   A banner with a left rule, not a rounded pill. The rule is what makes it
   read as a stamp on a document rather than another button. */
#verdict{display:none;overflow:hidden}
#verdict.on{display:block;animation:rise .38s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.vbanner{position:relative;padding:15px 16px 15px 19px;border-bottom:1px solid var(--line)}
.vbanner::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:currentColor}
.vbanner .vrow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.vbanner .vic{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  font:700 11px/1 var(--sans);background:currentColor;flex:none}
.vbanner .vic span{color:var(--surface)}
.vbanner .vt{font:800 13px/1.2 var(--sans);letter-spacing:.01em}
.vbanner .vsub{font:400 12px/1.6 var(--sans);color:#c2cbda}
.vbanner.reject{color:var(--v-reject);background:linear-gradient(90deg,rgba(255,95,87,.12),rgba(255,95,87,.02))}
.vbanner.refer{color:var(--v-refer);background:linear-gradient(90deg,rgba(176,107,255,.12),rgba(176,107,255,.02))}
.vbanner.conditions{color:var(--v-conditions);background:linear-gradient(90deg,rgba(255,178,36,.11),rgba(255,178,36,.02))}
.vbanner.clear{color:var(--v-clear);background:linear-gradient(90deg,rgba(53,208,127,.11),rgba(53,208,127,.02))}

/* ---- drivers ----
   The measurements that actually produced the verdict, pulled out of the table
   and given size. In the old panel "0 m to the 1984-99 edge" — the finding —
   was rendered identically to "plot frontage assumed". */
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-bottom:1px solid var(--line)}
.drivers.one{grid-template-columns:1fr}
.driver{background:var(--surface);padding:12px 14px}
.driver .dk{font:600 9.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);display:block;margin-bottom:6px}
.driver .dv{font:700 21px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  display:block}
.driver .dn{font:400 10.5px/1.45 var(--sans);color:var(--dim);display:block;margin-top:5px}
.driver.hot .dv{color:var(--v-reject)}
.driver.warn .dv{color:var(--v-conditions)}
.driver.ok .dv{color:var(--v-clear)}

/* ---- collapsible measurement table ---- */
.fold{border-bottom:1px solid var(--line)}
.fold>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;
  align-items:center;gap:8px;transition:background .14s}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:hover{background:var(--raised)}
.fold>summary .lbl{flex:1}
.fold>summary .chev{transition:transform .22s;color:var(--faint);flex:none}
.fold[open]>summary .chev{transform:rotate(90deg)}
.foldbody{padding:2px 14px 13px}
.foldbody .metric .k{font-size:11px}
.foldbody .metric .v{font-size:12px}

.vactions{padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.vactions .btn{justify-content:center;width:100%}

/* ===========================================================================
   DOCK — one slot at the bottom centre, two occupants
   The timeline owns it in timeline mode; the ask bar owns it everywhere else.
   They never coexist, so they never need to negotiate space, and the eye
   learns one place to look for "the thing I drive this with".
   =========================================================================== */
/* Centred between the rails rather than on the viewport. Centring on 50% of
   the window looks right only while both rails happen to be the same width —
   at any narrower size the answer panel slid straight under the inspector. */
#dock{position:absolute;left:var(--rail-l);right:var(--rail-r);bottom:var(--dock-gap);
  margin-inline:auto;max-width:760px;
  z-index:25;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#dock>*{pointer-events:auto}

/* ---- timeline ---- */
#timeline{padding:14px 18px 15px;transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .3s}
#timeline.hid{transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none;
  position:absolute;bottom:0;left:0;right:0}
.trow{display:flex;align-items:center;gap:16px}
#play{width:40px;height:40px;flex:none;border-radius:50%;
  border:1px solid var(--accent-line);background:var(--accent-dim);color:#bcdcff;
  font-size:13px;cursor:pointer;display:grid;place-items:center;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),background .16s}
#play:hover{background:rgba(77,159,255,.26);transform:scale(1.06)}
#play:active{transform:scale(.97)}
.tcore{flex:1;min-width:0}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:9px}
#year{font:700 24px/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums;flex:none}
#caption{font:400 11.5px/1.5 var(--sans);color:var(--dim);text-align:right}
input[type=range]{width:100%;height:3px;-webkit-appearance:none;appearance:none;
  border-radius:2px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--lyr-historic),var(--v-reject))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:#fff;cursor:grab;
  box-shadow:0 0 0 4px rgba(255,255,255,.14), 0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-webkit-slider-thumb:active{cursor:grabbing}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;
  background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.14)}
.ticks{display:flex;justify-content:space-between;margin-top:8px;
  font:400 9.5px/1 var(--mono);color:var(--faint);letter-spacing:.02em}

/* ---- ask ----
   Its own input, docked, always in the same place. It used to be the last
   element inside a 900 px stack in a 306 px rail, which meant the officer had
   to scroll past every measurement to reach the one control that takes a
   question. The answer expands upward from here so the input never moves.
   =========================================================================== */
#askDock{display:none;flex-direction:column;gap:9px}
#askDock.on{display:flex;animation:rise .3s cubic-bezier(.16,1,.3,1)}

#answerPanel{display:none;max-height:min(46vh,430px);overflow:hidden;flex-direction:column}
#answerPanel.on{display:flex}
.ahead{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;
  border-bottom:1px solid var(--line);flex:none}
.ahead .q{font:600 12.5px/1.45 var(--sans);flex:1;min-width:0}
.ahead .gen{font:600 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);flex:none;padding-top:2px}
#answer{padding:14px 15px;overflow-y:auto;min-height:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;background:rgba(14,17,22,.92);border:1px solid var(--line);
  color:var(--dim);border-radius:20px;font:600 11px/1 var(--sans);cursor:pointer;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:color .15s,border-color .15s,background .15s}
.chip:hover{color:var(--text);border-color:var(--line-hot);background:var(--raised)}

.askbar{display:flex;gap:9px;align-items:center;padding:8px 8px 8px 15px}
.askbar .qi{flex:none;color:var(--faint);display:grid;place-items:center}
.askbar input{flex:1;min-width:0;background:none;border:none;color:var(--text);
  font:400 13px/1.3 var(--sans);outline:none;padding:9px 0}
.askbar input::placeholder{color:var(--faint)}
.askbar .btn{padding:9px 14px}
kbd{font:600 9.5px/1 var(--mono);color:var(--faint);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:4px 5px;background:var(--sunken)}

/* answer internals */
.awarn{margin-bottom:11px;padding:9px 11px;border-radius:var(--r-sm);
  font:400 11px/1.6 var(--sans);color:#ffd79a;background:rgba(255,178,36,.09);
  border-left:2px solid var(--v-conditions)}
.atext{font:400 12.5px/1.75 var(--sans);color:#ccd5e2}
.atext .cite{font:600 9px/1 var(--mono);color:var(--accent);padding:0 1px;vertical-align:super}
.arefuse{margin-top:11px;padding:9px 11px;border-radius:var(--r-sm);
  font:400 11px/1.6 var(--sans);color:#d5b8ff;background:rgba(176,107,255,.1);
  border-left:2px solid var(--v-refer)}
.asec{margin:16px 0 5px;font:600 9.5px/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
#answer .metric{padding:7px 0}
#answer .metric .v{font-size:12px}
#answer .metric i{font-style:normal;color:var(--faint);font-size:10px;font-weight:400}
.awhat{margin:0;padding-left:16px;font:400 11.5px/1.7 var(--sans);color:var(--dim)}
.awhat li{margin-bottom:5px}
.asrc{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.asrc .n{flex:0 0 14px;font:600 9px/1.6 var(--mono);color:var(--accent)}
.asrc b{display:block;font:600 11.5px/1.45 var(--sans)}
.asrc i{display:block;font-style:normal;font:400 10.5px/1.55 var(--sans);color:var(--faint);margin-top:2px}
.asrc em{display:block;font-style:normal;font:400 9px/1.5 var(--mono);
  color:rgba(93,102,118,.75);margin-top:3px}
.asrc a{display:inline-block;font:600 9.5px/1 var(--sans);color:var(--accent);
  margin-top:4px;text-decoration:none}
.asrc a:hover{text-decoration:underline}

/* ===========================================================================
   LEGEND + TRANSIENTS
   =========================================================================== */
#legend{position:absolute;left:14px;bottom:var(--dock-gap);z-index:20;padding:11px 13px;
  transition:opacity .25s}
#legend .key{display:flex;align-items:center;gap:9px;padding:3.5px 0;
  font:400 11px/1.3 var(--sans);color:#b6c0d0}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

/* Top-centre, under the bar. Bottom-right put it on top of the zoom control
   and inside the thumb's path on a trackpad. */
#toast{position:absolute;top:calc(var(--topbar-h) + 12px);left:50%;transform:translateX(-50%);
  max-width:440px;z-index:40;padding:11px 38px 11px 13px;
  font:400 11.5px/1.55 var(--sans);color:#ffd79a;display:none;cursor:pointer;
  border-color:rgba(255,178,36,.34);background:rgba(28,22,10,.95)}
#toast::after{content:'\00d7';position:absolute;top:9px;right:13px;font-size:16px;color:var(--faint)}

#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:18;
  padding:17px 22px;text-align:center;display:none;pointer-events:none;
  animation:rise .3s cubic-bezier(.16,1,.3,1)}
#hint b{display:block;font:700 13.5px/1.3 var(--sans);margin-bottom:5px}
#hint span{font:400 11.5px/1.55 var(--sans);color:var(--dim)}

#map.aim .maplibregl-canvas{cursor:crosshair}

/* The marker shows the PROBE DISC at its true radius, not a fixed dot. The
   check reduces over a disc about a plot wide, and a 14 px dot said nothing
   about how much ground that was — so a reader could not tell whether the
   verdict came from their plot or from the lake fifty metres away. */
.probe{position:relative;display:grid;place-items:center}
.probe .disc{position:absolute;border-radius:50%;border:1px solid currentColor;
  background:currentColor;opacity:.16}
.probe .ring{position:absolute;border-radius:50%;border:1px dashed currentColor;opacity:.5}
.probe .core{width:9px;height:9px;border-radius:50%;background:currentColor;
  box-shadow:0 0 0 2px rgba(7,8,11,.8), 0 0 12px currentColor;z-index:2}
.probe .pulse{position:absolute;width:11px;height:11px;border-radius:50%;
  background:currentColor;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(3.4);opacity:0}}

/* ===========================================================================
   MODAL
   =========================================================================== */
#modal{position:absolute;inset:0;z-index:50;background:rgba(4,5,8,.82);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:none;place-items:center;padding:40px}
#modal.on{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:min(740px,100%);max-height:84vh;overflow-y:auto;padding:28px 30px;
  animation:rise .3s cubic-bezier(.16,1,.3,1)}
.sheet h2{font:800 19px/1.25 var(--sans);letter-spacing:-.02em;margin-bottom:6px}
.sheet .lede{font:400 12.5px/1.65 var(--sans);color:var(--dim);margin-bottom:22px}
.case{padding:14px 0;border-top:1px solid var(--line)}
.case .t{font:700 12.5px/1.3 var(--sans);margin-bottom:5px}
.case .d{font:400 11.5px/1.65 var(--sans);color:var(--dim)}
.case .n{font-family:var(--mono);color:var(--v-conditions);font-weight:700;
  font-variant-numeric:tabular-nums}
.sheet a{color:var(--accent);text-decoration:none;font-size:10.5px}
.sheet a:hover{text-decoration:underline}
#modalClose{position:absolute;top:24px;right:28px;background:var(--surface);
  border:1px solid var(--line);color:var(--dim);width:32px;height:32px;border-radius:50%;
  font-size:18px;cursor:pointer;line-height:1;display:grid;place-items:center;
  transition:color .15s,border-color .15s}
#modalClose:hover{color:var(--text);border-color:var(--line-hot)}

/* ---------- certificate ----------
   Screen styling is incidental: this exists to be printed, and the print block
   below is the real design. */
.cert h3{font:700 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin:24px 0 9px;border-bottom:1px solid var(--line);padding-bottom:6px}
.chead{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.cref{text-align:right;flex:none;font:400 10px/1.5 var(--mono);color:var(--dim)}
.cref b{display:block;font-size:12px;color:var(--text);margin-bottom:3px}
.cert-decision{margin:20px 0 11px;padding:15px 18px;border-radius:var(--r-md);
  font:800 17px/1.2 var(--sans);letter-spacing:.02em;border:1px solid}
.cert-decision.reject{background:rgba(255,95,87,.13);color:#ff8880;border-color:rgba(255,95,87,.5)}
.cert-decision.refer{background:rgba(176,107,255,.13);color:#cfa6ff;border-color:rgba(176,107,255,.5)}
.cert-decision.conditions{background:rgba(255,178,36,.12);color:#f3c65c;border-color:rgba(255,178,36,.5)}
.cert-decision.clear{background:rgba(53,208,127,.12);color:#63d478;border-color:rgba(53,208,127,.5)}
.creason{margin:0 0 4px 18px;font:400 12px/1.75 var(--sans);color:#c3d2e6}
.creason li{margin-bottom:6px}
.crow{display:flex;justify-content:space-between;gap:20px;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:11.5px}
.crow span:first-child{color:var(--dim);flex:none;max-width:52%}
.crow span:last-child{text-align:right;font-family:var(--mono);font-size:11px;
  font-variant-numeric:tabular-nums}
.cfields{display:flex;gap:14px}
.cfields label{flex:1;font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);display:flex;flex-direction:column;gap:5px}
.cin{background:transparent;border:none;border-bottom:1px solid var(--line-hot);
  color:var(--text);font:400 12px/1.4 var(--sans);padding:5px 2px;outline:none}
.cin:focus{border-color:var(--accent)}
.csnap{width:100%;border-radius:var(--r-sm);border:1px solid var(--line);margin-top:5px}
.ccanon{font:400 9.5px/1.65 var(--mono);color:var(--dim);word-break:break-all;
  background:var(--sunken);padding:10px 12px;border-radius:var(--r-sm);
  border:1px solid var(--line)}
.cnote{font:400 11px/1.65 var(--sans);color:var(--dim);margin-top:9px}
.cbox{height:66px;border:1px solid var(--line-hot);border-radius:var(--r-sm);margin-top:5px}
.ccheck{font:400 11.5px/1.5 var(--sans);color:var(--dim);margin-top:10px}
.csign{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;margin-top:18px;
  font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.csign hr{border:none;border-top:1px solid var(--line-hot);margin-top:24px}
.cfoot{font:400 10.5px/1.7 var(--sans);color:var(--faint);margin-top:22px;
  border-top:1px solid var(--line);padding-top:14px}

/* Print the modal rather than generating a PDF: no library to load, no popup
   for a blocker to eat, nothing that needs the network, and the document
   stays on the projector while it prints. */
@media print{
  html,body{background:#fff;color:#000;overflow:visible;height:auto}
  #map,#top,#left,#right,#legend,#dock,#toast,#hint,#boot,#modalClose,
  #queueToggle,.noprint{display:none!important}
  #modal{position:static;display:block!important;background:none;backdrop-filter:none;padding:0}
  .sheet{width:100%;max-height:none;overflow:visible;border:none;box-shadow:none;
    background:#fff;backdrop-filter:none;padding:0;animation:none}
  .cert *,.sheet *{color:#000!important}
  .cert h3{color:#555!important;border-color:#bbb!important}
  .crow{border-color:#ddd!important}
  .cert-decision{border:2px solid #000!important;background:#fff!important}
  .ccanon{background:#f4f4f4!important;border-color:#bbb!important}
  .cbox,.csign hr,.cin{border-color:#888!important}
  .cfoot,.cnote{color:#444!important}
}

/* ===========================================================================
   BOOT
   =========================================================================== */
#boot{position:absolute;inset:0;z-index:60;background:var(--ink);display:grid;
  place-items:center;transition:opacity .6s;gap:0}
#boot.gone{opacity:0;pointer-events:none}
.bootin{display:flex;flex-direction:column;align-items:center;gap:16px}
.bootbar{width:150px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.bootbar i{display:block;height:100%;width:38%;border-radius:2px;background:var(--accent);
  animation:sweep 1.25s cubic-bezier(.65,0,.35,1) infinite}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(370%)}}
#boot span{font:600 10px/1 var(--mono);letter-spacing:.24em;color:var(--faint);
  text-transform:uppercase}

/* ===========================================================================
   NARROW
   Not a phone design. This is a desk tool: rails over a map, meant for a
   monitor. What this block does is stop it BREAKING on a small screen — the
   dock's 440 px floor and the header's non-wrapping row together push the
   document wider than the viewport and produce horizontal scroll, which makes
   the map undraggable. Single column, secondary furniture dropped, and the
   controls that decide something kept.
   =========================================================================== */
@media (max-width:1100px){
  :root{--rail-l:292px;--rail-r:340px}
  #left{width:264px} #right{width:312px}
  .segmented button{padding:8px 12px;font-size:11.5px}
  .segmented button .sd{display:none}
}
@media (max-width:900px){
  /* No left rail at all here, so the dock only has to clear the legend. */
  :root{--rail-l:196px;--rail-r:340px}
  #csvBtn span,#validateBtn span{display:none}
  #csvBtn,#validateBtn{padding:8px 9px}
  #left{display:none} #queueToggle{display:none}
}
@media (max-width:700px){
  #top{height:auto;min-height:52px;flex-wrap:wrap;gap:8px;padding:8px 10px}
  .brand em,.vr{display:none}
  .brand b{font-size:12.5px}
  #city{max-width:140px;font-size:11px}
  .segmented{margin-left:auto;margin-right:0}
  .segmented button{padding:7px 10px;font-size:11px}
  #validateBtn{display:none}
  #legend{display:none}
  #right{left:10px;right:10px;width:auto;top:auto;
    bottom:calc(var(--dock-gap) + 132px);max-height:46vh}
  #dock{left:10px;right:10px;max-width:none;bottom:10px}
  #timeline{padding:11px 13px}
  #play{width:34px;height:34px}
  #year{font-size:18px}
  #caption{display:none}
  .ticks{font-size:8.5px}
  .drivers{grid-template-columns:1fr}
  #toast{left:10px;right:10px;transform:none;max-width:none}
}
</style>
</head>
<body>

<div id="map"></div>

<header id="top">
  <div class="brand">
    <span class="mark">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="20" height="20" rx="5" stroke="rgba(255,255,255,.18)"/>
        <path d="M4.5 13.2c1.6 0 1.6-2.2 3.2-2.2s1.6 2.2 3.2 2.2 1.6-2.2 3.2-2.2 1.6 2.2 3.2 2.2"
              stroke="#4d9fff" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M4.5 8.4c1.6 0 1.6-2.2 3.2-2.2s1.6 2.2 3.2 2.2"
              stroke="#1f6feb" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
        <path d="M12 16.6h5.3" stroke="#ff5f57" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <b>Vanished Blue Grid</b><em>FORENSIC</em>
  </div>

  <span class="vr"></span>
  <select id="city" title="Study area"></select>

  <div class="segmented" id="modes">
    <button data-mode="timeline" class="on"><span class="sd"></span>Timeline</button>
    <button data-mode="approval"><span class="sd"></span>Plot check</button>
    <button data-mode="impact"><span class="sd"></span>Downstream</button>
  </div>

  <button class="btn" id="validateBtn" title="How this compares with the municipal record">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1.2l4.6 2v3.9c0 2.8-1.9 4.7-4.6 5.7-2.7-1-4.6-2.9-4.6-5.7V3.2L7 1.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5 7l1.5 1.5L9.4 5.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Validation</span>
  </button>
  <button class="btn" id="csvBtn" title="Download the ranked list as CSV">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1.6v7.6m0 0L4.2 6.4M7 9.2l2.8-2.8M2 11.3h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Export CSV</span>
  </button>
</header>

<button class="btn panel over-map" id="queueToggle" title="Show the ranked list">
  <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M2 7h10M2 10.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  <span id="queueToggleLabel">Sites</span>
</button>

<aside id="left" class="panel over-map">
  <div class="phead">
    <span class="lbl" id="leftTitle">Priority sites</span>
    <span class="pill" id="leftCount"></span>
    <button class="iconbtn" id="queueHide" title="Hide">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M4 2.5L8.5 7 4 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="scroll" id="list"></div>
</aside>

<aside id="right">
  <div class="scroll" id="rightScroll">
    <section class="panel over-map" id="paramsBar">
      <div class="pfield">
        <span class="lbl">Rule</span>
        <select id="ruleSel" title="Which buffer regime to apply"></select>
      </div>
      <div class="pfield">
        <span class="lbl">Plot</span>
        <span class="numin">
          <input id="plotM" type="number" min="5" max="300" step="5" value="30"
                 title="Assumed plot frontage; sets the probe radius">
          <span>m frontage</span>
        </span>
      </div>
    </section>

    <section class="panel over-map" id="verdict"></section>

    <section class="panel over-map" id="statsCard">
      <div class="phead"><span class="lbl" id="statsTitle">Catchment ledger</span></div>
      <div id="stats"></div>
      <div class="bar"><i id="lossBar" style="width:0"></i></div>
    </section>
  </div>
</aside>

<div class="panel over-map" id="legend"></div>
<div class="panel over-map" id="toast"></div>
<div class="panel over-map" id="hint"></div>

<div id="dock">
  <section class="panel over-map" id="answerPanel">
    <div class="ahead" id="answerHead"></div>
    <div class="scroll" id="answer"></div>
  </section>

  <div id="askDock">
    <div class="chips" id="askChips"></div>
    <div class="panel over-map askbar">
      <span class="qi">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M6.2 6.3c.15-.9.93-1.5 1.86-1.5 1.03 0 1.85.72 1.85 1.66 0 1.5-1.8 1.4-1.8 2.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8.05" cy="11.2" r=".78" fill="currentColor"/></svg>
      </span>
      <input id="askQ" placeholder="Ask about this plot…" autocomplete="off" spellcheck="false">
      <kbd id="askHint">&#8629;</kbd>
      <button class="btn primary" id="askBtn">Ask</button>
    </div>
  </div>

  <footer class="panel over-map" id="timeline">
    <div class="trow">
      <button id="play" title="Play the transition (space)">&#9654;</button>
      <div class="tcore">
        <div class="thead">
          <div id="year">2003&ndash;07</div>
          <div id="caption">The blue grid as the satellite record found it.</div>
        </div>
        <input type="range" id="slider" min="0" max="100" value="0">
        <div class="ticks"><span>2003&ndash;07 &middot; Landsat 5</span><span>crossfade</span><span>Sentinel-2 &middot; 2023&ndash;25</span></div>
      </div>
    </div>
  </footer>
</div>

<div id="modal"><div class="panel sheet" id="sheet"></div><button id="modalClose">&times;</button></div>

<div id="boot">
  <div class="bootin">
    <div class="bootbar"><i></i></div>
    <span>Reading the satellite record</span>
  </div>
</div>

<script>
'use strict';

// ===========================================================================
// CONFIG
// ===========================================================================
// bounds are [west, south, east, north] and MUST match the AOI rectangle used
// by gee_blue_grid.js for that city, or every overlay is pinned to the wrong
// ground and the tool quietly lies.
var CITIES = {
  bengaluru: {
    label: 'Bengaluru', sub: 'Bellandur & Varthur catchment',
    bounds: [77.63, 12.90, 77.75, 12.97],
    zones: 'Bommanahalli & Mahadevapura',
    hotspots: [
      {name:'HSR Layout / Parangipalya', lon:77.6403, lat:12.9114, px:244},
      {name:'Kasavanahalli',             lon:77.6759, lat:12.9324, px:138},
      {name:'Haralur',                   lon:77.6459, lat:12.9236, px:112},
      {name:'Panathur',                  lon:77.7078, lat:12.9324, px:71}
    ]
  },
  chennai: {
    label: 'Chennai', sub: 'Pallikaranai marsh',
    bounds: [80.180, 12.900, 80.280, 12.985],
    zones: 'Perungudi & Sholinganallur',
    hotspots: []
  }
};

// Raster layers, painted bottom to top.
var LAYERS = ['rgb2005','rgb2025','floodprone','flowpath','historic','present','encroached'];

// Lookup tables, never drawn. These carry measurements rather than colour:
// buffers packs three distances in metres into R/G/B, history packs the last
// year water was recorded, and hydro packs upstream catchment. Drawing them
// would be meaningless; sampling them is the whole point.
//
// Membership of this list is what gets a layer decoded at 1:1 with smoothing
// off. A measurement layer left out of it is quietly area-averaged into byte
// codes that were never computed.
var DATA_LAYERS = ['buffers','history','hydro'];
// Exactly the palette gee_blue_grid.js renders the PNGs with. Changing a
// colour here without changing it there makes the legend lie.
var PALETTE = {
  historic:'#1f6feb', present:'#58a6ff', encroached:'#f85149',
  flowpath:'#d29922', floodprone:'#bc8cff'
};

var BLANK = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

// Buffer distances are OPERATOR CONFIGURATION, not a legal determination by
// this tool. Karnataka has more than one figure in play and an officer knows
// which binds them, so the tool applies the rule it is told to and records
// which one on the certificate.
var RULESETS = {
  state: {id:'state', label:'State revision \u00b7 30 m lake',
          lakeM:30, drainM:25,
          cite:'State revision of the NGT buffer, as applied by BBMP.'},
  ngt:   {id:'ngt', label:'NGT / Supreme Court \u00b7 75 m lake',
          lakeM:75, drainM:50,
          cite:'NGT O.A. 222/2014 (Forward Foundation v. State of Karnataka), '
             + 'upheld by the Supreme Court and applied prospectively.'}
};

// Numbers the tool computes with, and their single authoritative home.
//
// Each of these is DECLARED IN THE CORPUS, on the chunk that cites its source,
// and the value below is a bootstrap copy so the plot check still runs before
// corpus.json has loaded. check_corpus.py scrapes this block and fails if the
// two ever disagree, which is the same cross-file consistency test
// verify_encoding.py runs between two rasters.
//
// Everything here is a placeholder until the sourcing marked verify: true in
// the corpus has been done. The runoff figures in particular are stated
// defaults, not measurements of this city.
// @params
var PARAMS = {
  P_mm:          60,     // design storm depth, mm in one hour
  P_pm:          24,     // and its uncertainty, dominated by the return period
  P_annualMm:    970,    // annual rainfall, for the yearly figure
  C_pre:         0.30,   // runoff coefficient, open ground
  C_post:        0.85,   // runoff coefficient, roof and paving
  dC:            0.55,   // the change, which is what displacement turns on
  dC_pm:         0.15,
  tankerL:       6000,   // a volume nobody can picture, made picturable
  handDeepM:     1,      // inside a water path: retention and plinth
  handLowM:      2,      // flood-prone, as the layer defines it
  handMarginalM: 5,
  upaCeilKm2:    1000,   // the log-packing ceiling in hydro.png's red channel
  trunkUpaKm2:   10
};
// @end-params

// hydro.png is the one layer not read as a straight byte. Decoding the log
// packing here, once, next to the encoder it mirrors in gee_blue_grid.js.
var UPA_DEN = Math.log(1 + PARAMS.upaCeilKm2) / Math.LN10;
function decodeUpa(code){
  return code === null ? null : Math.pow(10, (code/255) * UPA_DEN) - 1;
}

// The error budget, stated once and used everywhere a distance is judged.
//   JRC 30 m pixel, shoreline position   +/- 15 m
//   distance-transform quantum at 10 m   +/-  7 m
//   PNG georeferencing, one pixel        +/-  6 m
//   thumbnail resample and byte decode         0  (nearest, exact)
// In quadrature, about 20 m. It is dominated by the source resolution, not by
// anything this tool does, which is why finer encoding would buy nothing.
var UNCERTAINTY_M = 20;

var state = {
  city: 'bengaluru', mode: 'timeline', t: 0, playing: false,
  rule: 'state', plotM: 30, lastCheck: null,
  stats: null, buildings: null, samplers: {}, have: {}, marker: null, selected: null, ready: false,
  // The retrieval layer. corpus is city-agnostic and fetched once; centroids
  // is rebuilt per city; lastAnswer is kept so a ruleset change can invalidate
  // an answer that was reasoned under the rule the officer has just left.
  corpus: null, centroids: null, lastAnswer: null, asking: false,
  queueOpen: true, probeEl: null
};

// ===========================================================================
// MAP
// ===========================================================================
var C = CITIES[state.city];
var map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      // Esri World Imagery sits underneath as a safety net: if a true-colour
      // export is missing the map still shows ground rather than a void.
      sat: { type:'raster', tileSize:256,
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        attribution:'Esri, Maxar · JRC Global Surface Water · MERIT Hydro · Google Open Buildings' }
    },
    layers: [{id:'sat', type:'raster', source:'sat'}]
  },
  bounds: [[C.bounds[0],C.bounds[1]],[C.bounds[2],C.bounds[3]]],
  fitBoundsOptions: {padding: pad()},
  // Required for getCanvas().toDataURL() on the certificate. It cannot be
  // enabled after construction, so it has to live here.
  preserveDrawingBuffer: true,
  attributionControl: {compact:true}
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'bottom-right');

function corners(b){ return [[b[0],b[3]],[b[2],b[3]],[b[2],b[1]],[b[0],b[1]]]; }

// Mean of the outer ring. Crude, and correct enough for a footprint this size
// against a 6.36 m pixel. Third caller, so it stops being written out inline.
function centroidOf(f){
  var g = f.geometry;
  var pts = g.type === 'Polygon' ? g.coordinates[0] : g.coordinates[0][0];
  var lon = 0, lat = 0;
  pts.forEach(function(p){ lon += p[0]; lat += p[1]; });
  return [lon/pts.length, lat/pts.length];
}

// Equirectangular, which at a few hundred metres and this latitude is exact
// to well inside the error budget and far cheaper than a haversine.
function metresBetween(lon1, lat1, lon2, lat2){
  var dx = (lon2-lon1) * 111320 * Math.cos(lat1*Math.PI/180);
  var dy = (lat2-lat1) * 110574;
  return Math.sqrt(dx*dx + dy*dy);
}

// The side rails are fixed width, so reserving room for them as a constant
// squeezes the map to a sliver on a narrow window. Scale the reservation with
// the viewport instead. Declared, not assigned, so hoisting covers the call in
// the map constructor above.
// A ring round the world with the study area punched out of it. Everything
// analysed is clipped to the AOI, so without this the imagery just stops at a
// hard rectangle and reads as a rendering fault. Dimming the outside instead
// makes the boundary look like what it is: the edge of the evidence.
function maskGeo(b){
  return {type:'Feature', geometry:{type:'Polygon', coordinates:[
    [[-179.9,-85],[179.9,-85],[179.9,85],[-179.9,85],[-179.9,-85]],
    [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]],[b[0],b[1]]]
  ]}};
}
function aoiGeo(b){
  return {type:'Feature', geometry:{type:'LineString', coordinates:
    [[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]],[b[0],b[1]]]}};
}

function pad(){
  var w = window.innerWidth;
  var side = w > 1280 ? 340 : w > 1000 ? 210 : 40;
  return {top:80, bottom: w > 1000 ? 140 : 110, left:side, right:side};
}

map.on('load', function(){
  map.addSource('mask', {type:'geojson', data: maskGeo(C.bounds)});
  map.addLayer({id:'mask', type:'fill', source:'mask',
    paint:{'fill-color':'#04060b','fill-opacity':0.55}});

  LAYERS.forEach(function(id){
    map.addSource(id, {type:'image', url:BLANK, coordinates:corners(C.bounds)});
    map.addLayer({id:id, type:'raster', source:id,
      paint:{'raster-opacity':0, 'raster-fade-duration':0}});
  });

  map.addSource('buildings', {type:'geojson', data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'b-fill', type:'fill', source:'buildings', paint:{
    'fill-color':['case',
      ['==',['get','verdict'],'RED_FORMER_WATER_BODY'], PALETTE.encroached,
      ['==',['get','verdict'],'RED_BLOCKS_DRAINAGE'], PALETTE.flowpath,'#8b949e'],
    'fill-opacity':0}});
  map.addLayer({id:'b-line', type:'line', source:'buildings',
    paint:{'line-color':'#fff','line-width':1.1,'line-opacity':0}});

  map.addSource('aoi', {type:'geojson', data: aoiGeo(C.bounds)});
  map.addLayer({id:'aoi-line', type:'line', source:'aoi', paint:{

  map.on('click','b-fill', function(e){ e.preventDefault(); selectBuilding(e.features[0]); });
  map.on('mouseenter','b-fill', function(){ if(state.mode!=='approval') map.getCanvas().style.cursor='pointer'; });
  map.on('mouseleave','b-fill', function(){ map.getCanvas().style.cursor=''; });
  map.on('click', function(e){ if(state.mode==='approval' && !e.defaultPrevented) checkPlot(e.lngLat); });

    document.getElementById('boot').classList.add('gone');

// ===========================================================================
// DATA LOADING
// ===========================================================================
function exists(url){
  return fetch(url,{method:'HEAD'}).then(function(r){return r.ok;}).catch(function(){return false;});
}

// Reads a PNG into an offscreen canvas so any point can be tested against it
// without a server. This is what makes the plot check instant and offline:
// the same rasters that are drawn on the map are also the lookup table.
//
// Sampling happens at a quarter of the export resolution. The underlying data
// is 30m and the probe covers a whole plot, so full resolution buys nothing
// and costs four times the decode and memory. Downscaling keeps smoothing on
// deliberately: it area-averages, so a thin feature survives as partial alpha
// rather than being dropped by nearest-neighbour.
var SAMPLE_MAX_W = 1024;
var PROBE_METRES = 35;

function makeSampler(url, b, exact){
  return new Promise(function(res){
    var img = new Image();
    img.onload = function(){
      // Masks tolerate downscaling: area-averaging a binary edge is a feature.
      // Measurement layers are decoded 1:1 with smoothing off. Averaging two
      // byte codes invents a distance or a year that never existed, and even
      // nearest-neighbour dropping of every other pixel can miss the true
      // minimum of a distance field, which is the number a buffer turns on.
      var sc = exact ? 1 : Math.min(1, SAMPLE_MAX_W / img.naturalWidth);
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth*sc));
      c.height = Math.max(1, Math.round(img.naturalHeight*sc));
      var ctx = c.getContext('2d',{willReadFrequently:true});
      if(exact) ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try {
        var midLat = (b[1]+b[3])/2;
        var metresWide = (b[2]-b[0]) * 111320 * Math.cos(midLat*Math.PI/180);
        res({w:c.width, h:c.height, mpp: metresWide/c.width,
             d:ctx.getImageData(0,0,c.width,c.height).data});
      } catch(err){ res(null); }
    };
    img.onerror = function(){ res(null); };
    img.src = url;
  });
}

// Reduces a named channel over the same disc. For a distance field the
// closest approach of the feature to the plot is what a buffer rule turns on,
// so 'min' is the correct reduction; for the year layer 'max' gives the most
// recent year any part of the plot held water.
function sampleCh(s, lon, lat, b, ch, mode, radiusM, minAlpha){
  if(!s) return null;
  // Alpha is only a validity flag on a layer whose bands all share one
  // projection. Where a layer mixes scales - history carries JRC at 30 m
  // beside MERIT at 90 m - Earth Engine resamples the combined mask and
  // writes the FRACTION into alpha, so real data arrives at alpha 17 or 166.
  // Demanding exactly 255 there discards precisely the pixels that have
  // values, silently, and every reading comes back null. Zero still means
  // outside the clip, so one is the honest floor for those layers.
  var aMin = minAlpha === undefined ? 255 : minAlpha;
  var x = Math.round((lon-b[0])/(b[2]-b[0]) * s.w);
  var y = Math.round((b[3]-lat)/(b[3]-b[1]) * s.h);
  var R = Math.max(0, Math.round((radiusM || PROBE_METRES) / s.mpp));
  var lo = mode === 'min', best = null;
  for(var dy=-R; dy<=R; dy++) for(var dx=-R; dx<=R; dx++){
    if(dx*dx+dy*dy > R*R) continue;
    var px = x+dx, py = y+dy;
    if(px<0||py<0||px>=s.w||py>=s.h) continue;
    var i = (py*s.w+px)*4;
    if(s.d[i+3] < aMin) continue;      // outside the study area: no evidence
    var v = s.d[i+ch];
    if(best === null) best = v;
    else if(lo ? v < best : v > best) best = v;
  }
  return best;
}

// A plot is far larger than one pixel, so the check probes a disc about a
// plot wide rather than a single point.
function sample(s, lon, lat, b){
  if(!s) return 0;
  var x = Math.round((lon-b[0])/(b[2]-b[0]) * s.w);
  var y = Math.round((b[3]-lat)/(b[3]-b[1]) * s.h);
  var R = Math.max(1, Math.round(PROBE_METRES / s.mpp)), best = 0;
  for(var dy=-R; dy<=R; dy++) for(var dx=-R; dx<=R; dx++){
    if(dx*dx+dy*dy > R*R) continue;
    var px = x+dx, py = y+dy;
    if(px<0||py<0||px>=s.w||py>=s.h) continue;
    var a = s.d[(py*s.w+px)*4+3];
    if(a>best) best = a;
  }
  return best/255;
}

function loadCity(key){
  state.city = key;
  var c = CITIES[key];
  state.samplers = {}; state.have = {}; state.selected = null; state.ready = false;
  // classList, not an inline style: an inline display:none outranks the
  // #verdict.on rule, so the next verdict rendered would never become visible.
  document.getElementById('verdict').classList.remove('on');
  hideAskDock();
  if(state.marker){ state.marker.remove(); state.marker=null; }

  // Painting the map must not wait on the plot-check lookup tables. Decoding
  // five full-size PNGs into canvases takes seconds, and a demo cannot open on
  // a black screen. The map goes up first; the samplers hydrate behind it and
  // are ready long before anyone reaches the plot-check tab.
  // The distance fields subsume four of the old mask samplers - a distance of
  // zero IS the mask - so only 'encroached' still needs one. Fewer canvases,
  // less memory, shorter hydrate chain.
  var SAMPLED = ['encroached'];

  if(map.getSource('mask')) map.getSource('mask').setData(maskGeo(c.bounds));
  if(map.getSource('aoi')) map.getSource('aoi').setData(aoiGeo(c.bounds));

  var jobs = LAYERS.map(function(id){
    var url = 'data/'+key+'/'+id+'.png';
    return exists(url).then(function(ok){
      state.have[id] = ok;
      map.getSource(id).updateImage({url: ok?url:BLANK, coordinates:corners(c.bounds)});
    });
  });

  // Measurement layers are probed but never attached to the map.
  jobs = jobs.concat(DATA_LAYERS.map(function(id){
    return exists('data/'+key+'/'+id+'.png').then(function(ok){ state.have[id] = ok; });
  }));

  // Sequential, so the large decodes never contend for the main thread at once.
  Promise.all(jobs).then(function(){
    return SAMPLED.concat(DATA_LAYERS).reduce(function(chain, id){
      return chain.then(function(){
        if(!state.have[id]) return;
        var exact = DATA_LAYERS.indexOf(id) !== -1;
        return makeSampler('data/'+key+'/'+id+'.png', c.bounds, exact)
          .then(function(sm){ state.samplers[id] = sm; });
      });
    }, Promise.resolve());
  }).then(function(){ state.ready = true; });

  jobs.push(
    fetch('data/'+key+'/stats.json').then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;}).then(function(j){ state.stats = j; })
  );
  jobs.push(
    fetch('data/'+key+'/flagged_buildings.geojson').then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;}).then(function(g){
        state.buildings = g;
        // Precomputed once here rather than per click. A linear scan over a
        // few thousand of these is under a frame; recomputing the centroids
        // inside the scan would not be.
        state.centroids = g ? g.features.map(function(f){
          var c = centroidOf(f);
          return {lon:c[0], lat:c[1], p:f.properties};
        }) : null;
        map.getSource('buildings').setData(g || {type:'FeatureCollection',features:[]});
      })
  );

  // City-agnostic and fetched once. Its absence is survivable: the plot check
  // and the templated answer both still work, they simply lose their citations.
  if(!state.corpus){
    jobs.push(
      fetch('data/corpus.json').then(function(r){return r.ok?r.json():null;})
        .catch(function(){return null;}).then(function(j){
          state.corpus = j;
          if(j) reconcileParams(j);
        })
    );
  }

  return Promise.all(jobs).then(function(){
    map.fitBounds([[c.bounds[0],c.bounds[1]],[c.bounds[2],c.bounds[3]]],
      {padding: pad(), duration:900});
    renderStats(); renderList(); renderLegend(); applyMode(); update();
    var missing = LAYERS.concat(DATA_LAYERS).filter(function(l){return !state.have[l];});
    if(missing.length) toast('Missing layers: '+missing.join(', ')+' — run gee_blue_grid.js for '+c.label+', then ./fetch_layers.sh '+key);
    else if(!state.buildings) toast('No flagged_buildings.geojson yet — run the Earth Engine export task.');
    else hideToast();
  });
}

// ===========================================================================
// TIMELINE
// ===========================================================================
function ramp(t,a,b){ return Math.max(0, Math.min(1, (t-a)/(b-a))); }

function update(){
  var t = state.t;
  // Three different time framings used to coexist here: a slider counting
  // 2005 to 2025, imagery that is a 2003-07 median against a 2023-25 median,
  // and water layers from JRC's 1984-99 and 2000-21 epochs. The readout now
  // names the composite actually on screen instead of inventing a year that
  // nothing in the data corresponds to.
  document.getElementById('year').textContent = t < .5 ? '2003–07' : '2023–25';
  document.getElementById('caption').textContent =
    t<.12 ? 'Surface water recorded 1984–99, over 2003–07 imagery.' :
    t<.45 ? 'Water retreats. The edges go first.' :
    t<.78 ? 'Construction reaches the lakebed.' :
            'Water still present 2000–21, over 2023–25 imagery. Red is what was built on the difference.';

  if(!map.getLayer('rgb2005')) return;
  var m = state.mode, bo;

  // Each mode answers a different question, so each gets its own layer mix.
  // Reusing the timeline's t outside the timeline would leave a plot check
  // being made against 2005 imagery, which is exactly the wrong ground.
  if(m === 'timeline'){
    // rgb2005 holds steady underneath while rgb2025 fades in on top, so the
    // crossfade never exposes the modern basemap mid-drag.
    set('rgb2005', state.have.rgb2005 ? 1 : 0);
    set('rgb2025', state.have.rgb2025 ? ramp(t,.05,.95) : 0);
    // The old shoreline never vanishes completely. It settles to a ghost so
    // the viewer keeps seeing where the water used to reach.
    set('historic',   .88 - .62*t);
    set('present',    .88*ramp(t,.10,.70));
    set('encroached', .95*ramp(t,.50,1));
    set('floodprone', 0);
    set('flowpath',   0);
    bo = .72*ramp(t,.70,1);
  } else if(m === 'approval'){
    // Every constraint visible at once on today's ground: this is the view an
    // approving officer needs, not a story about the past.
    set('rgb2005', 0);
    set('rgb2025', state.have.rgb2025 ? 1 : 0);
    set('historic', .46); set('present', .62); set('encroached', .95);
    set('floodprone', .28); set('flowpath', .55);
    bo = .38;
  } else {
    set('rgb2005', 0);
    set('rgb2025', state.have.rgb2025 ? 1 : 0);
    set('historic', .22); set('present', .55); set('encroached', .95);
    set('floodprone', .48); set('flowpath', .80);
    bo = .55;
  }
  if(map.getLayer('b-fill')){
    map.setPaintProperty('b-fill','fill-opacity',bo);
    map.setPaintProperty('b-line','line-opacity',bo*1.2);
  }
  function set(id,v){ if(map.getLayer(id)) map.setPaintProperty(id,'raster-opacity',v); }
}

var slider = document.getElementById('slider');
slider.addEventListener('input', function(){ stop(); state.t = slider.value/100; update(); });

var raf = null;
function stop(){ state.playing=false; if(raf) cancelAnimationFrame(raf); raf=null;
  document.getElementById('play').innerHTML='&#9654;'; }
document.getElementById('play').onclick = function(){
  if(state.playing){ stop(); return; }
  if(state.mode!=='timeline') setMode('timeline');
  state.playing = true; this.innerHTML='&#10073;&#10073;';
  if(state.t >= .999) state.t = 0;
  var t0 = performance.now(), from = state.t, dur = 9000*(1-from);
  (function step(now){
    if(!state.playing) return;
    var p = Math.min(1, (now-t0)/dur);
    state.t = from + (1-from)*p;
    slider.value = state.t*100; update();
    if(p<1) raf = requestAnimationFrame(step); else stop();
  })(t0);
};

// MODES
